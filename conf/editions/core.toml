# Edition definition (TODO.md ED.1, read by ctx.editions alone); the rules are in full.toml.
# The core edition (Rytis 2026-10-22, D-110): one codebase, fewer modules and datasets. M7 and
# M10 are left out. A reader's own files still enter through ctx reads and ctx gather --counts:
# a slug with no file in conf/datasets is the reader's own, and no edition refuses it.

[edition]
name = "core"
label = "Core course"
notes = "Step-1 immune cells, breast tissue and blood cells, a lung study and a pancreas study, through M1 to M6, M8 and M9."
modules = ["gather", "qc", "process", "quant", "de", "function", "ncrna", "genecard"]
# Step-1 (PRJEB49000) is Non-cancerous-blood, with Non-cancerous-blood-four-runs, four of its
# runs, the guide's worked example. BRCA-immune-cells-macrophages and BRCA-immune-cells-monocytes
# are the two halves of PRJNA483877. Lung-tissue-LUAD is PRJNA955664 (TODO.md ED.4),
# Pancreas-tissue-PAAD is PRJNA792551 (ED.8). Each name is made from its dataset's label (D-114).
datasets = ["Non-cancerous-blood", "Non-cancerous-blood-four-runs", "Breast-tissue-BRCA",
            "BRCA-immune-cells-macrophages", "BRCA-immune-cells-monocytes", "Lung-tissue-LUAD",
            "Pancreas-tissue-PAAD"]
# Lite pages (Rytis 2026-10-22, D-111): each module page shows only its figure cards and its
# results tables; no sections, Reproduce, check tables or notes. A card keeps its lead, "How
# to read this" and controls: lite means less text, not less to do (Rytis 2026-10-22).
page = "lite"
