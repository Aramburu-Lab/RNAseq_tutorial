# The Track A teaching subset of Step-1 (P2M S0.4, P3.0; D-042): 8 runs chosen by
# scripts/python/pick_teaching_subset.py from the gathered Step-1 sheet, fetched by fetchngs
# 1.12.0 into their own outdir and subsampled to 1M reads. Every table but [dataset] slug,
# label and subset_of, and [expect], is tier1.toml's own, so both curate one SDRF one way;
# tests/test_repo.py::test_subsets_curate_as_their_parent holds them equal. No contrasts, de,
# function or sanity: M5 and M6 run on tier1 only.

[dataset]
slug = "tier1_teach"
# The name pages show; the slug names files, so it keeps lowercase and underscores (D-014).
label = "Step-1 teaching subset"
# The outdir holds 8 of the SDRF's 210 runs: gather curates only their rows (D-042).
subset_of = "tier1"
ena_study = "PRJEB49000"
ena_secondary_study = "ERP133445"
arrayexpress = "E-MTAB-11190"
source = "Montaldo et al. 2022 Nat Immunol, doi:10.1038/s41590-022-01311-1, PMC7615267"

# BioStudies publishes no checksum: size and SHA-256 are from the first download, 2026-09-27,
# identical from both URLs.
[[resources]]
name = "sdrf"
urls = [
    "https://www.ebi.ac.uk/biostudies/files/E-MTAB-11190/E-MTAB-11190.sdrf.txt",
    "https://ftp.ebi.ac.uk/biostudies/fire/E-MTAB-/190/E-MTAB-11190/Files/E-MTAB-11190.sdrf.txt",
]
bytes = 108110
sha256 = "b34b846aafa8a111c3f23a00b1fead7d8b0d73ce2e178d4b1e4b51c455813b9e"
dest = "resources/datasets/tier1/E-MTAB-11190.sdrf.txt"

# The annotation the cluster run used (TODO.md cluster block, step 2), for the gene types of the
# rRNA fraction in `ctx qc` (D-022). Publisher MD5 289b91e5e95e8b0450d223246f10a12e
# (release_50/MD5SUMS), matched on the download of 2026-09-29, which measured the size and hash.
[[resources]]
name = "annotation_gtf"
urls = [
    "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.primary_assembly.annotation.gtf.gz",
]
bytes = 124650284
sha256 = "89bbad69a8c89fee5fadec0a2f14a098752d27a4ef7f24e4de9bac681e1b18f4"
dest = "resources/gencode/gencode.v50.primary_assembly.annotation.gtf.gz"

# Patterns are checked against the ENA read_run report of the study by
# tests/test_repo.py::test_guard_patterns_cover_study (runs ERR7425257-466, experiments
# ERX6994339-548, samples SAMEA11307688-897, secondary samples ERS8952829-53038, 2026-09-27)
# and against the SDRF's individual column.
[guard]
ids = ["PRJEB49000", "ERP133445", "E-MTAB-11190"]
patterns = [
    '\bERR7425\d{3}\b',
    '\bERX699\d{4}\b',
    '\bSAMEA11307[6-8]\d{2}\b',
    '\bERS895\d{4}\b',
    '\bUPN\d+\b',
]

[sdrf]
resource = "sdrf"
join = ["Comment[ENA_RUN]", "run_accession"]
cross_check = [["Source Name", "sample_title"]]

[columns.donor]
source = "Characteristics[individual]"
meaning = "Individual the sample came from (SDRF Characteristics[individual])."

[columns.cell_type]
source = "Characteristics[cell type]"
meaning = "Sorted cell population: normal-density (NDN) or low-density (LDN) neutrophils, monocytes, or a bone-marrow stage (BM_1 to BM_4)."
values = { NDN = "NDN", LDN = "LDN", Monocyte = "Monocyte", BM_1 = "BM_1", BM_2 = "BM_2", BM_3 = "BM_3", BM_4 = "BM_4" }

[columns.condition]
source = "Characteristics[condition]"
meaning = "Donor state: steady state, G-CSF mobilised donor, HSCT recipient, PDAC or IPMN patient."
values = { "Steady state" = "steady_state", "G-CSF" = "gcsf", HSCT = "hsct", PDAC = "pdac", IPMN = "ipmn" }

[columns.tissue]
source = "Characteristics[tissue]"
meaning = "PB, peripheral blood, or BM, bone marrow."
values = { PB = "PB", BM = "BM" }

[columns.time_point]
source = "Characteristics[hsct time point]"
meaning = "HSCT follow-up (fu1 16-27 days, fu2 28-40 days, fu3 over 180 days after transplant, PMC7615267 Methods); empty for other conditions."
values = { na = "", "1st follow up" = "fu1", "2nd follow up" = "fu2", "3rd follow up" = "fu3" }

[columns.isolation]
source = "Characteristics[cell isolation strategy]"
meaning = "How the cells were isolated; differs between groups of monocytes (critique M9)."
values = { "FACS sorting" = "facs", "Neutrophil Isolation kit" = "neutrophil_kit", "CD14 Microbeads" = "cd14_beads", "CD15 Microbeads" = "cd15_beads" }

[columns.sex]
source = "Characteristics[sex]"
meaning = "Recorded sex of the individual; empty where the SDRF has none."
values = { M = "M", F = "F", "" = "" }

[columns.donor_sex]
source = "Characteristics[donor sex]"
meaning = "Sex of the stem-cell donor, for HSCT recipients; empty otherwise."
values = { M = "M", F = "F", na = "" }

[order]
time_point = ["", "fu1", "fu2", "fu3"]

[derived.batch]
bins = { short = [75, 76], long = [101] }

# Measured 2026-09-30 from the tier1 sheet of 2026-09-29, restricted to the 8 runs of the
# P3.0 block: 4 donors, each with one NDN and one monocyte run; healthy and G-CSF at 76 nt,
# healthy and PDAC at 101 nt.
[expect]
runs = 8

[expect.counts.read_length]
"76" = 4
"101" = 4

[expect.counts.condition]
steady_state = 4
gcsf = 2
pdac = 2

[expect.counts.cell_type]
NDN = 4
Monocyte = 4

[expect.counts.tissue]
PB = 8

[expect.counts.donor]
UPN5 = 2
UPN11 = 2
UPN16 = 2
UPN57 = 2
