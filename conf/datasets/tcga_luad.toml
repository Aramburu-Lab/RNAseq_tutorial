# 2025-08-22, GENCODE 47; Rytis 2026-10-08), not downloaded again: this root links
# data/raw/gtex_v11 to the one copy, and ctx setup registers each file in place by its hash.
[[resources]]
name = "gtex_gene_tpm"
urls = ["https://storage.googleapis.com/adult-gtex/bulk-gex/v11/rna-seq/GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_gene_tpm.gct.gz"]
