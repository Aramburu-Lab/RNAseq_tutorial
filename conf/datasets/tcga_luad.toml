# TCGA lung adenocarcinoma: the GDC folder M10.10 adds after breast. For now gather reads it,
# as tests/test_gdc.py's opt-in four-project test does (plan section 1.1); no M10 page is
# built from it until M10.10. The one committed place for this cohort's identifiers.

[dataset]
slug = "tcga_luad"
label = "TCGA lung adenocarcinoma"
source = "The Cancer Genome Atlas, project TCGA-LUAD, through the NCI Genomic Data Commons"

[gdc]
project = "TCGA-LUAD"
release = "Data Release 46.0 - August 10, 2026"
workflow = "STAR - Counts"
gene_model = "GENCODE v36"
protocol = "unstranded"
tumour = "Primary Tumor"
normal = "Solid Tissue Normal"
cdr_file = "TCGA-CDR-SupplementalTableS1.xlsx"
cdr_type = "LUAD"

[guard]
ids = ["TCGA-LUAD"]
patterns = ['\bTCGA-[A-Z0-9]{2}-[A-Z0-9]{4}\b']
