# TCGA lung adenocarcinoma: an M10 cohort since M10.10 (2026-10-09), and M8's.
# The one committed place for this cohort's identifiers.

[dataset]
slug = "tcga_luad"
label = "TCGA lung adenocarcinoma"
source = "The Cancer Genome Atlas, project TCGA-LUAD, through the NCI Genomic Data Commons"
# M9's cell-line row: HPA's lung cancer group (232 lines, read 2026-10-15; it also holds
# small cell and mesothelioma lines) and three adenocarcinoma lines common in EGFR studies,
# as HPA spells them. Their histology is from common use, not checked against Cellosaurus.
hpa_cell_lines = { group = "cell_RNA_lung_cancer", lines = ["A-549", "NCI-H1975", "HCC827"] }

[gdc]
project = "TCGA-LUAD"
release = "Data Release 46.0 - August 10, 2026"
workflow = "STAR - Counts"
gene_model = "GENCODE v36"
protocol = "unstranded"
tumour = "Primary Tumor"
normal = "Solid Tissue Normal"
# The miRNA and isoform files, read by ctx gather --mirna-dir --isoform-dir (M8).
mirna_workflow = "BCGSC miRNA Profiling"
cdr_file = "TCGA-CDR-SupplementalTableS1.xlsx"
cdr_type = "LUAD"
# TCGA's own attribution policy, quoted on every page beside the GDC's citation
# (https://www.cancer.gov/ccg/research/genome-sequencing/tcga/using-tcga-data/citing, read
# 2026-10-09; the GDC FAQ defers to each project's policy).
attribution = "tcga"

[guard]
ids = ["TCGA-LUAD"]
patterns = ['\bTCGA-[A-Z0-9]{2}-[A-Z0-9]{4}\b']

# M10.10 (2026-10-09). The build list: marker and proliferation genes, proposed for Rytis.
# OS: Liu et al. 2018 Table 3 recommends all four endpoints for LUAD; OS is the
# lung literature's. Variables are those the cohort's records carry: no ER, menopause or histology
# subtype (one histological type in the CDR); the box splits stage I-II against III-IV.
[clinical]
genes = ["NKX2-1", "SFTPC", "EGFR", "MKI67"]
endpoint = "OS"
variables = ["stage", "age", "sex"]
box = "stage_group"
therapy = "Chemotherapy"

# Liu et al. 2018 Table 3 (LUAD): events and censored per endpoint, read through PubMed
# Central E-utilities (PMC6066282) on 2026-10-09; the CDR copy reproduces all eight.
[clinical.published.table3]
source = "Liu et al. 2018 Cell, Table 3, LUAD: events and censored per endpoint"
OS = [188, 334]
PFI = [213, 309]
DFI = [92, 217]
DSS = [116, 370]

# Liu et al. 2018 Table 3's Use column for LUAD, read through PubMed Central E-utilities
# (PMC6066282) on 2026-10-18 (docs/plans/logs/wo13_v/liu_table3.log): a tick is recommended,
# a tick with an asterisk caution, a cross not_recommended; caution is the table's
# Explanation/Caution, verbatim. M10 prints them beside its endpoint.
[clinical.published.table3_use]
source = "Liu et al. 2018 Cell, Table 3, LUAD: recommended use of each endpoint"
OS = "recommended"
PFI = "recommended"
DFI = "recommended"
DSS = "recommended"

# M8's resources (plan docs/plans/2026-10-07_m8_real_data_plan_proposal.md, decisions 2, 3
# and 7; downloads approved and fetched by Rytis 2026-10-08, each folder's _manifest_*.tsv
# recording the bytes and SHA-256 measured on arrival). ctx setup registers each file already
# in place by its hash. The STAR counts' own annotation: GDC's GENCODE v36, md5
# c03931958d4572148650d62eb6dec41a as GDC's reference-files page lists it.
[[resources]]
name = "annotation_gtf"
urls = ["https://api.gdc.cancer.gov/data/be002a2c-3b27-43f3-9e0f-fd47db92a6b5"]
bytes = 44507458
sha256 = "81359865bab048361cbeaf91c9441aac4c700b63978e6691d579d78bf2322d30"
dest = "data/raw/gdc_gencode_v36/gencode.v36.annotation.gtf.gz"

