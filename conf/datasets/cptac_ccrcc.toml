# CPTAC clear cell renal cell carcinoma (Clark et al. 2019 Cell, doi:10.1016/j.cell.2019.10.007),
# the M7 tumour against normal-adjacent cohort after breast (TODO.md, work-order item 13 answer
# 11, Rytis 2026-10-09; docs/plans/2026-10-09_dataset_survey.md). The one committed place for
# this cohort's identifiers. RNA is GDC's open STAR - Counts through `ctx gather --gdc-dir`;
# protein is the paper's own table from the PDC study PDC000127.
#
# Census of the files on disk, 2026-10-14 (docs/plans/logs/H_ccrcc_census.log), the ceilings
# every count below is checked against: PDC000127 lists 124 cases and 208 aliquots (110 Primary
# Tumor, 84 Solid Tissue Normal, 9 Not Reported, 5 Cell Lines); the protein table has 207 sample
# columns, every one in the TMT10 mapping workbook's 23 proteome plexes, 84 cases with both a
# tumour and a normal column. GDC lists 277 STAR - Counts files: 202 tumour files of 110 cases,
# 75 normal files of 75 cases, every normal case also with a tumour.
#
# Clark 2019 analysed 103 of the 110 tumours: the clinical workbook (S050_S044 r4) calls 7
# non-clear-cell, and 2 of them, C3N-00435 and C3N-01175, have GDC tumour and normal files, so
# the paired contrast below holds them; GDC's metadata carries no histology to leave them out by.

[dataset]
slug = "cptac_ccrcc"
label = "CPTAC kidney clear cell"
source = "CPTAC clear cell renal cell carcinoma, Clark et al. 2019 Cell, doi:10.1016/j.cell.2019.10.007; protein from the Proteomic Data Commons study PDC000127, RNA from the NCI Genomic Data Commons project CPTAC-3"

# The paper's protein table: one TSV in the tarball, 6_CPTAC3_CCRCC_Whole_abundance_gene_
# protNorm=2_CB.tsv, log2 abundance per gene with each sample named by its PDC aliquot (Clark
# 2019 STAR Methods use this file for the mRNA-protein correlations). It is not GCT and carries
# no column annotation, so M7's reader (ctx.proteo.tables.read_gct) cannot open it and no
# [proteo] or [columns] table is declared yet. PDC's md5 0fa5f5b83969d0b12a177c912a206a77;
# size and SHA-256 measured on the download of 2026-10-09 (_manifest_cptac_ccrcc.tsv). Fetched
# by hand under the CPTAC data use agreement (D-057), so ctx setup registers it in place by hash
# and the kit ships derived tables only (D-064).
[[resources]]
name = "cptac_proteome"
urls = ["pdc://PDC000127/Supplementary_Data_Proteome_TMT.tar.gz"]
bytes = 15052030
sha256 = "7720ddd6caf3cc2877b892a3fa4a9d9fc33a4c853395477c13cc0bbfa8bbdf9d"
dest = "data/raw/cptac_ccrcc/Supplementary_Data_Proteome_TMT.tar.gz"

# CPTAC-3 holds kidney, lung, pancreas and other sites, so the primary-site filter keeps kidney;
# the folder was fetched for PDC000127's 110 tumour cases only. All 277 files are reverse
# stranded by the QC registry's strand rule (first-strand share 0.0573 to 0.0767, measured
# 2026-10-14 with ctx.gather.gdc's reader, docs/plans/logs/H_ccrcc_strand.log), so the counts
# come from stranded_second. No TCGA-CDR: CPTAC is not in it. M7's rules are registered in
# docs/plans/2026-10-14_cptac_ccrcc_m7_rules.md until [proteo] can be declared.
[gdc]
project = "CPTAC-3"
release = "Data Release 46.0 - August 10, 2026"
workflow = "STAR - Counts"
gene_model = "GENCODE v36"
protocol = "stranded_second"
tumour = "Primary Tumor"
normal = "Solid Tissue Normal"
primary_site = "Kidney"

# Case IDs (C3L-00004, C3N-00148). Aliquot IDs (CPT followed by digits) are not guarded:
# tests/test_gdc.py builds a made-up one for the reader's CPTAC path.
[guard]
ids = ["PDC000127"]
patterns = ['\bC3[LN]-\d{5}\b']

# M5 on this project: every patient with a tumour and a normal file taken by
# ctx.gather.gdc.chosen, paired. n is the pairs `ctx gather --gdc-dir` kept on 2026-10-14.
[[contrasts]]
name = "tumour_normal"
variable = "condition"
reference = "normal"
tested = "tumour"
design = "~donor + group"
paired = true
n = [75, 75]

[de]
featured = "tumour_normal"
