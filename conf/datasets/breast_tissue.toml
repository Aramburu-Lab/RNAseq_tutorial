# ENA's read_run report of PRJNA393443 (2026-10-09): runs SRR5811633-735, experiments
# SRX2990193-295, samples SAMN07333265-367, SRS2342115-217; GSMs GSM2696500-602; titles
# RNA140128LC_<n> and RNA150213LC_<well>.
[guard]
ids = ["PRJNA393443", "SRP111343", "GSE100925"]
patterns = [
    '\bSRR581(?:16|17)\d{2}\b',
    '\bSRX299(?:01|02)\d{2}\b',
    '\bSAMN07333[23]\d{2}\b',
    '\bSRS2342[12]\d{2}\b',
    '\bGSM269(?:65|66)\d{2}\b',
    '\bRNA1(?:40128|50213)LC\w*',
]

[sdrf]
file = "breast_tissue.tsv"
join = ["run_accession", "run_accession"]
cross_check = [["gsm", "sample_alias"], ["title", "sample_title"]]

[columns.donor]
source = "donor"
meaning = "The sample's GEO title; no record names its patient (63 patients for 103 samples)."

[columns.cell_type]
source = "cell type"
meaning = "Whole tissue; GEO fills its cell-type field for tumours only."
values = { "Whole human breast tumor" = "tissue", "--" = "tissue" }

[columns.condition]
source = "tissue"
meaning = "Tissue as GEO records it: tumour, adjacent normal, normal breast, prophylactic surgery, or unknown."
values = { "Breast tumor" = "tumour", "Adjacent normal" = "adjacent_normal", "Normal Breast" = "normal_breast", "Prophylactic Mastectomy" = "prophylactic_mastectomy", "Prophylactic Mammoplasty" = "prophylactic_mammoplasty", "No clinical information available" = "unknown" }

[columns.library_run]
source = "library_run"
meaning = "The title's prefix, RNA140128LC or RNA150213LC: two library runs, by the dates they carry."

[columns.in_paper]
source = "description"
meaning = "yes where GEO holds the paper's FPKMs for the sample, no where it says the sample was not in the publication."
values = { "" = "yes", "No fpkms submitted for this sample because it was not included in current publication" = "no" }

[columns.histology]
source = "histology"
meaning = "Tumour histology as GEO records it; -- for non-tumour samples."

[columns.her2_status]
source = "her2 status"
meaning = "HER2 immunohistochemistry score as GEO records it, free text; -- for non-tumour samples."

[derived.batch]
bins = { "Reads 50 nt" = [50], "Reads 100 nt" = [100] }

[expect]
runs = 103

[expect.counts.read_length]
"50" = 80
"100" = 23

[expect.counts.condition]
tumour = 51
adjacent_normal = 38
normal_breast = 7
prophylactic_mastectomy = 3
prophylactic_mammoplasty = 2
unknown = 2

[expect.counts.library_run]
RNA140128LC = 54
RNA150213LC = 49

[expect.counts.in_paper]
yes = 50
no = 53

# The course's comparison, not the paper's (header). Library run and read length are partly
# confounded with tissue: 39 of 51 tumours sit in RNA140128LC at 50 nt, 27 of 38 adjacent normals
# in RNA150213LC, 16 of them at 100 nt. Unpaired, since no record names a patient.

[[contrasts]]
name = "tumour_adjacent_naive"
label = "Tumour against adjacent normal, no batch term"
variable = "condition"
reference = "adjacent_normal"
tested = "tumour"
n = [38, 51]

[[contrasts]]
name = "tumour_adjacent"
label = "Tumour against adjacent normal, library run and read length in the design"
variable = "condition"
reference = "adjacent_normal"
tested = "tumour"
n = [38, 51]
design = "~library_run + batch + group"

[de]
featured = "tumour_adjacent"
scatters = [["tumour_adjacent_naive", "tumour_adjacent"]]

[de.lessons]
"Batch" = ["tumour_adjacent_naive", "tumour_adjacent"]

[[de.pca]]
name = "tissue"
filters = { condition = ["tumour", "adjacent_normal"] }
factors = ["condition", "library_run", "batch"]

[function]
gene_sets = "msigdb_hallmark"
licence = "MSigDB Hallmark v2026.1.Hs, (c) Broad Institute, MIT and the Regents of the University of California, under CC BY 4.0 (gsea-msigdb.org msigdb_license_terms.jsp, read 2026-09-27)."
featured_set = "HALLMARK_ADIPOGENESIS"
running = ["tumour_adjacent", "HALLMARK_ADIPOGENESIS"]

# M8 (ED.3, Rytis 2026-10-22): the biotype half alone, from these counts. A standard
# RNA-seq library holds no mature miRNAs, and this dataset has no small-RNA library, so no
# [ncrna.mirna]. Featured: [de]'s featured contrast. No [ncrna.sanity]: no M8 rule is
# registered for this dataset.
[ncrna]
featured = "tumour_adjacent"
# Pairs the lncRNA neighbour select offers, smallest residual q first.
pairs = 50

# Registered before any ctx de run on this dataset (TODO.md, work-order item 13 answers, item 8).
# The counts were on this Mac before the rules; no expression value, fit or enrichment was read
# for them. A failing rule is reported, never retuned. Rytis reviews these before ctx de.
# No finding the paper published on these data maps onto a metric ctx de computes (header), so
# the gating rules are the course's health checks and the recorded one the course's own claim.

[sanity]
# The commit that last changed this line is this dataset's registration.
registered = "2026-10-09 09:56"

[[sanity.rules]]
id = "TIS1"
text = "Tumour and adjacent normal separate on the PCA."
source = "course health check; not a finding of Cassetta 2019, which compares no tissues on these data"
conditions = [{ metric = "permanova.tissue.condition.p", op = "<", value = 0.05 }]

[[sanity.rules]]
id = "TIS2"
text = "The p-value histogram of the adjusted contrast peaks at 0 over a flat floor."
source = "course health check, as Step-1's R2"
conditions = [{ metric = "phist.tumour_adjacent.low", op = ">=", other = "phist.tumour_adjacent.flat", times = 2 }]

[[sanity.rules]]
id = "TIS3"
text = "Recorded, not gating: adipogenesis genes lower in tumour than in adjacent normal tissue."
source = "TODO.md, Phase 4 breast row: adipocyte genes higher in adjacent normal in 54 TCGA pairs, per a conference abstract, to be confirmed on our own run before it is taught"
gate = false
conditions = [{ metric = "gsea.tumour_adjacent.HALLMARK_ADIPOGENESIS.nes", op = "<", value = 0 }]
