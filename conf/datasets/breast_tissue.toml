# GSE100925 breast tissue (P4.0, TODO.md "Phase 4"; counted by nf-core/rnaseq 3.27.0, job
# 47504033): 103 single-end runs, one per GEO sample. GEO's series names Cassetta et al. 2019 as
# its publication (Series_pubmed_id 30930117), where it is "cohort 3", whole-tumour RNA-seq from
# Duke University (Methods). Curated from its own table, breast_tissue.tsv: GEO's per-sample
# records (brief SOFT of GSE100925's samples, retrieved 2026-10-09, SHA-256
# 08d5f86020c35c9c41d32fec9d265a95544d584b0a15feceb32da29d1bcf628d), values verbatim,
# one row per ENA run (read_run report, 2026-10-09), joined on the run and cross-checked on the
# GSM and title; `library_run` is the title before '_'. Paper: 50 bp single-end (Methods); ENA's
# counts give 100 nt for 23 runs (below). Tallied from those records: tissue Breast tumor 51,
# Adjacent normal 38, Normal Breast 7, Prophylactic Mastectomy 3, Prophylactic Mammoplasty 2, no
# clinical information 2 (lessons.md: GEO's title says tumours only). 50 records carry the
# paper's FPKMs (47 tumours, 2 mammoplasties, 1 mastectomy); the other 53 say "not included in
# current publication". The series design says 103 samples from 63 patients, but no record names
# its patient, so tumour and adjacent normal cannot be paired and each sample counts as its own
# individual. Read length by ENA's counts: 50 nt (80 runs), 100 nt (23, all in RNA150213LC).
#
# The paper's own comparisons on these data do not map onto the records: it ranks the 47 tumours
# by a CSF1-response signature (K-means) and by PAM50 subtype, both computed from expression, and
# compares a TAM-signature score across them (Fig. 3A and 3B). It compares no tissue against
# another. The contrasts below are the course's, tumour against adjacent normal, labelled so.

[dataset]
slug = "breast_tissue"
# The name pages show; the slug names files, so it keeps lowercase and underscores (D-014).
label = "Breast tumour and adjacent tissue"
ena_study = "PRJNA393443"
ena_secondary_study = "SRP111343"
geo = "GSE100925"
source = "Cassetta et al. 2019 Cancer Cell 35:588, doi:10.1016/j.ccell.2019.02.009, PMID 30930117, PMC6472943 (cohort 3)"

[[resources]]
name = "msigdb_hallmark"
urls = [
    "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2026.1.Hs/h.all.v2026.1.Hs.symbols.gmt",
]
bytes = 48686
sha256 = "eecaf6dad908334ae885406ec72bdc0646d8917588ed7c219fac92fc5363f596"
dest = "resources/msigdb/h.all.v2026.1.Hs.symbols.gmt"

[[resources]]
name = "annotation_gtf"
urls = [
    "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.primary_assembly.annotation.gtf.gz",
]
bytes = 124650284
sha256 = "89bbad69a8c89fee5fadec0a2f14a098752d27a4ef7f24e4de9bac681e1b18f4"
dest = "resources/gencode/gencode.v50.primary_assembly.annotation.gtf.gz"

# GTEx V11 for M9's gene cards, the same four entries as tcga_brca.toml (Rytis 2026-10-22):
# ctx setup registers each file in place by its hash, never downloading it again.
[[resources]]
