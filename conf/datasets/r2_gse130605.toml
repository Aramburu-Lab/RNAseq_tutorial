conditions = [{ metric = "gene.tumour_normal.HOXB-AS4.lfc", op = ">=", value = 1.0 }, { metric = "gene.tumour_normal.HOXB-AS4.padj", op = "<", value = 0.05 }]

[[sanity.rules]]
