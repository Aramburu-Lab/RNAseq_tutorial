# Cassetta et al. 2019 blood monocytes (TODO.md, the breast_mono download and count, job
# 47520582): the 94 GEO samples of GSE117970 whose extract protocol is the monocyte one, 102
# paired 2 x 100 nt runs (8 samples sequenced twice, merged by nf-core/rnaseq). Curated from its
# own table, breast_mono.tsv: GEO's per-sample records (brief SOFT of GSE117970's samples,
# retrieved 2026-10-09, SHA-256 eb80bb5b44fcdc8f34e675af88d09d9cc1f715b99ce0cadd9fb3d230db02bd00),
# values verbatim, one row per ENA run (read_run report, 2026-10-09), joined to fetchngs on the run
# and cross-checked on the GSM and title; `donor` is the title before ':'; `sex` is F for every
# sample from the paper's text, since GEO records none. Tallied from those records, samples: condition Normal 50, Breast
# cancer 34 (4 of them DCIS by pathology, all in batch 6), Endometrial cancer 10; sequencing batch
# 1 (13), 3 (5), 4 (20), 5 (15), 6 (41).
#
# GEO does not say which samples are total and which non-classical monocytes. The paper sorted
# non-classical monocytes from 6 breast, 7 endometrial and 5 healthy women, and total monocytes
# from 45 healthy women, 32 with breast and 3 with endometrial cancer (Results, first section).
# Batches 1 and 3 together hold exactly 5 normal, 6 breast and 7 endometrial samples, and batches
# 4 to 6 hold exactly 45 normal and 3 endometrial; so `cell_type` is read from the batch below.
# That is an inference, not a GEO field. Breast total monocytes are then 28 here against the
# paper's 32: GEO lists 34 breast samples where 32 + 6 = 38 (TODO.md, Phase 4 breast row).
# Titles MON103-107 (batch 5) and mon103-107 (batch 6) are kept apart, as GEO's numbering is: mon112
# is a batch-6 breast sample and MON112 a batch-5 endometrial one, so the two series of numbers name
# different people at least once. The paper's 45 healthy counts both sets.

[dataset]
slug = "breast_mono"
# The name pages show; the slug names files, so it keeps lowercase and underscores (D-014).
label = "Breast-cancer monocytes"
ena_study = "PRJNA483877"
ena_secondary_study = "SRP155941"
geo = "GSE117970"
source = "Cassetta et al. 2019 Cancer Cell 35:588, doi:10.1016/j.ccell.2019.02.009, PMID 30930117, PMC6472943"

[[resources]]
name = "msigdb_hallmark"
urls = [
    "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2026.1.Hs/h.all.v2026.1.Hs.symbols.gmt",
]
bytes = 48686
sha256 = "eecaf6dad908334ae885406ec72bdc0646d8917588ed7c219fac92fc5363f596"
dest = "resources/msigdb/h.all.v2026.1.Hs.symbols.gmt"

[[resources]]
name = "annotation_gtf"
urls = [
    "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.primary_assembly.annotation.gtf.gz",
]
bytes = 124650284
sha256 = "89bbad69a8c89fee5fadec0a2f14a098752d27a4ef7f24e4de9bac681e1b18f4"
dest = "resources/gencode/gencode.v50.primary_assembly.annotation.gtf.gz"

# The same study as breast_mac.toml, so the same guard.
[guard]
ids = ["PRJNA483877", "SRP155941", "GSE117970"]
patterns = [
    '\bSRR7631[5-6]\d{2}\b',
    '\bSRR85124[4-8]\d\b',
    '\bSRX4495[34]\d{2}\b',
    '\bSRX531(?:60|61)\d{2}\b',
    '\bSAMN09750[3-4]\d{2}\b',
    '\bSAMN0975[1-2][3-6]\d{2}\b',
    '\bSAMN108531\d{2}\b',
    '\bSRS36164\d{2}\b',
    '\bSRS36165\d{2}\b',
    '\bSRS43130\d{2}\b',
    '\bGSM331[6]\d{3}\b',
    '\bGSM358[5-6]\d{3}\b',
    '\b(?:MAC|MON|mon)\d+\b',
]

[sdrf]
file = "breast_mono.tsv"
join = ["run_accession", "run_accession"]
cross_check = [["gsm", "sample_alias"], ["title", "sample_title"]]

[columns.donor]
source = "donor"
meaning = "The sample's GEO title before the colon (MON<n> or mon<n>, kept apart); GEO gives no other individual ID."

[columns.cell_type]
source = "sequencing batch"
meaning = "Total or non-classical monocytes, inferred from the batch: batches 1 and 3 match the paper's non-classical n exactly (file header)."
values = { "Batch 1" = "nonclassical", "Batch 3" = "nonclassical", "Batch 4" = "total", "Batch 5" = "total", "6" = "total" }

[columns.condition]
source = "condition"
meaning = "The donor's state, from GEO's condition: healthy, breast cancer or endometrial cancer."
values = { "Normal" = "healthy", "Breast cancer" = "breast_cancer", "Endometrial cancer" = "endometrial_cancer" }

[columns.seq_batch]
source = "sequencing batch"
meaning = "Sequencing batch as GEO records it; the paper removes it with ComBat before limma."
values = { "Batch 1" = "batch1", "Batch 3" = "batch3", "Batch 4" = "batch4", "Batch 5" = "batch5", "6" = "batch6" }

[columns.pathology]
source = "pathology"
meaning = "Pathology as GEO records it: N/A for healthy donors; invasive breast cancer, DCIS, or an endometrial cancer type."

[columns.sex]
source = "sex"
meaning = "F for all: the paper's monocyte donors are women (Results; Methods, female healthy individuals). GEO records no sex."

[expect]
runs = 102

[expect.counts.read_length]
"100" = 102

[expect.counts.condition]
healthy = 52
breast_cancer = 37
endometrial_cancer = 13

[expect.counts.cell_type]
total = 78
nonclassical = 24

[expect.counts.seq_batch]
batch1 = 19
batch3 = 5
batch4 = 20
batch5 = 17
batch6 = 41

# The paper's four monocyte comparisons (Results, "Cancer Alters the Transcriptome of Human
# Monocytes"; upper-quartile normalisation, ComBat on the sequencing batch, then limma, FDR <= 0.05;
# Methods): breast TEMo against healthy, 865 DEGs (543 up, 322 down); endometrial TEMo against
# healthy, 997 (498 up, 499 down); non-classical breast against healthy, 139 (103 up, 36 down);
# non-classical endometrial against healthy, 576 (501 up, 75 down). The batch is a design term
# here, where the paper removed it first. One sample per individual; n read from gather's sheet
# with ctx.de.deseq.select_samples, 2026-10-09.

[[contrasts]]
name = "total_breast"
label = "Total monocytes, breast cancer against healthy"
variable = "condition"
reference = "healthy"
tested = "breast_cancer"
n = [45, 28]
design = "~seq_batch + group"
filters = { cell_type = ["total"] }

[[contrasts]]
name = "total_endometrial"
label = "Total monocytes, endometrial cancer against healthy"
variable = "condition"
reference = "healthy"
tested = "endometrial_cancer"
n = [45, 3]
design = "~seq_batch + group"
filters = { cell_type = ["total"] }

[[contrasts]]
name = "nonclassical_breast"
label = "Non-classical monocytes, breast cancer against healthy"
variable = "condition"
reference = "healthy"
tested = "breast_cancer"
n = [5, 6]
design = "~seq_batch + group"
filters = { cell_type = ["nonclassical"] }

[[contrasts]]
name = "nonclassical_endometrial"
label = "Non-classical monocytes, endometrial cancer against healthy"
variable = "condition"
reference = "healthy"
tested = "endometrial_cancer"
n = [5, 7]
design = "~seq_batch + group"
filters = { cell_type = ["nonclassical"] }

# A negative control the course adds, not the paper's: the healthy total-monocyte donors split by
# seed 42 within each sequencing batch.
[[contrasts]]
name = "healthy_null_split"
label = "Total monocytes of healthy donors, split in two at random"
variable = "condition"
reference = "healthy"
tested = "healthy"
n = [23, 22]
design = "~seq_batch + group"
filters = { cell_type = ["total"], condition = ["healthy"] }
split = { seed = 42, strata = "seq_batch" }

[de]
featured = "total_breast"

[[de.pca]]
name = "total"
filters = { cell_type = ["total"], condition = ["healthy", "breast_cancer"] }
factors = ["condition", "seq_batch"]
strata = "seq_batch"
one_per = "donor"

[[de.pca]]
name = "mono"
filters = {}
factors = ["cell_type", "condition", "seq_batch"]
one_per = "donor"

[function]
gene_sets = "msigdb_hallmark"
licence = "MSigDB Hallmark v2026.1.Hs, (c) Broad Institute, MIT and the Regents of the University of California, under CC BY 4.0 (gsea-msigdb.org msigdb_license_terms.jsp, read 2026-09-27)."
featured_set = "HALLMARK_ANGIOGENESIS"
running = ["total_breast", "HALLMARK_ANGIOGENESIS"]

# Registered before any ctx de run on this dataset (TODO.md, work-order item 13 answers, item 8).
# The counts were on this Mac before the rules; no expression value, fit or enrichment was read
# for them. A failing rule is reported, never retuned. Rytis reviews these before ctx de.
# The rules read the direction or order of what the paper published, never its counts.

[sanity]
# The commit that last changed this line is this dataset's registration.
registered = "2026-10-09 09:56"

[[sanity.rules]]
id = "MON1"
text = "Total monocytes of breast-cancer patients gain more genes than they lose against healthy women's."
source = "Cassetta 2019 Results: breast TEMo against Mo, 543 up and 322 down at FDR <= 0.05"
conditions = [{ metric = "calls.total_breast.up", op = ">", other = "calls.total_breast.down" }]

[[sanity.rules]]
id = "MON2"
text = "Non-classical monocytes of breast-cancer patients gain more genes than they lose."
source = "Cassetta 2019 Results: 103 up and 36 down at FDR <= 0.05; 5 against 6 here"
conditions = [{ metric = "calls.nonclassical_breast.up", op = ">", other = "calls.nonclassical_breast.down" }]

[[sanity.rules]]
id = "MON3"
text = "Non-classical monocytes of endometrial-cancer patients gain more genes than they lose."
source = "Cassetta 2019 Results: 501 up and 75 down at FDR <= 0.05; 5 against 7 here"
conditions = [{ metric = "calls.nonclassical_endometrial.up", op = ">", other = "calls.nonclassical_endometrial.down" }]

[[sanity.rules]]
id = "MON4"
text = "Total monocytes separate by cancer status on the PCA, labels permuted within sequencing batch."
source = "Cassetta 2019 Fig. 1A and 1B: PCA and clustering segregate Mo from TEMo, after batch correction"
conditions = [{ metric = "permanova.total.condition.p", op = "<", value = 0.05 }]

[[sanity.rules]]
id = "MON5"
text = "A seeded split of healthy donors finds at most 1 % of tested genes at padj < 0.05."
source = "negative control, as Step-1's R3; seed 42, split within sequencing batch"
conditions = [{ metric = "calls.healthy_null_split.significant", op = "<=", other = "calls.healthy_null_split.tested", times = 0.01 }]

[[sanity.rules]]
id = "MON6"
text = "Every sample expresses female sex."
source = "Cassetta 2019: the donors are women; XIST against RPS4Y1, DDX3Y, KDM5D, UTY and EIF1AY, as Step-1's R8"
conditions = [{ metric = "sex.disagree", op = "<=", value = 0 }]

[[sanity.rules]]
id = "MON7"
text = "The p-value histogram of the breast contrast peaks at 0 over a flat floor."
source = "course health check, as Step-1's R2; the paper reports 865 DEGs for this contrast"
conditions = [{ metric = "phist.total_breast.low", op = ">=", other = "phist.total_breast.flat", times = 2 }]

[[sanity.rules]]
id = "MON8"
text = "Recorded, not gating: angiogenesis genes up in breast-cancer patients' total monocytes."
source = "Cassetta 2019 Fig. 1C and 1D: angiogenesis among enriched GO terms, pro-angiogenic factors up"
gate = false
conditions = [{ metric = "gsea.total_breast.HALLMARK_ANGIOGENESIS.nes", op = ">", value = 0 }]
