dest = "resources/gencode/gencode.v50.primary_assembly.annotation.gtf.gz"

# M7's protein side (D11): Rieckmann et al. 2017 Nat Immunol, doi:10.1038/ni.3693, PRIDE
# PXD004352; Supplementary Table 6, protein copy numbers by the proteomic ruler. Size and
# SHA-256 from the download of 2026-10-08 (~/ctx_breast/data/raw/papers/_manifest_papers.tsv,
# md5 870112d79b5ca182d10dbcebb5d0169a); reuse terms UNVERIFIED, so the kit never ships it.
[[resources]]
name = "rieckmann_table6"
urls = [
    "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fni.3693/MediaObjects/41590_2017_BFni3693_MOESM13_ESM.xlsx",
]
bytes = 11193232
sha256 = "f09c2c03590761fca8b58eb9c3d0a40210b8319e4732f505867ae6238684b184"
dest = "resources/datasets/tier1/41590_2017_BFni3693_MOESM13_ESM.xlsx"

# MSigDB 2026.1 GO cellular component, for M7's granule class; size and SHA-256 from the
# download of 2026-10-08 (~/ctx_breast/data/raw/cptac_brca/_manifest_cptac_brca.tsv).
[[resources]]
name = "msigdb_go_cc"
urls = [
    "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2026.1.Hs/c5.go.cc.v2026.1.Hs.symbols.gmt",
]
bytes = 778106
sha256 = "1ee846c446a87c1b6cc2b097dc415bed1c2f6b539312d2611f946038c5f7e9f8"
dest = "resources/msigdb/c5.go.cc.v2026.1.Hs.symbols.gmt"

# Patterns are checked against the ENA read_run report of the study by
# tests/test_repo.py::test_guard_patterns_cover_study (runs ERR7425257-466, experiments
# ERX6994339-548, samples SAMEA11307688-897, secondary samples ERS8952829-53038, 2026-09-27)
# and against the SDRF's individual column.
[guard]
ids = ["PRJEB49000", "ERP133445", "E-MTAB-11190"]
patterns = [
    '\bERR7425\d{3}\b',
    '\bERX699\d{4}\b',
    '\bSAMEA11307[6-8]\d{2}\b',
    '\bERS895\d{4}\b',
    '\bUPN\d+\b',
]

[sdrf]
resource = "sdrf"
join = ["Comment[ENA_RUN]", "run_accession"]
cross_check = [["Source Name", "sample_title"]]

[columns.donor]
source = "Characteristics[individual]"
meaning = "Individual the sample came from (SDRF Characteristics[individual])."

[columns.cell_type]
source = "Characteristics[cell type]"
meaning = "Sorted cell population: normal-density (NDN) or low-density (LDN) neutrophils, monocytes, or a bone-marrow stage (BM_1 to BM_4)."
values = { NDN = "NDN", LDN = "LDN", Monocyte = "Monocyte", BM_1 = "BM_1", BM_2 = "BM_2", BM_3 = "BM_3", BM_4 = "BM_4" }

[columns.condition]
source = "Characteristics[condition]"
meaning = "Donor state: steady state, G-CSF mobilised donor, HSCT recipient, PDAC or IPMN patient."
values = { "Steady state" = "steady_state", "G-CSF" = "gcsf", HSCT = "hsct", PDAC = "pdac", IPMN = "ipmn" }

[columns.tissue]
source = "Characteristics[tissue]"
meaning = "PB, peripheral blood, or BM, bone marrow."
values = { PB = "PB", BM = "BM" }

[columns.time_point]
source = "Characteristics[hsct time point]"
meaning = "HSCT follow-up (fu1 16-27 days, fu2 28-40 days, fu3 over 180 days after transplant, PMC7615267 Methods); empty for other conditions."
values = { na = "", "1st follow up" = "fu1", "2nd follow up" = "fu2", "3rd follow up" = "fu3" }

[columns.isolation]
source = "Characteristics[cell isolation strategy]"
meaning = "How the cells were isolated; differs between groups of monocytes (critique M9)."
values = { "FACS sorting" = "facs", "Neutrophil Isolation kit" = "neutrophil_kit", "CD14 Microbeads" = "cd14_beads", "CD15 Microbeads" = "cd15_beads" }

[columns.sex]
source = "Characteristics[sex]"
meaning = "Recorded sex of the individual; empty where the SDRF has none."
values = { M = "M", F = "F", "" = "" }

[columns.donor_sex]
source = "Characteristics[donor sex]"
meaning = "Sex of the stem-cell donor, for HSCT recipients; empty otherwise."
values = { M = "M", F = "F", na = "" }

[order]
time_point = ["", "fu1", "fu2", "fu3"]

[derived.batch]
bins = { "Reads ≤ 76 nt (min 35 nt)" = [75, 76], "Reads > 76 nt (max 500 nt)" = [101] }

[expect]
runs = 210

[expect.counts.read_length]
"75" = 13
"76" = 98
"101" = 99

[expect.counts.condition]
hsct = 59
gcsf = 44
steady_state = 41
pdac = 35
ipmn = 31

[expect.counts.tissue]
PB = 171
BM = 39

# Peripheral blood only; one sample per individual per group (earliest by [order], then run).
# Group sizes measured 2026-09-27 from the SDRF joined to the ENA read_run report; ctx de
# stops if the realised n differs.

[[contrasts]]
name = "ndn_gcsf"
variable = "condition"
reference = "steady_state"
tested = "gcsf"
n = [13, 13]
filters = { tissue = ["PB"], cell_type = ["NDN"], batch = ["Reads ≤ 76 nt (min 35 nt)"] }

[[contrasts]]
name = "mono_gcsf"
variable = "condition"
reference = "steady_state"
tested = "gcsf"
n = [8, 8]
filters = { tissue = ["PB"], cell_type = ["Monocyte"], batch = ["Reads ≤ 76 nt (min 35 nt)"] }

[[contrasts]]
name = "ndn_hsct_early"
variable = "condition"
reference = "steady_state"
tested = "hsct"
n = [13, 5]
filters = { tissue = ["PB"], cell_type = ["NDN"], batch = ["Reads ≤ 76 nt (min 35 nt)"], time_point = ["", "fu1", "fu2"] }

[[contrasts]]
name = "mono_hsct_early"
variable = "condition"
reference = "steady_state"
tested = "hsct"
n = [8, 4]
filters = { tissue = ["PB"], cell_type = ["Monocyte"], batch = ["Reads ≤ 76 nt (min 35 nt)"], time_point = ["", "fu1", "fu2"] }

[[contrasts]]
name = "ndn_gcsf_paired"
variable = "condition"
reference = "steady_state"
tested = "gcsf"
n = [9, 9]
design = "~donor + group"
paired = true
filters = { tissue = ["PB"], cell_type = ["NDN"], batch = ["Reads ≤ 76 nt (min 35 nt)"] }

[[contrasts]]
name = "ndn_gcsf_unpaired9"
variable = "condition"
reference = "steady_state"
tested = "gcsf"
n = [9, 9]
filters = { tissue = ["PB"], cell_type = ["NDN"], batch = ["Reads ≤ 76 nt (min 35 nt)"], donor = ["UPN1", "UPN2", "UPN3", "UPN4", "UPN5", "UPN6", "UPN7", "UPN9", "UPN11"] }

[[contrasts]]
name = "ndn_pdac_naive"
variable = "condition"
reference = "steady_state"
tested = "pdac"
n = [17, 14]
filters = { tissue = ["PB"], cell_type = ["NDN"] }

[[contrasts]]
name = "ndn_pdac_adjusted"
variable = "condition"
reference = "steady_state"
tested = "pdac"
n = [17, 14]
design = "~batch + group"
filters = { tissue = ["PB"], cell_type = ["NDN"] }

[[contrasts]]
name = "ndn_pdac_within"
variable = "condition"
reference = "steady_state"
tested = "pdac"
n = [4, 14]
filters = { tissue = ["PB"], cell_type = ["NDN"], batch = ["Reads > 76 nt (max 500 nt)"] }

[[contrasts]]
name = "ndn_null_split"
variable = "condition"
reference = "steady_state"
tested = "steady_state"
n = [7, 6]
filters = { tissue = ["PB"], cell_type = ["NDN"], batch = ["Reads ≤ 76 nt (min 35 nt)"], condition = ["steady_state"] }
split = { seed = 42, strata = "sex" }

# M7's RNA side of neutrophils against monocytes (docs/plans/2026-10-07_m7_real_data_plan_proposal.md,
# decision 5, approved 2026-10-08): steady-state blood, the 9 individuals with both cell types,
# measured 2026-10-08 from gather's sheet; each individual sits in one read-length batch (7 at
# 76 nt or less, 2 over), so ~donor absorbs the batch.
[[contrasts]]
name = "ndn_vs_mono_steady"
variable = "cell_type"
reference = "Monocyte"
tested = "NDN"
n = [9, 9]
design = "~donor + group"
paired = true
filters = { tissue = ["PB"], condition = ["steady_state"] }

[de]
featured = "ndn_gcsf"
box_contrast = "ndn_hsct_early"
# Named by the paper (PMC7615267 Figs. 6 and 7, from its scRNA-seq): drawn, not tested as a rule.
box_genes = ["ISG15", "IFI6", "STAT1", "OAS2", "CD274", "AIM2", "GBP5"]
scatters = [["ndn_pdac_naive", "ndn_pdac_adjusted"], ["ndn_hsct_early", "mono_hsct_early"]]

[de.lessons]
"Batch" = ["ndn_pdac_naive", "ndn_pdac_adjusted", "ndn_pdac_within"]
"Pairing" = ["ndn_gcsf_unpaired9", "ndn_gcsf_paired"]

[[de.pca]]
name = "pb"
filters = { tissue = ["PB"] }
factors = ["cell_type", "condition", "batch"]
strata = "donor"

[[de.pca]]
name = "ndn"
filters = { tissue = ["PB"], cell_type = ["NDN"] }
factors = ["condition"]
symbol = "batch"
one_per = "donor"

[[de.pca]]
name = "ss_ndn"
filters = { tissue = ["PB"], cell_type = ["NDN"], condition = ["steady_state"] }
factors = ["batch"]
one_per = "donor"

[function]
gene_sets = "msigdb_hallmark"
licence = "MSigDB Hallmark v2026.1.Hs, (c) Broad Institute, MIT and the Regents of the University of California, under CC BY 4.0 (gsea-msigdb.org msigdb_license_terms.jsp, read 2026-09-27)."
featured_set = "HALLMARK_INTERFERON_ALPHA_RESPONSE"
running = ["ndn_hsct_early", "HALLMARK_INTERFERON_ALPHA_RESPONSE"]

# Pre-registered before any Step-1 count exists (P2C.1). Thresholds are choices fixed before
# the data, not literature values. A failing rule is reported, never retuned. Rytis reviews
# and edits these before the rule commit.

[sanity]
# The commit that last changed this line is the registration: nothing a verdict depends on
# may change between it and the record (tests/test_sanity_record.py). First registered
# 2026-09-27 (8219d16); registered again 2026-09-28, before any Step-1 count existed, after
# the call rule changed (D-012, D-013), once more the same day for the shown name (D-014),
# for the volcano's cutoff line (D-015), for the fixes its review found (D-016), and for
# the M5 page's caveat on what BH promises (D-018), for the switch that turns LFC
# shrinkage off (D-019), for rule sources that name their target (D-020), for the
# Trim Galore reports and the GTF that `ctx qc` reads (D-022), and for those reports as JSON,
# the only form MultiQC 1.35 reads from Trim Galore 2.x (D-025), and for batch names that
# say the read lengths, since "long" reads as long-read sequencing (D-043), and for the hub
# listing the course modules M0 to M10, gene cards and clinical included (D-044).
# The time makes each registration a change to this line, which is how it is found.
registered = "2026-09-30 11:04"

[[sanity.rules]]
id = "R1"
text = "Cell type explains more of the peripheral-blood expression than condition or batch."
source = "TODO.md, Verification: Biology sanity, Step-1; blind VST of the 171 PB samples, top 500 genes"
conditions = [
    { metric = "permanova.pb.cell_type.r2", op = ">", other = "permanova.pb.condition.r2" },
    { metric = "permanova.pb.cell_type.r2", op = ">", other = "permanova.pb.batch.r2" },
]

[[sanity.rules]]
id = "R2"
text = "The p-value histograms of the two stress contrasts peak at 0 over a flat floor."
source = "TODO.md, Verification: Biology sanity, Step-1"
conditions = [
    { metric = "phist.ndn_gcsf.low", op = ">=", other = "phist.ndn_gcsf.flat", times = 2 },
    { metric = "phist.ndn_hsct_early.low", op = ">=", other = "phist.ndn_hsct_early.flat", times = 2 },
]

[[sanity.rules]]
id = "R3"
text = "A seeded split of healthy individuals finds at most 1 % of tested genes at padj < 0.05."
source = "negative control; seed 42, split stratified by recorded sex"
conditions = [
    { metric = "calls.ndn_null_split.significant", op = "<=", other = "calls.ndn_null_split.tested", times = 0.01 },
]

[[sanity.rules]]
id = "R4"
text = "Neutrophils of HSCT recipients carry an interferon-alpha signature; monocytes less so."
source = "PMC7615267 abstract (ISGs in neutrophils, not monocytes) and Fig. 4d"
conditions = [
    { metric = "gsea.ndn_hsct_early.HALLMARK_INTERFERON_ALPHA_RESPONSE.nes", op = ">", value = 0 },
    { metric = "gsea.ndn_hsct_early.HALLMARK_INTERFERON_ALPHA_RESPONSE.fdr", op = "<", value = 0.05 },
    { metric = "gsea.mono_hsct_early.HALLMARK_INTERFERON_ALPHA_RESPONSE.nes", op = "<", other = "gsea.ndn_hsct_early.HALLMARK_INTERFERON_ALPHA_RESPONSE.nes" },
]

[[sanity.rules]]
id = "R5"
text = "G-CSF represses the interferon-alpha response in neutrophils."
source = "PMC7615267 Fig. 4d"
conditions = [
    { metric = "gsea.ndn_gcsf.HALLMARK_INTERFERON_ALPHA_RESPONSE.nes", op = "<", value = 0 },
    { metric = "gsea.ndn_gcsf.HALLMARK_INTERFERON_ALPHA_RESPONSE.fdr", op = "<", value = 0.05 },
]

[[sanity.rules]]
id = "R6"
text = "The read-length batch is visible in healthy neutrophils alone."
source = "D5; steady-state NDN, one sample per individual, 4 over 76 nt against 13 at 76 nt or less"
conditions = [{ metric = "permanova.ss_ndn.batch.p", op = "<", value = 0.05 }]

[[sanity.rules]]
id = "R7"
text = "Pairing the G-CSF donors finds at least as many genes at padj < 0.05 as ignoring the pairs."
source = "TODO.md, Verification: Paired vs unpaired designs"
conditions = [
    { metric = "calls.ndn_gcsf_paired.significant", op = ">=", other = "calls.ndn_gcsf_unpaired9.significant" },
]

[[sanity.rules]]
id = "R8"
text = "Every sample expresses its recorded sex; HSCT samples their donor's."
source = "critique M8; XIST against RPS4Y1, DDX3Y, KDM5D, UTY and EIF1AY"
conditions = [{ metric = "sex.disagree", op = "<=", value = 0 }]

[[sanity.rules]]
id = "PDAC"
text = "Recorded, not gating: interferon-alpha genes up in PDAC neutrophils."
source = "PMC7615267 Fig. 4d; the reference over 76 nt is n = 4"
gate = false
conditions = [
    { metric = "gsea.ndn_pdac_adjusted.HALLMARK_INTERFERON_ALPHA_RESPONSE.nes", op = ">", value = 0 },
    { metric = "gsea.ndn_pdac_within.HALLMARK_INTERFERON_ALPHA_RESPONSE.nes", op = ">", value = 0 },
]

# M7, cross-dataset (D11; the M7 plan, approved 2026-10-08): RNA fold changes from M5's
# ndn_vs_mono_steady against Rieckmann's copy numbers, steady-state neutrophils over classical
# monocytes, 4 donors each. Monocyte is matched to MO.classical (plan decision 5).
[proteo]
design = "cross_dataset"
protein = "rieckmann_table6"
contrast = "ndn_vs_mono_steady"
tested = '^CopyNumber_Neutrophil_\d{2}_steady-state$'
reference = '^CopyNumber_MO\.classical_\d{2}_steady-state$'

# Neutrophil granules (Cowland and Borregaard 2016): azurophil, specific and tertiary.
[proteo.classes.granule]
resource = "msigdb_go_cc"
sets = ["GOCC_AZUROPHIL_GRANULE", "GOCC_SPECIFIC_GRANULE", "GOCC_TERTIARY_GRANULE"]

# Rieckmann 2017 Supplementary Figure 6b (Supplementary Text and Figures PDF, page 10): Pearson r
# of RPKM against iBAQ across genes within each of 8 matched cell types, read off the axis at
# about 0.43 to 0.62, steady-state types near 0.44. Absolute levels within one cell type, not
# fold changes, and no neutrophil RNA: printed for context, never a rule.
[proteo.published.rieckmann_fig6b]
source = "Rieckmann et al. 2017 Nat Immunol, Supplementary Figure 6b, read from the plot"
low = 0.43
high = 0.62

# Registered before any protein value was read (M7 plan, P7.1). ctx proteo decides these on its
# own metrics with ctx.de.sanity; they are apart from [sanity], whose record is closed (D-046).
[proteo.sanity]
registered_at = "2026-10-08 14:56"

[[proteo.sanity.rules]]
id = "P1"
text = "Neutrophil-over-monocyte fold changes agree in rank at RNA and protein: rho above 0, its whole 95 % interval too."
source = "M7 plan, sanity rules; Spearman of M5's raw log2 FC against the copy-number log2 FC, bootstrap over genes"
conditions = [
    { metric = "fold.spearman", op = ">", value = 0 },
    { metric = "fold.spearman.low", op = ">", value = 0 },
]

[[proteo.sanity.rules]]
id = "P2"
text = "Granule proteins sit higher at protein than at RNA, against the other genes: one-sided Mann-Whitney on protein minus RNA log2 FC."
source = "Rorvig et al. 2013 J Leukoc Biol; Cowland and Borregaard 2016 Immunol Rev: granule proteins are made early in granulopoiesis"
conditions = [
    { metric = "class.granule.p", op = "<", value = 0.05 },
    { metric = "class.granule.rank_biserial", op = ">", value = 0 },
]

[[proteo.sanity.rules]]
id = "P3"
text = "The missingness figure comes before every test on the page."
source = "TODO.md, Verification: M7 sanity, missingness plotted before any test"
conditions = [{ metric = "page.missingness_first", op = "==", value = 1 }]
