# Cassetta et al. 2019 tissue macrophages (P4.0, TODO.md "Phase 4"): the 22 GEO samples of
# GSE117970 whose extract protocol is the macrophage one, one paired 2 x 100 nt run each, counted
# by nf-core/rnaseq 3.27.0 (job 47489148). Curated from its own table, breast_mac.tsv, because the
# study has no SDRF: GEO's per-sample records (brief SOFT of GSE117970's samples, retrieved
# 2026-10-09, SHA-256 eb80bb5b44fcdc8f34e675af88d09d9cc1f715b99ce0cadd9fb3d230db02bd00), values
# verbatim, one row per ENA run (read_run report, 2026-10-09), joined to fetchngs on the run and
# cross-checked on the GSM and title; `donor` is the title before ':'. Tallied from those records: breast 4 resident and 4 tumour-associated, endometrium
# 5 resident and 9 tumour-associated; sequencing batch 4 (15) and 5 (7).
# GEO's `cell type` reads "tumour associated macrophages" for all 22, the resident ones included;
# only `condition` tells resident from tumour-associated (TODO.md P4 row 1).

[dataset]
slug = "breast_mac"
# The name pages show; the slug names files, so it keeps lowercase and underscores (D-014).
label = "Breast and endometrial macrophages"
ena_study = "PRJNA483877"
ena_secondary_study = "SRP155941"
geo = "GSE117970"
source = "Cassetta et al. 2019 Cancer Cell 35:588, doi:10.1016/j.ccell.2019.02.009, PMID 30930117, PMC6472943"

[[resources]]
name = "msigdb_hallmark"
urls = [
    "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2026.1.Hs/h.all.v2026.1.Hs.symbols.gmt",
]
bytes = 48686
sha256 = "eecaf6dad908334ae885406ec72bdc0646d8917588ed7c219fac92fc5363f596"
dest = "resources/msigdb/h.all.v2026.1.Hs.symbols.gmt"

# The annotation the cluster count used (Step-1's rnaseq files, reused by path, P4.1).
[[resources]]
name = "annotation_gtf"
urls = [
    "https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/gencode.v50.primary_assembly.annotation.gtf.gz",
]
bytes = 124650284
sha256 = "89bbad69a8c89fee5fadec0a2f14a098752d27a4ef7f24e4de9bac681e1b18f4"
dest = "resources/gencode/gencode.v50.primary_assembly.annotation.gtf.gz"

# GTEx V11 for M9's gene cards, the same four entries as tcga_brca.toml (Rytis 2026-10-22):
# ctx setup registers each file in place by its hash, never downloading it again.
[[resources]]
name = "gtex_gene_tpm"
urls = ["https://storage.googleapis.com/adult-gtex/bulk-gex/v11/rna-seq/GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_gene_tpm.gct.gz"]
