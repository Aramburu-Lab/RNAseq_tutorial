urls = ["https://storage.googleapis.com/adult-gtex/bulk-gex/v11/rna-seq/GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_exon_reads.parquet"]
bytes = 21849125411
sha256 = "86eb6097394dc59fcf18fe337d11d145a0a98c956565d88ddfb6315412e2503a"
