dest = "data/raw/mirna_targets/miRTarBase_SE_WR.csv"
# Its server speaks TLS 1.2 with RSA key exchange only (AES128-GCM-SHA256, AES256-GCM-SHA384;
# every ECDHE and DHE suite refused, 2026-10-08), which Python's default list omits.
tls_ciphers = "AES256-GCM-SHA384:AES128-GCM-SHA256"

# MSigDB Hallmark for M6 (D1.1, Rytis 2026-10-14), the file tier1.toml declares, not downloaded
# again: the scratch root links the one copy, and ctx setup registers a file in place by hash.
[[resources]]
