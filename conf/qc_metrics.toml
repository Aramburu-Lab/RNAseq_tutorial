# The QC registry: every metric `ctx qc` judges, with its bands and where each band comes from
# (CONVENTIONS.md, Statistics rules: QC bands live only here). Read by `ctx.qc.registry`; the
# generated MultiQC config colours MultiQC's General Statistics table from it.
#
# A metric is judged two ways, side by side. Its absolute bands (`good`, `usable`), where a
# source gives one; `bands = "dataset_only"` with a `rationale` where none does, which is most
# RNA-seq metrics. And always against its own dataset: median ± k·MAD (the [registry] rule).
#
# source_type is one of tool_code, tool_docs, consortium_standard, pipeline_default,
# literature, course_convention (TODO.md, M2); a course convention always carries a rationale.
# `direction` says which side is good: "higher", "lower", or "none" (a category or a spread).
# `action` is keep or flag; nothing was excluded before the Step-1 record (P2M M2.8). Since
# the record, `exclude` marks a value that makes every later number meaningless: a genome
# and annotation from different assemblies (reference_start_codons, D-039).

[registry]
schema = 1
mad_multiplier = 3.0
# scipy.stats.median_abs_deviation(scale="normal"): the MAD times 1.4826, so k scaled MADs
# match k standard deviations when the data are normal.
mad_scaled = true
# With two samples each lies exactly one MAD from their median, so no sample can ever be
# flagged; three is the fewest in which one can. A smaller stratum gets no band, and says so.
min_samples = 3
source = "robust z-score, median ± 3 scaled MAD"
source_type = "course_convention"
rationale = "Many RNA-seq metrics have no universal cut-off; a sample far from its own dataset is a question worth asking. 3 scaled MADs is 3 SD for normal data, and it flags, never excludes."
# MultiQC 1.35's theoretical GC curve that the GC distribution figure draws, the curve
# percent_gc's plot_line is the mean of: "Human Transcriptome (UCSC hg38)". MultiQC writes it
# as the row "Theoretical GC Content" of its per-sequence GC plot data.
fastqc_theoretical_gc = "hg38_txome"

# ---- M2a, reads before alignment (FastQC 0.12.1, fastp 1.1.0, seqkit 2.13.0) --------------

[metrics.total_sequences]
stage = "reads"
title = "Reads"
meaning = "How many reads the run holds."
computed = "FastQC Total Sequences"
unit = "reads"
table = "general_stats"
column = "fastqc-total_sequences"
module = "fastqc"
scale = "log10"
direction = "higher"
bands = "dataset_only"
rationale = "Depth needs depend on the question. ENCODE's bulk RNA-seq standard (June 2017) asks for 30 million aligned reads per replicate, 20 million in older projects; this metric counts sequenced reads, so the standard is a reference line, not a band."
causes = ["a lane shared with many libraries", "a failed library"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
# ENCODE's depth standard, in ALIGNED reads. The sentence was read verbatim from the page's
# HTML on 2026-09-30 (the space before "projects" is a non-breaking one there). The M1 depth
# figure draws both values as reference lines through ctx.qc.registry.
plot_bands = [30000000.0, 20000000.0]
plot_source = "ENCODE, Bulk RNA-seq Data Standards and Processing Pipeline (encodeproject.org/data-standards/rna-seq/long-rnas/, updated June 2017): \"Each replicate should have 30 million aligned reads, although older projects aimed for 20 million reads.\" ENCODE's audit, ENCODE-DCC/encoded src/encoded/audit/analysis.py at commit 4638915d (2022-11-15), check_file_read_depth with upper_threshold=30000000 and middle_threshold=20000000: 20 to 30 million aligned reads is 'low read depth' at level WARNING, 1 to 20 million 'insufficient read depth' at level NOT_COMPLIANT. Aligned reads are unique reads plus multi-mappers at fewer than 20 loci. Read 2026-10-01. This metric counts sequenced reads, more than aligned ones, so a run above a line may still fall short of it."

[metrics.read_length]
stage = "reads"
title = "Read length"
meaning = "The mean read length, in bases."
computed = "FastQC average sequence length"
unit = "nt"
table = "general_stats"
column = "fastqc-avg_sequence_length"
module = "fastqc"
scale = "linear"
direction = "none"
bands = "dataset_only"
rationale = "Set by the sequencing run, not by the sample; a length unlike the rest of its batch is a different run. Judged within each read-length group, the batch the dataset file declares or else the run's own length, never across a cohort that mixes lengths by design."
# Rytis 2026-10-09 (TODO.md item 13 answers, item 14): across Step-1's 101, 76 and 75 nt the
# MAD rule flagged 39 runs for their length alone.
judged_within = "read_length_group"
causes = ["a different sequencing run", "trimmed before upload"]
action = "flag"
matters_for_de = false
read_length_tied = true
source = "dataset only"
source_type = "course_convention"
plot_line = 50.0
plot_source = "ENCODE, Bulk RNA-seq Data Standards and Processing Pipeline, Uniform Processing Pipeline Restrictions (encodeproject.org/data-standards/rna-seq/long-rnas/, updated June 2017): \"The read length should be a minimum of 50 base pairs.\" ENCODE's audit marks a shorter read 'insufficient read length' at level NOT_COMPLIANT (ENCODE-DCC/encoded src/encoded/audit/experiment.py, check_file_read_length_rna(f, 50, ...), last commit d9f41ec2, 2023-01-19). A floor for ENCODE's pipeline, not a quality scale. Read 2026-10-01."

[metrics.percent_gc]
stage = "reads"
title = "GC content"
meaning = "The share of G and C bases."
computed = "FastQC %GC"
unit = "%"
table = "general_stats"
column = "fastqc-percent_gc"
module = "fastqc"
scale = "linear"
direction = "none"
bands = "dataset_only"
rationale = "The expected GC depends on the transcripts a cell expresses; FastQC's own GC check compares each read with the sample's own distribution."
causes = ["contamination with another organism", "rRNA", "adapter dimers"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
plot_line = 49.8
plot_source = "Course convention, derived: the mean of MultiQC 1.35's theoretical GC curve 'FastQC theoretical GC content curve: Human Transcriptome (UCSC hg38)' (github.com/MultiQC/MultiQC/blob/v1.35/multiqc/modules/fastqc/fastqc_theoretical_gc/fastqc_theoretical_gc_hg38_txome.txt), computed 2026-10-01 as 49.81. The curve draws reads in proportion to transcript length and isoform number, not expression: a reference for the annotation, not the value an expressed library should have."

[metrics.percent_duplicates]
stage = "reads"
title = "Duplicated reads"
meaning = "The share of reads that are exact copies of another read."
computed = "100 - FastQC total_deduplicated_percentage"
unit = "%"
table = "general_stats"
column = "fastqc-percent_duplicates"
module = "fastqc"
scale = "linear"
direction = "lower"
good = 30.0
usable = 50.0
causes = ["highly expressed transcripts, which RNA-seq always has", "low input", "over-amplification"]
action = "keep"
matters_for_de = false
read_length_tied = false
source = "FastQC 0.12.1 Configuration/limits.txt: duplication warn 70, error 50 (% of reads left after deduplication)"
source_type = "tool_code"

[metrics.q30_rate]
stage = "reads"
title = "Q30 bases"
meaning = "The share of bases called with at most a 1 in 1000 chance of error, before trimming."
computed = "seqkit stats -a Q30(%)"
unit = "%"
table = "general_stats"
column = "seqkit_seqkit-Q30_pct"
module = "seqkit"
scale = "linear"
direction = "higher"
good = 80.0
usable = 80.0
causes = ["a degraded run", "late cycles of a long read"]
action = "flag"
matters_for_de = true
read_length_tied = true
source = "Q30 below 80 % (TODO.md, M2)"
source_type = "course_convention"
rationale = "No source for a Q30 cut-off was found (TODO.md, M2); 80 % is the course's line, shown as such."

[metrics.fastp_surviving]
stage = "reads"
title = "Reads passing fastp"
meaning = "The share of reads fastp keeps with its default filters."
computed = "fastp pct_surviving_reads"
unit = "%"
table = "general_stats"
column = "fastp-pct_surviving_reads"
module = "fastp"
scale = "linear"
direction = "higher"
bands = "dataset_only"
# The approved proposal's last sentence read "The -q and -l grid the page lets you move": the
# grid has no control (test_no_registry_text_claims_a_control_the_page_lacks), so the sentence
# keeps the page's own claim and the proposal's meaning (test_qc_bands.DEVIATIONS).
rationale = "At fastp's default filters a run losing 1 read in 20 is degraded; the band rests on 8 teaching runs and holds at default settings only; the page maps one run's -q by -l, without a control. That grid is never shaded, since there a band would grade the settings, not the run."
causes = ["low quality", "short inserts", "many N bases"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
plot_bands = [95.0, 90.0]
plot_source = "Course convention, at fastp's default filters only. fastp 1.1.0 --help, the installed binary: -q 'Default 15 means phred quality >=Q15 is qualified.', -u 'Default 40 means 40%', -n 'Default is 5', -l 'default is 15'. At those settings a read is dropped only when more than 40 % of its bases fall below Q15, it carries more than 5 N, or it is shorter than 15 nt. The worst of the 8 teaching runs loses 1.03 %; 95 % is about five times that loss, 90 % about ten. Not sourced. Read 2026-10-01."

[metrics.fastp_passed_reads]
stage = "reads"
title = "Reads after fastp"
meaning = "How many reads remain after fastp's filters. For a paired run fastp counts both mates, while nf-core's band counts pairs, so a paired run meets the band at half the pairs; the course's cohorts are single-end."
computed = "fastp filtering_result.passed_filter_reads (both mates of a pair)"
unit = "reads"
table = "general_stats"
column = "fastp-filtering_result_passed_filter_reads"
module = "fastp"
scale = "log10"
direction = "higher"
good = 10000.0
usable = 10000.0
causes = ["a failed library", "heavy filtering"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "nf-core/rnaseq 3.27.0 min_trimmed_reads 10000 (nextflow.config; the fixture's params file), set for Trim Galore output and transferred here to fastp's"
source_type = "pipeline_default"

# FastQC's own module verdicts: pass, warn and fail are FastQC's, from its limits.txt.
[metrics.fastqc_per_base_quality]
stage = "reads"
title = "Per-base quality"
meaning = "Whether the base quality holds up along the read."
computed = "FastQC per_base_sequence_quality"
unit = "status"
table = "fastqc"
column = "per_base_sequence_quality"
module = "fastqc"
kind = "status"
direction = "none"
causes = ["a degraded run", "late cycles"]
action = "flag"
matters_for_de = true
read_length_tied = true
source = "FastQC 0.12.1 limits.txt: quality_base_lower warn 10 error 5, quality_base_median warn 25 error 20"
source_type = "tool_code"
# The bands FastQC's own per-base quality plot shades, good from 28 and reasonable from 20,
# read from the bytecode of FastQC 0.12.1's QualityBoxPlot class with javap on 2026-09-30
# (constants 28.0 and 20.0 beside its GOOD, BAD and UGLY colours).
plot_bands = [28.0, 20.0]
plot_source = "FastQC 0.12.1 Graphs/QualityBoxPlot.java (github.com/s-andrews/FastQC/blob/v0.12.1/uk/ac/babraham/FastQC/Graphs/QualityBoxPlot.java): 'g.fillRect(xOffset+(baseWidth*i), getY(28), baseWidth, getY(20)-getY(28));'. Good from Phred 28, reasonable from 20, poor below. Read 2026-10-01."

[metrics.fastqc_adapter]
stage = "reads"
title = "Adapter content"
meaning = "Whether reads run into the sequencing adapter, which happens when the insert is shorter than the read."
computed = "FastQC adapter_content"
unit = "status"
table = "fastqc"
column = "adapter_content"
module = "fastqc"
kind = "status"
direction = "none"
causes = ["short inserts", "degraded RNA", "adapter dimers"]
action = "flag"
matters_for_de = true
read_length_tied = true
source = "FastQC 0.12.1 limits.txt: adapter warn 5, error 10 (% of reads)"
source_type = "tool_code"
plot_bands = [5.0, 10.0]
plot_source = "FastQC 0.12.1 Configuration/limits.txt (github.com/s-andrews/FastQC/blob/v0.12.1/Configuration/limits.txt): 'adapter warn 5', 'adapter error 10', the percentage of reads observed to contain an adapter k-mer at any point. Shades the cumulative adapter curve; the verdict stays FastQC's status. Read 2026-10-01."

[metrics.fastqc_n_content]
stage = "reads"
title = "N bases"
meaning = "Whether many bases were called N, unknown."
computed = "FastQC per_base_n_content"
unit = "status"
table = "fastqc"
column = "per_base_n_content"
module = "fastqc"
kind = "status"
direction = "none"
causes = ["a failed cycle"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "FastQC 0.12.1 limits.txt: n_content warn 5, error 20 (% at any position)"
source_type = "tool_code"
plot_bands = [5.0, 20.0]
plot_source = "FastQC 0.12.1 Configuration/limits.txt (github.com/s-andrews/FastQC/blob/v0.12.1/Configuration/limits.txt): 'n_content warn 5', 'n_content error 20'. FastQC Help, Per Base N Content: 'This module raises a warning if any position shows an N content of >5%'. Shades the N share by position; the verdict stays FastQC's status. Read 2026-10-01."

[metrics.fastqc_sequence_content]
stage = "reads"
title = "Per-base sequence content"
meaning = "Whether the four bases occur evenly along the read."
computed = "FastQC per_base_sequence_content"
unit = "status"
table = "fastqc"
column = "per_base_sequence_content"
module = "fastqc"
kind = "status"
direction = "none"
causes = ["random-hexamer priming, which makes a fail expected in RNA-seq"]
action = "keep"
matters_for_de = false
read_length_tied = false
source = "FastQC 0.12.1 limits.txt: sequence warn 10, error 20 (% A/T or G/C difference)"
source_type = "tool_code"
plot_bands = [10.0, 20.0]
plot_expected_bias_positions = 13
plot_source = "FastQC 0.12.1 Configuration/limits.txt (github.com/s-andrews/FastQC/blob/v0.12.1/Configuration/limits.txt): 'sequence warn 10', 'sequence error 20', the largest A/T or G/C difference at any position. FastQC Help, Per Base Sequence Content: 'Nearly all RNA-Seq libraries will fail this module because of this bias'. Positions 1 to 13 greyed as priming bias: Hansen, Brenner, Dudoit 2010, Nucleic Acids Res 38:e131, doi:10.1093/nar/gkq224: 'a strong distinctive pattern in the nucleotide frequencies of the first 13 positions'. Read 2026-10-01."

[metrics.fastqc_gc_distribution]
stage = "reads"
title = "GC distribution"
meaning = "Whether reads' GC follows one smooth distribution."
computed = "FastQC per_sequence_gc_content"
unit = "status"
table = "fastqc"
column = "per_sequence_gc_content"
module = "fastqc"
kind = "status"
direction = "none"
causes = ["contamination", "a few very highly expressed transcripts"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "FastQC 0.12.1 limits.txt: gc_sequence warn 15, error 30 (% deviation from normal)"
source_type = "tool_code"
plot_bands = [15.0, 30.0]
plot_source = "FastQC 0.12.1 Configuration/limits.txt (github.com/s-andrews/FastQC/blob/v0.12.1/Configuration/limits.txt): 'gc_sequence warn 15', 'gc_sequence error 30', the percentage of reads deviating from a normal fitted at the mode. Shades a per-run deviation strip; the verdict stays FastQC's status. Read 2026-10-01."

[metrics.fastqc_overrepresented]
stage = "reads"
title = "Overrepresented sequences"
meaning = "Whether single sequences make up a large share of the reads."
computed = "FastQC overrepresented_sequences"
unit = "status"
table = "fastqc"
column = "overrepresented_sequences"
module = "fastqc"
kind = "status"
direction = "none"
causes = ["highly expressed transcripts", "rRNA", "adapter dimers"]
action = "keep"
matters_for_de = false
read_length_tied = false
source = "FastQC 0.12.1 limits.txt: overrepresented warn 0.1, error 1 (% of reads)"
source_type = "tool_code"
plot_bands = [0.1, 1.0]
plot_source = "FastQC 0.12.1 Configuration/limits.txt (github.com/s-andrews/FastQC/blob/v0.12.1/Configuration/limits.txt): 'overrepresented warn 0.1', 'overrepresented error 1', the percentage of reads that are one sequence. Shades the top sequence's share. Read 2026-10-01."

# ---- Trimming on the cluster (Trim Galore 2.3.0, nf-core/rnaseq 3.27.0's default trimmer) --

[metrics.tg_pct_with_adapter]
stage = "trim"
title = "Reads with adapter"
meaning = "The share of reads in which Trim Galore found and cut adapter sequence."
computed = "Trim Galore reads_with_adapter / total_reads"
unit = "%"
table = "general_stats"
column = "trim_galore-tg_pct_with_adapter"
module = "trim_galore"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Trim Galore counts a read with a single adapter base (stringency 1), and about a third of reads match that way by chance with no adapter present, so no adapter cut-off applies to this share. A run far above its batch has short inserts."
causes = ["short inserts", "degraded RNA"]
action = "flag"
matters_for_de = true
read_length_tied = true
source = "dataset only"
source_type = "course_convention"
plot_line = 33.3
plot_source = "Course convention, derived: the sum over overlap lengths L of 4^-L, 33.3 % at 75 to 101 nt, from the per-length expectation Trim Galore 2.3.0 prints, src/report.rs line 638 (github.com/FelixKrueger/TrimGalore/blob/v2.3.0/src/report.rs): 'let expect = stats.total_reads as f64 / 4f64.powi(length as i32);'. Trim Galore prints no total. The share expected to match by chance at stringency 1 with no adapter present, if bases were even. Computed 2026-10-01."

[metrics.tg_pct_passing]
stage = "trim"
title = "Reads kept by Trim Galore"
meaning = "The share of reads Trim Galore wrote; with nf-core/rnaseq 3.27.0's arguments every read removed was shorter than 20 nt after trimming."
computed = "Trim Galore reads_written / total_reads"
unit = "%"
table = "general_stats"
column = "trim_galore-tg_pct_passing"
module = "trim_galore"
scale = "linear"
direction = "higher"
bands = "dataset_only"
rationale = "Trim Galore's own example loses 0.1 % of reads as too short; the band shades from there. Depth is judged by tg_total_reads and library_size, not here."
causes = ["short inserts", "degraded RNA"]
action = "flag"
matters_for_de = true
read_length_tied = true
source = "dataset only"
source_type = "course_convention"
plot_bands = [99.9, 99.0]
plot_source = "Course convention: Trim Galore 2.3.0's length guide (trimgalore.com/guide/length/) shows an example report with '1000000 sequences processed in total' and 'Sequences removed because they became shorter than the length cutoff of 20 bp: 552 (0.1%)'. Up to that loss is good, up to ten times it usable. An example, not a cut-off. Read 2026-10-01."

[metrics.tg_pct_quality_trimmed]
stage = "trim"
title = "Bases trimmed for quality"
meaning = "The share of bases Trim Galore cut from read ends below Phred 20; it trims bases, never whole reads, for quality."
computed = "Trim Galore quality_trimmed_bp / total_bp_processed"
unit = "%"
table = "general_stats"
column = "trim_galore-tg_pct_quality_trimmed"
module = "trim_galore"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "No source gives a cut-off on this share; the good line is what Trim Galore removed in all from a benchmark library, the usable line the course's own. A run trimmed far more than its batch had poorer late cycles."
causes = ["a degraded run", "late cycles of a long read"]
action = "flag"
matters_for_de = true
read_length_tied = true
source = "dataset only"
source_type = "course_convention"
plot_bands = [2.3, 20.0]
plot_source = "Course convention. Good to 2.3 %: Trim Galore 0.6.2 trimmed 2.3 % of bases from SEQC UHRR and HBRR, 100 bp paired-end, quality and adapter trimming together (Liao and Shi 2020, NAR Genom Bioinform 2(3):lqaa068, doi:10.1093/nargab/lqaa068, Supplementary Table S1); a description of reference RNA, not a cut-off. Usable to 20 %: the share of bases the course's q30_rate line lets fall below Q30, an analogy only. Read 2026-10-01."

[metrics.tg_total_reads]
stage = "trim"
title = "Processed reads"
meaning = "How many reads Trim Galore processed."
computed = "Trim Galore total_reads"
unit = "reads"
table = "general_stats"
column = "trim_galore-tg_total_reads"
module = "trim_galore"
scale = "log10"
direction = "higher"
good = 10000.0
usable = 10000.0
causes = ["a failed library"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "nf-core/rnaseq 3.27.0 min_trimmed_reads 10000 (nextflow.config; the fixture's params file)"
source_type = "pipeline_default"

# ---- Alignment and counting on a partial reference (M3, `ctx process`; D-039) -------------
# Judged by `ctx process` from its own tables, not from MultiQC's General Statistics.

[metrics.reference_start_codons]
stage = "align"
title = "Start codons that read ATG"
meaning = "The share of the annotation's start codons whose genome sequence reads ATG: whether the genome and the annotation share one assembly."
computed = "start_codon records 3 nt long, on the genome's contigs, read from the FASTA on the record's strand (reverse-complemented on minus); ATG over all"
unit = "fraction"
table = "reference"
column = "atg_share"
scale = "linear"
direction = "higher"
good = 0.99
usable = 0.9
rationale = "GENCODE 50 on the GRCh38 chr22 sequence: 8,852 of 8,866 read ATG (99.84 %), the rest CTG, GTG and ACG starts; the test fixture's 31 of 31. The same chr22 shifted by one base: 0 of 8,866. Both cut-offs are this course's, 0.99 below the measured share and 0.9 far above a shifted genome's."
causes = ["a genome from another assembly", "an annotation from another assembly", "contig names matched to another sequence"]
action = "exclude"
matters_for_de = true
read_length_tied = false
source = "measured on GENCODE 50 and GRCh38 chr22 (2026-10-01)"
source_type = "course_convention"

# M2 judges the next four from M3's alignment table, one row per sample, when `ctx process` has
# run on the dataset (M3.12). M3 aligns to part of the genome, so no genome-wide band applies.
[metrics.align_unique_pct]
stage = "align"
title = "Reads mapped once"
meaning = "The share of a sample's input reads the aligner placed at one locus of the reference M3 used."
computed = "uniquely mapped reads / reads given to the aligner, from MultiQC's STAR or HISAT2 table"
unit = "%"
table = "alignment"
column = "unique_pct"
scale = "linear"
direction = "higher"
bands = "dataset_only"
rationale = "M3 aligns to part of the genome by default, so most reads belong elsewhere and a genome-wide rate does not apply; the dataset shows which sample maps less than its stratum."
causes = ["contamination", "rRNA", "a different library protocol"]
action = "flag"
matters_for_de = false
read_length_tied = true
source = "dataset only"
source_type = "course_convention"

[metrics.align_multi_pct]
stage = "align"
title = "Reads mapped to several loci"
meaning = "The share of a sample's input reads the aligner placed at more than one locus."
computed = "reads mapped to several loci / reads given to the aligner, from MultiQC's STAR or HISAT2 table"
unit = "%"
table = "alignment"
column = "multi_pct"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Repeats and rRNA copies raise it, and how much depends on the reference; the dataset shows which sample stands apart."
causes = ["rRNA", "repeat-rich RNA", "short reads"]
action = "flag"
matters_for_de = false
read_length_tied = true
source = "dataset only"
source_type = "course_convention"

[metrics.align_mismatch_rate]
stage = "align"
title = "Mismatch rate"
meaning = "Mismatches per base of the uniquely mapped reads; STAR reports it, HISAT2 does not."
computed = "STAR Log.final.out mismatch rate per base, through MultiQC"
unit = "%"
table = "alignment"
column = "mismatch_rate"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Sequencing error and variants set it; a sample above its stratum had poorer base calls or more adapter left on."
causes = ["poor base calls", "adapter left on the reads"]
action = "flag"
matters_for_de = false
read_length_tied = true
source = "dataset only"
source_type = "course_convention"

[metrics.align_splices_per_100]
stage = "align"
title = "Splices per 100 reads"
meaning = "Spliced alignments per 100 uniquely mapped reads; STAR reports them, HISAT2 does not."
computed = "STAR splices / uniquely mapped reads × 100"
unit = "splices per 100 reads"
table = "alignment"
column = "splices_per_100_unique"
scale = "linear"
direction = "none"
bands = "dataset_only"
rationale = "Mature mRNA carries splice junctions and pre-mRNA fewer; a sample unlike its stratum holds more unspliced RNA or more DNA."
causes = ["pre-mRNA", "genomic DNA contamination"]
action = "flag"
matters_for_de = false
read_length_tied = true
source = "dataset only"
source_type = "course_convention"

[metrics.gene_strand_bias]
stage = "align"
title = "Strand of the gene-assigned reads"
meaning = "The share of gene-assigned reads on the gene's own strand: near 0 or 1 in a stranded library, near 0.5 in an unstranded one."
computed = "featureCounts Assigned at -s 1 / (Assigned at -s 1 + Assigned at -s 2), on the main alignment"
unit = "fraction"
table = "strandedness"
column = "forward_share"
kind = "strandedness"
direction = "none"
stranded = 0.8
unstranded = 0.1
rationale = "nf-core/rnaseq 3.27.0 applies these thresholds to Salmon's strand share and to RSeQC infer_experiment on the genome alignment, which leaves out a read on genes of both strands. featureCounts at -s 1 and at -s 2 assigns such a read both times, so for a stranded library this share sits nearer 0.5 than RSeQC's. Applying the same cut-offs here is this course's choice."
causes = ["a different library protocol", "genomic DNA contamination"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "nf-core/rnaseq 3.27.0 stranded_threshold 0.8, unstranded_threshold 0.1 (nextflow.config), which docs/usage.md applies to Salmon and to RSeQC infer_experiment; transferred to featureCounts gene-assigned reads"
source_type = "course_convention"

# The GDC counts files' own strand columns (ctx.gather.gdc): STAR's GeneCounts per read strand.
# In the four TCGA projects on this Mac, 52 of 3,008 files share 0.0444 to 0.1243, the rest
# 0.4948 to 0.5332, so no file falls between classes (measured 2026-10-07).
[metrics.gdc_strand_share]
stage = "counts"
title = "Strand of a GDC counts file"
meaning = "The share of a file's gene counts on the first read strand: near 0 or 1 for a stranded library, near 0.5 for an unstranded one."
computed = "STAR GeneCounts stranded_first / (stranded_first + stranded_second), summed over genes, N_ rows left out"
unit = "fraction"
table = "gdc_samplesheet"
column = "first_strand_share"
kind = "strandedness"
direction = "none"
stranded = 0.8
unstranded = 0.1
rationale = "nf-core sets these thresholds on Salmon's fragments over transcripts; STAR counts each read once per strand setting, a read on overlapping genes of both strands left out. Applying the same cut-offs to GDC's columns is this course's choice."
causes = ["a stranded library in an unstranded project", "an unstranded library in a stranded project"]
action = "exclude"
matters_for_de = true
read_length_tied = false
source = "nf-core/rnaseq 3.27.0 stranded_threshold 0.8, unstranded_threshold 0.1 (nextflow.config), applied to GDC STAR - Counts strand columns"
source_type = "course_convention"

# ---- Quantification (Salmon 2.7.0) -------------------------------------------------------

[metrics.salmon_percent_mapped]
stage = "quant"
title = "Reads Salmon assigned"
meaning = "The share of reads Salmon placed on an annotated transcript."
computed = "Salmon percent_mapped (meta_info.json)"
unit = "%"
table = "general_stats"
column = "salmon-percent_mapped"
module = "salmon"
scale = "linear"
direction = "higher"
rationale = "Salmon's own lines, from the release that quantified Step-1; they catch a wrong reference or a failed library. Lenient for sorted blood cells on a decoy-aware index, whose cell-type medians lose 15 to 26 % of reads to the genome decoys, so the dataset check beside them finds the low mappers. Conesa et al. 2016 expect a transcriptome rate slightly below the genome's 70 to 90 % and give no number."
causes = ["intronic reads from pre-mRNA", "contamination", "rRNA"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "Salmon 2.7.0 crates/salmon-core/src/diagnostics.rs input_diagnostics() (github.com/COMBINE-lab/salmon/blob/v2.7.0/crates/salmon-core/src/diagnostics.rs): 'The thresholds are judgement calls, not statistics: a healthy bulk RNA-seq run against a matching transcriptome typically maps 70-90%. Below 30% something is usually wrong; below 10% it is almost certainly the wrong reference.' Below 30 % writes low_mapping_rate, below 10 % very_low_mapping_rate, both at severity warning. Read 2026-10-01."
source_type = "tool_code"
good = 30.0
usable = 10.0

[metrics.salmon_strand_bias]
stage = "quant"
title = "Strand of the reads"
meaning = "The share of reads on the transcript's own strand: near 0 or 1 in a stranded library, near 0.5 in an unstranded one."
computed = "Salmon lib_format_counts.json strand_mapping_bias: SF / (SF + SR) for single-end runs, ISF / (ISF + ISR) for paired-end ones"
unit = "fraction"
table = "general_stats"
column = "salmon-strand_mapping_bias"
module = "salmon"
kind = "strandedness"
direction = "none"
stranded = 0.8
unstranded = 0.1
causes = ["a different library protocol", "genomic DNA contamination"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "nf-core/rnaseq 3.27.0 stranded_threshold 0.8, unstranded_threshold 0.1 (nextflow.config; the fixture's params file)"
source_type = "pipeline_default"
plot_unstranded_tolerance = 0.01
plot_source = "Salmon 2.7.0 crates/salmon-core/src/libtype.rs LibFormatSummary::diagnostics() (github.com/COMBINE-lab/salmon/blob/v2.7.0/crates/salmon-core/src/libtype.rs): under an unstranded library, |strand_mapping_bias - 0.5| > 0.01 writes strand_bias_unstranded, 'detected a *potential* strand bias > 1% in an unstranded protocol', a warning. Drawn for runs quantified as U only. Read 2026-10-01."

[metrics.salmon_compatible_ratio]
stage = "quant"
title = "Reads compatible with the library type"
meaning = "The share of reads that fit the library type Salmon inferred."
computed = "Salmon lib_format_counts.json compatible_fragment_ratio"
unit = "%"
table = "general_stats"
column = "salmon-compatible_fragment_ratio"
module = "salmon"
scale = "linear"
direction = "higher"
bands = "dataset_only"
rationale = "Salmon warns when more than 5 % of fragments disagree with the library type. A single-end run quantified as unstranded accepts either strand, so it reads 100 by construction; the line separates runs only in a stranded or paired cohort."
causes = ["a mix of library types", "genomic DNA contamination"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
plot_line = 95.0
plot_source = "Salmon 2.7.0 crates/salmon-core/src/libtype.rs LibFormatSummary::diagnostics() (github.com/COMBINE-lab/salmon/blob/v2.7.0/crates/salmon-core/src/libtype.rs): when 1.0 - compatible_fragment_ratio > 0.05 it warns, high_incompatible_fraction, 'greater than 5% of the fragments disagreed with the expected library type'. A warning, so a line, not a fail. Read 2026-10-01."

# ---- Counts: computed by ctx from the gene matrix and the GENCODE 50 gene types --------------

[metrics.library_size]
stage = "counts"
title = "Library size"
meaning = "How many reads were counted on genes."
computed = "column sum of the gene counts"
unit = "reads"
table = "counts"
column = "library_size"
scale = "log10"
direction = "higher"
bands = "dataset_only"
rationale = "DESeq2's size factors correct depth; a library far below the rest is noisier, not wrong. The column equals Salmon's transcriptome-mapped reads, fewer than the genome-aligned reads ENCODE counts, so ENCODE's lines are drawn, not judged."
causes = ["a failed library", "low input"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
plot_bands = [30000000.0, 20000000.0]
plot_source = "ENCODE, Bulk RNA-seq Data Standards and Processing Pipeline (encodeproject.org/data-standards/rna-seq/long-rnas/, updated June 2017): \"Each replicate should have 30 million aligned reads, although older projects aimed for 20 million reads.\" ENCODE's audit, ENCODE-DCC/encoded src/encoded/audit/analysis.py at commit 4638915d (2022-11-15), check_file_read_depth with upper_threshold=30000000 and middle_threshold=20000000: 20 to 30 million aligned reads is 'low read depth' at level WARNING, 1 to 20 million 'insufficient read depth' at level NOT_COMPLIANT. Aligned reads are unique reads plus multi-mappers at fewer than 20 loci. Read 2026-10-01. This column equals Salmon's transcriptome-mapped reads, fewer than genome-aligned reads: a library above a line meets it, one below may still meet it."

[metrics.genes_detected]
stage = "counts"
title = "Genes detected"
meaning = "How many genes have at least one read."
computed = "genes with count >= 1"
unit = "genes"
table = "counts"
column = "genes_detected"
scale = "linear"
direction = "higher"
bands = "dataset_only"
rationale = "Depends on depth, on the annotation, on the detection rule and on the cell type's RNA content, which is low in neutrophils (TODO.md, M2). No short-read bulk source gives a number; ENCODE's 8,000 and 4,000 are for long-read RNA-seq."
causes = ["low depth", "degraded RNA", "a few transcripts taking most reads"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"

[metrics.top_gene_share]
stage = "counts"
title = "Share of the top gene"
meaning = "The share of all counted reads that fall on the single most-read gene that is not rRNA."
# P2Q.10: left out of the search are the genes the run's own annotation types Mt_rRNA, and the
# genes exclude_gene_ids lists. ctx.qc.checkpoint reads the list here and nowhere else, and
# rrna_fraction counts the same two genes. Without an annotation the metric is not measured,
# since Mt_rRNA cannot be told apart. On Step-1 the median fell from 5.34 % to 3.22 %; the
# largest, 17.88 %, is DEFA1B in ERX6994400, under both definitions.
computed = "largest count among genes other than the annotation's Mt_rRNA genes and exclude_gene_ids / library size"
unit = "fraction"
table = "counts"
column = "top_gene_share"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Neutrophil libraries are dominated by a few granule and ribosomal transcripts by biology; the dataset shows which run is more dominated than its peers."
causes = ["one transcript taking most reads", "rRNA", "globin"]
# The two lncRNAs GENCODE 50 annotates antisense to 18S rRNA sequence, 923 nt each on the minus
# strand of chr21 at 8,254,592 and 8,393,419. Unversioned, so a release that bumps the version
# still matches.
exclude_gene_ids = ["ENSG00000280614", "ENSG00000281383"]
exclude_source = "TODO.md P2Q.10 (D-052): leave out Mt_rRNA genes and the 18S-antisense lncRNAs ENSG00000280614 and ENSG00000281383; approved as decision 10 of docs/plans/2026-10-01_qc_bands_proposal_approved.md, Rytis 2026-10-01"
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"

[metrics.mt_fraction]
stage = "counts"
title = "Mitochondrial transcripts"
meaning = "The share of reads on genes of the mitochondrial genome, its rRNA genes apart."
computed = "counts on chrM genes other than Mt_rRNA / library size"
unit = "fraction"
table = "counts"
column = "mt_fraction"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Mitochondrial content varies with cell type and state; a high share in one sample can mean stressed or dying cells."
causes = ["dying cells", "cytoplasmic RNA loss"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"

[metrics.mt_rrna_fraction]
stage = "counts"
title = "Mitochondrial rRNA"
meaning = "The share of reads on the two mitochondrial rRNA genes, MT-RNR1 and MT-RNR2."
computed = "counts on GENCODE gene_type Mt_rRNA / library size"
unit = "fraction"
table = "counts"
column = "mt_rrna_fraction"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Poly-A selection removes most rRNA, not all; the dataset shows which library kept more."
causes = ["incomplete poly-A selection or rRNA depletion"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
plot_line = 0.1
plot_source = "RNA-SeQC 2.4.2 python/rnaseqc/report.py (github.com/getzlab/rnaseqc/blob/v2.4.2/python/rnaseqc/report.py) draws \"'rRNA Rate': 0.1\" as a dashed line and marks samples above it ('gt'). Its src/GTF.cpp counts as rRNA every transcript_type matching 'rRNA', 'const boost::regex ribosomalPattern(\"rRNA\")': on GENCODE that is Mt_rRNA, rRNA and rRNA_pseudogene, this column plus rrna_fraction. RNA-SeQC divides by genome-mapped reads and this column by Salmon-mapped reads, so a value here reads at or above RNA-SeQC's. Read 2026-10-01."

[metrics.rrna_fraction]
stage = "counts"
title = "Nuclear rRNA"
meaning = "The share of reads on nuclear rRNA: the 5S and 5.8S genes, their pseudogenes, and 18S through the two lncRNAs annotated antisense to it. GENCODE 50 has no 45S gene, so 28S reads land on no gene."
# P2Q.10: the two 18S-antisense lncRNAs join the nuclear rRNA genes. On Step-1 (unstranded)
# the median rose from 6.48e-6 to 0.041, the range 0.0018 to 0.167 (measured 2026-10-09).
computed = "counts on nuclear rRNA and rRNA_pseudogene genes and the two 18S-antisense lncRNAs of top_gene_share's exclude_gene_ids / library size"
unit = "fraction"
table = "counts"
column = "rrna_fraction"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "The antisense lncRNAs hold 18S reads only in an unstranded library, where a read lands on either strand; in a stranded one this is a lower bound. 28S is never counted. No band until one is proposed on this definition (D-052)."
causes = ["incomplete poly-A selection or rRNA depletion"]
# Keep, as D-052 decided until its definition counts 18S and 28S: GENCODE 50 has no 45S gene,
# and Rytis chose no 45S re-quantification (2026-10-22), so it is shown and never flagged.
action = "keep"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"

[metrics.globin_fraction]
stage = "counts"
title = "Globin"
meaning = "The share of reads on the haemoglobin genes HBA1, HBA2 and HBB."
computed = "counts on HBA1, HBA2, HBB / library size"
unit = "fraction"
table = "counts"
column = "globin_fraction"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "Sorted leukocytes carry almost no globin: peripheral-blood samples sit at or below 0.062 %, bone-marrow ones reach 0.119 %. Usable to 1 %, one-seventeenth of a globin-depleted whole-blood library. The dataset check still flags small differences between peers."
causes = ["red cell or reticulocyte carry-over"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"
plot_bands = [0.001, 0.01]
plot_source = "Course convention, placed on Step-1 measured 2026-10-01: every peripheral-blood sample is at or below 0.062 % globin and the six above 0.09 % are bone marrow, where erythroid precursors are expected. Good to 0.1 %, usable to 1 %. Scale only, not a source: whole blood carries a mean 81 % globin reads undepleted and 17 % after globin depletion (Shin et al. 2014, PLoS One 9(3):e91041, doi:10.1371/journal.pone.0091041)."

[metrics.replicate_spearman]
stage = "counts"
title = "Agreement with its group"
meaning = "How well a sample's gene ranking agrees with the other samples of its peer group: those sharing its cell type and condition, or whichever sheet columns ctx qc groups peers by."
computed = "median Spearman correlation with each other sample of the peer group, over the genes read in any sample of it"
unit = "rho"
table = "counts"
column = "replicate_spearman"
scale = "linear"
direction = "higher"
bands = "dataset_only"
rationale = "ENCODE's standard (encodeproject.org/data-standards/rna-seq/long-rnas/, June 2017, read 2026-10-01) asks for a Spearman correlation above 0.9 between isogenic and above 0.8 between anisogenic replicates, computed pairwise on RSEM FPKM over genes with mean log2 FPKM above 0. This column is a median over peers on counts over every gene read, so the number does not transfer; 39 of 210 Step-1 samples also share a donor with a peer."
causes = ["a mislabelled sample", "a failed library", "a different cell population"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"

[metrics.pca_distance]
stage = "counts"
title = "Distance from its group"
meaning = "How far a sample lies from the centre of its peer group on the first two principal components of the blind VST of every sample, the PCA M5 draws."
computed = "Euclidean distance to the peer group's median on PC1 and PC2"
unit = "VST units"
table = "counts"
column = "pca_distance"
scale = "linear"
direction = "lower"
bands = "dataset_only"
rationale = "A PCA outlier has no absolute scale; it is judged against its own group."
causes = ["a mislabelled sample", "a batch", "a failed library"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "dataset only"
source_type = "course_convention"

[metrics.sex_check]
stage = "counts"
title = "Recorded sex against expression"
meaning = "Whether XIST and the chrY genes agree with the sex recorded for the donor."
computed = "ctx.qc.identity.sex_check: XIST against RPS4Y1, DDX3Y, KDM5D, UTY, EIF1AY (rule R8)"
unit = "category"
table = "counts"
column = "sex_agrees"
kind = "category"
direction = "none"
causes = ["a mislabelled sample", "a sample swap", "an HSCT recipient carrying donor cells"]
action = "flag"
matters_for_de = true
read_length_tied = false
source = "rule R8 of conf/datasets/Non-cancerous-blood.toml; the sex genes of ctx.qc.identity"
source_type = "course_convention"
rationale = "A disagreement is a question for the metadata, never a reason on its own to drop a sample; HSCT samples are compared with donor sex."
