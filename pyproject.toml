[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cancer-transcriptomics-teaching"
version = "0.1.0"
description = "Cancer Transcriptomics Teaching Suite: the ctx command-line tool."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rytis Stakaitis", email = "rytis.stakaitis@umu.se" }]
# Ranges only: the pins live in pixi.toml and pixi.lock (CONVENTIONS.md, Stack).
dependencies = ["typer"]

[project.scripts]
ctx = "ctx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctx"]

[tool.mypy]
strict = true
files = ["src"]

# These ship no type information; everything else stays strict.
[[tool.mypy.overrides]]
module = ["seaborn", "seaborn.*", "plotly", "plotly.*", "scipy", "scipy.*", "threadpoolctl",
          "pandas", "pandas.*", "pydeseq2.*", "formulaic", "joblib.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.interrogate]
fail-under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs the network; deselected by default, run with -m network",
    "budget: real-size run against the Track A or B budget; minutes; run with -m budget",
    "needs_star: needs a STAR that maps; a failing probe skips only on darwin-arm64 with CI unset, and fails everywhere else (R6.2, D-036)",
    "realdata: reads the GDC folders on this Mac (CTX_GDC_HOME, else ~); run with -m realdata",
]
addopts = "-m 'not network and not budget and not realdata'"
