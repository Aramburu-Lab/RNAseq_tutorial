name: ci

# Lint and test Cancer Transcriptomics Teaching Suite. The hooks in .pre-commit-config.yaml are the same checks; they
# run here as well because a hook can be skipped with `--no-verify` and a CI job cannot.
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # From knowledge/versions.md. Nothing else in this file hardcodes a version.
  PIXI_VERSION: "v0.76.2"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      # labcore is a git dependency (ADR-4, Channel 3). While the repo is private an unauthenticated
      # clone sits at a credential prompt, so the job hangs until the runner times out instead of
      # failing in ten seconds with a readable error.
      - name: Authenticate git for the labcore dependency
        env:
          GH_TOKEN: ${{ secrets.LABCORE_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      # --locked, never --frozen: --locked aborts when pixi.lock is stale relative to pixi.toml,
      # --frozen installs the stale lock silently. A project generated without pixi on the machine
      # has no lock at all yet, and that is a different, non-fatal state.
      - name: Install the environment
        run: |
          if [ -f pixi.lock ]; then
            pixi install --locked -e default
            # The read-level tools ctx runs by subprocess (ctx.tools); tests that run them fail
            # without it rather than skip (D-027).
            pixi install --locked -e reads
          else
            echo "::warning::no pixi.lock committed — resolving fresh. Run 'pixi install' and commit the lock."
            pixi install -e default
          fi

      # `!cancelled()` on every check below, so one run reports every problem instead of only the
      # first. The job still fails; it just fails informatively.

      - name: ruff
        if: ${{ !cancelled() }}
        run: pixi run lint

      - name: prek
        if: ${{ !cancelled() }}
        run: pixi run prek run --all-files --show-diff-on-failure

      - name: labdocs lint
        if: ${{ !cancelled() }}
        run: pixi run labdocs lint

      # The staleness guard. Without it explain_codebase.html drifts from the scripts it claims to
      # describe and becomes the stale wiki this whole system exists to replace (ADR-10).
      - name: labdocs render --check
        if: ${{ !cancelled() }}
        run: pixi run labdocs render --check

      # Ubuntu 24.04 lets a program make unprivileged user namespaces only when an AppArmor
      # profile grants it, and the runner's Chromium has none, so it aborted "No usable sandbox!"
      # and 72 page tests errored (run 37807649888). The profile below grants that one binary
      # what Chromium's own document prescribes (docs/security/apparmor-userns-restrictions.md),
      # so it keeps its sandbox; --no-sandbox, or the sysctl that lifts the rule for every
      # program, would test a weaker browser than a reader runs. The last line fails here, not
      # 72 tests later, if the profile does not take.
      - name: Let the runner's Chromium build its sandbox
        if: ${{ !cancelled() }}
        run: |
          chrome="$(readlink -f "$(command -v chromium)")"
          sudo tee /etc/apparmor.d/ctx-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile ctx-chromium "$chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/ctx-chromium
          echo "CTX_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          "$chrome" --headless=new --disable-gpu --dump-dom about:blank > /dev/null

      # -rpfEsxX lists every test by outcome, so a test that must run (M3.10's fake-STAR
      # refusal) is seen to pass, not merely absent from the failures.
      # Serial, not the test task's -n auto: on this 2-core runner xdist took 1,799 s against
      # 1,372 s serial (runs 37942987776, 37943036813; Rytis 2026-10-14).
      - name: pytest
        if: ${{ !cancelled() }}
        env:
          PYTEST_ADDOPTS: "-rpfEsxX --durations=60"
        run: pixi run pytest -q
