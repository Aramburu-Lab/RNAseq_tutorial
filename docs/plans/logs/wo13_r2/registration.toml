# R2 proof: the external check, registered before any ctx command ran on the held-out study.
# Pasted unchanged as the [sanity] block of the proof's dataset file; the proof compares them.
#
# Source, read in full on 2026-10-18 through PubMed Central (PMC10188209): Zheng et al. 2023,
# Front Oncol 13:1106249, doi:10.3389/fonc.2023.1106249, Results, "Construction and validation
# of a seven-lncRNAs panel": the seven lncRNAs "were significantly upregulated in LSCC tissues
# compared to normal counterparts in both the Shanxi and TCGA cohorts". The Shanxi cohort is
# 107 LSCC and paired adjacent normal mucosa; GEO's series holds 50 of those pairs (titles 78
# to 127), the paper's differential test was DESeq2 at p < 0.05 and |fold change| >= 2 on
# TopHat/Cufflinks GRCh37 quantification. This run counts NCBI's own raw counts on GRCh38.p13,
# Annotation Release 109.20190905 (GEO's download page), so the conditions are the course's:
# raw log2 FC >= 1 and BH padj < 0.05, tumour over normal, paired by patient.
# Corrected 12:20, after registration and before any run, conditions unchanged: the first
# text named HISAT2 as NCBI's aligner from memory; NCBI's pipeline page answered with a
# CAPTCHA, which was not attempted, so the aligner is not stated. Thresholds are M5's ALPHA 0.05 and LFC_MIN 1, not tuned.
# Not blind in one respect: the seven names were checked present in GENCODE 50 (gene_name),
# no expression value of the study was read. A gene absent from NCBI's counts, or left out by
# gather's mapping, is NOT MEASURED, never PASS.
[sanity]
registered_on = "2026-10-18 12:14"

[[sanity.rules]]
id = "LSCC.ensg00000233397"
text = "ENSG00000233397 is higher in laryngeal squamous cell carcinoma than in paired adjacent normal mucosa."
source = "Zheng et al. 2023 Front Oncol, doi:10.3389/fonc.2023.1106249, Results (seven-lncRNAs panel), read in full 2026-10-18"
conditions = [{ metric = "gene.tumour_normal.ENSG00000233397.lfc", op = ">=", value = 1.0 }, { metric = "gene.tumour_normal.ENSG00000233397.padj", op = "<", value = 0.05 }]

[[sanity.rules]]
id = "LSCC.barx1_dt"
text = "BARX1-DT is higher in laryngeal squamous cell carcinoma than in paired adjacent normal mucosa."
source = "Zheng et al. 2023 Front Oncol, doi:10.3389/fonc.2023.1106249, Results (seven-lncRNAs panel), read in full 2026-10-18"
