# Published container digests for cancer_transcriptomics_teaching. Generated by containers/build.sh release.
#
# Empty until the first release. Do not hand-edit: build.sh rewrites this file wholesale from what
# the registry actually returned after the push, which is the only value worth recording.
#
# GHCR and ORAS only (D-004). A docker.io/ dev tag must never appear here — dev images are built on
# a laptop under QEMU and are not reproducible, so a digest for one records nothing you could
# rebuild.
#
# Format: six tab-separated columns, one row per artifact.
#
#   kind       oci | sif
#   version    semver passed to `build.sh release --version`
#   reference  registry repo without a tag: ghcr.io/aramburu-lab/cancer_transcriptomics_teaching-analysis,
#              or oras://ghcr.io/aramburu-lab/cancer_transcriptomics_teaching-analysis-sif
#   digest     oci: the registry manifest digest, i.e. what `@sha256:...` resolves against.
#              sif: the sha256 of the .sif FILE. Two `apptainer pull oras://` must reproduce this
#              byte for byte (ADR-7); a `docker://` pull will not, because conversion metadata
#              such as the creation date varies per run.
#   built_utc  ISO-8601 Z
#   vcs_ref    short commit the image was built from. build.sh refuses to release from a dirty tree.
#
# Example (illustrative — not a real digest):
#
#   oci	0.1.0	ghcr.io/aramburu-lab/cancer_transcriptomics_teaching-analysis	sha256:0000…	2026-01-01T00:00:00Z	abc1234
#   sif	0.1.0	oras://ghcr.io/aramburu-lab/cancer_transcriptomics_teaching-analysis-sif	sha256:0000…	2026-01-01T00:00:00Z	abc1234
#
# Commit every change to this file. At paper submission it is the record of what the analysis ran
# in, and every reference archived with the manuscript pins @sha256 from here, never a tag
# (containers/README.md, "Publication freeze").
#
# kind	version	reference	digest	built_utc	vcs_ref
