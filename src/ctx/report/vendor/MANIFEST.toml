# Third-party files a page inlines to draw its own PDF and SVG of a changed view (D-033,
# amended 2026-10-01). ctx.report.export reads this file and refuses a file whose SHA-256
# differs from the one here. Each was fetched once and is never fetched at build or view time.
# A page prints each script's licence_files before its code (export.notice).

[[file]]
name = "jsPDF"
version = "4.2.1"
file = "jspdf.umd.min.js"
# npm pack jspdf@4.2.1 from the official registry; the tarball's SHA-512 equalled npm's
# published dist.integrity, sha512-YyAXyvnmjTbR4bHQRLzex3CuINCDlQnBqoSYyjJwTP2x9jDLuKDzy7aKUl0hgx3uhcl7xzg32agn5vlie6HIlQ==
# (2026-10-01). The file is package/dist/jspdf.umd.min.js, unchanged.
source = "https://registry.npmjs.org/jspdf/-/jspdf-4.2.1.tgz"
sha256 = "e6551fcdc32f09d6853b2c5126d18d01d9447e0da618a41a11ebeee0f6c20d54"
licence = "MIT"
# Its own notice, then those of fast-png, fflate, iobuffer and pako, which its bundle holds.
licence_files = ["LICENSE.jspdf.txt", "LICENSE.jspdf-bundled.txt"]

[[file]]
name = "svg2pdf.js"
version = "2.8.1"
file = "svg2pdf.umd.min.js"
# npm pack svg2pdf.js@2.8.1, its peer jspdf ^4.0.0 || ^3.0.0 || ^2.0.0; the tarball's SHA-512
# equalled npm's dist.integrity, sha512-AzXfPHjHnFt9dpdRPhWWBOKipnMSWQZRKiV3FTTPdY6wwRgT3labbA4s0HIQaskNhwAhrcI2u2rDhD8j8udfNQ==
# (2026-10-01). The file is package/dist/svg2pdf.umd.min.js, unchanged.
source = "https://registry.npmjs.org/svg2pdf.js/-/svg2pdf.js-2.8.1.tgz"
sha256 = "2f10c0d16959e9a0c4cfd8605cfce0830ddc384337f74fa0351a6eff1c1efb8b"
licence = "MIT"
# Its own notice, then those of cssesc, font-family-papandreou, specificity, svgpath and
# tslib, which its bundle holds; the minified bundle prints none of them.
licence_files = ["LICENSE.svg2pdf.txt", "LICENSE.svg2pdf-bundled.txt"]

# Liberation Sans 2.1.5, Arial's metric twin, embedded in the PDF for the Arial chain. Found on
# this Mac first (a copy inside the fastqc-rust 1.0.1 crate's assets), then checked against the
# official release, liberation-fonts-ttf-2.1.5.tar.gz, linked from
# https://github.com/liberationfonts/liberation-fonts/releases/tag/2.1.5; GitHub publishes no
# checksum for it, and its SHA-256 on arrival (2026-10-01) was
# 7191c669bf38899f73a2094ed00f7b800553364f90e2637010a69c0e268f25d0. Both TTFs are byte for byte
# the release's; LICENSE.liberation-fonts.txt is the release's LICENSE. A page carries each cut
# to the characters it can set (export.subset_font, Rytis 2026-10-01) and renamed Ctx Sans, a
# Modified Version that may not keep the Reserved Font Name Liberation (OFL condition 3; Rytis
# 2026-10-02): family, full, unique and PostScript names are its own, every other name record
# is kept; its note says so.
[[file]]
name = "Liberation Sans Regular"
version = "2.1.5"
file = "LiberationSans-Regular.ttf"
source = "https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz"
sha256 = "76d04c18ea243f426b7de1f3ad208e927008f961dc5945e5aad352d0dfde8ee8"
licence = "OFL-1.1"
licence_files = ["LICENSE.liberation-fonts.txt"]
note = "Ctx Sans, the face this page embeds in the PDFs it draws of a figure's view, is a Modified Version of Liberation Sans 2.1.5: cut to the characters this page's figures can set, and renamed, as the licence below requires of a Modified Version of a font with a Reserved Font Name. It is under the SIL Open Font License 1.1, as Liberation Sans is."

[[file]]
name = "Liberation Sans Bold"
version = "2.1.5"
file = "LiberationSans-Bold.ttf"
source = "https://github.com/liberationfonts/liberation-fonts/files/7261482/liberation-fonts-ttf-2.1.5.tar.gz"
sha256 = "788abee4c806d660e8aee46689dd8540cd4bb98da03dcc9d171ce3efd99a9173"
licence = "OFL-1.1"
licence_files = ["LICENSE.liberation-fonts.txt"]
note = "Ctx Sans, the face this page embeds in the PDFs it draws of a figure's view, is a Modified Version of Liberation Sans 2.1.5: cut to the characters this page's figures can set, and renamed, as the licence below requires of a Modified Version of a font with a Reserved Font Name. It is under the SIL Open Font License 1.1, as Liberation Sans is."
