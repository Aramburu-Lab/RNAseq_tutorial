# The custom-data guide (ctx guide, ctx.report.guide). Placeholders in {braces} are filled by the
# code; keep their names. Every command on the page comes from a script's Usage block, the CLI
# or ctx's own constants, never from this file.

title = "Your own data: {dataset}"
kicker = "Guide"
budget = "Track B: under {minutes} min and {ram_gb} GB"
purpose = "Take a study from its accessions to course pages of its own: download the reads, count them, then run every module the dataset file declares."
input = "A dataset file: its slug, the accessions to download, and how each run gets its donor, cell type and condition. The worked example is `conf/datasets/four_runs.toml` with its own table."
method = """The download runs [[nf-core/fetchngs]] on the metadata alone first, so the size is read before any [[FASTQ]] is fetched. The count runs nf-core/rnaseq, [[Salmon]] only, against references checked with the publisher's [[md5|MD5SUMS]].

One launcher per pipeline serves both computers: `CTX_SITE=laptop` runs every task here under Docker, and the default runs each as a Slurm job on Kebnekaise. The last part copies the outdirs into a ctx root and runs the modules in course order.

A [[TCGA]] project has its own part: one script downloads its GDC counts."""
interpretation = """Run `ctx run --check` until it lists nothing; each problem comes with the lines that fix it, filled from your own runs. A contrast's n is counted after its filters and replicate ranking, as `ctx de` counts it.

Each module page keeps its own Reproduce block and peak memory, so a slow or failing step is found on its own page. The gather page lists what each pipeline run cost, process by process."""
# "Term: rest" in a mistake prints Term in bold.
pitfalls = [
    "Downloading before reading the size: the metadata run prints the bytes at ENA; a laptop holds few runs.",
    "Cleaning nf-core/rnaseq's work folder early: keep it until `ctx gather` has read the copied results.",
    "Trusting a group of two: with two runs a side, any difference in condition or batch reads as the contrast.",
]

[[terms]]
term = "Outdir"
meaning = "The results folder a pipeline writes; ctx reads it and never writes into it."

[[terms]]
term = "Site"
meaning = "The computer a launcher runs on: `laptop`, or `kebnekaise` by default; a file in `scripts/bash/` each."

[[terms]]
term = "Own table"
meaning = "A CSV or TSV beside the dataset file, one row per run, for a study without an SDRF."

[[questions]]
prompt = "Why does the guide download the metadata alone first?"
answer = "The metadata run prints how many bytes of FASTQ the study holds at ENA, so the download is chosen with its size in view."

[[questions]]
prompt = "Why does `ctx run` start each module as its own command?"
answer = "Each page then records its own command, wall time and peak memory, exactly as a module run by hand would."

[[questions]]
prompt = "Why can the worked example not support a biological claim?"
answer = "Its two groups differ in condition as well as cell type, and two runs a side estimate no spread worth trusting."

[keys]
runs = "Accessions to download"
fetchngs = "nf-core/fetchngs"
rnaseq = "nf-core/rnaseq"
genome = "References"
genome_value = "GENCODE release {release}"
project = "GDC project"
release = "GDC release"

[part1]
group = "Part {n}: download the reads"
lead = "The metadata run prints the bytes at ENA; read them, then download."
laptop = "On a laptop with pixi installed and Docker running: the clone, then the metadata run, which prints the size"
frozen = "Every `pixi install` here is `--frozen`: otherwise pixi can rewrite pixi.lock, and a kit built from the clone records `<commit>-dirty`."
laptop_download = "On the laptop, once the size is read: the download"
setup = "On Kebnekaise, once per login: Nextflow from the fetch environment"
cluster = "On Kebnekaise: the metadata job"
cluster_size = "On Kebnekaise, once that job has ended: the size"
cluster_download = "On Kebnekaise, once the size is read: the download"

# Part 1b: a student's own FASTQ files in place of Part 1's download (ctx reads).
[part1b]
group = "Part {n}b: your own FASTQ files instead"
lead = "Files already on the laptop or on Kebnekaise replace the download: ctx reads lays them out as fetchngs.sbatch would, so the count and the course parts run unchanged."
names = "Each file name starts with a sample's name from the table's sample column, then `_` or its ending. Mates end in `_1` and `_2`, or `_R1` and `_R2`, before Illumina's `_001`; the lanes of one sample are its runs, and one replicate."
links = "The files stay where they are: the outdir links each one, and the samplesheet names it by its full path. Every problem is listed at once, and nothing is written until none is left."
laptop = "On a laptop: the clone, then your files, laid out in the run folder the count reads"
cluster = "On Kebnekaise, after the download part's once-per-login block: your files on the storage project"

# Part 1c: a count matrix from a repository in place of Parts 1 to 3 (ctx gather --counts).
[part1c]
group = "Part {n}c: a count matrix instead"
lead = "A study's raw counts replace the download and the count: gather checks the matrix, places its genes on GENCODE, and every module that reads counts runs."
what = "The matrix holds genes as rows and samples as columns, gene IDs in the first column, as TSV or CSV, gzipped or not. Its values are raw counts, whole numbers: gather refuses FPKM, TPM, CPM and log values and names the scale it found."
where = "On a GEO series page, Supplementary file lists the authors' own files; many hold FPKM. For a human RNA-seq series GEO also offers raw counts it computed itself, under Download RNA-seq counts. Their genes are NCBI Gene IDs, which GENCODE's own table places; that download page names the annotation release, for the dataset file's `annotation` line."
find = "On a laptop with pixi installed: the clone, then the files the series offers, NCBI's and the authors'"
size = "The size of NCBI's raw counts, read before the download; for an authors' file set FILE to its name and URL to the suppl folder's address"
download = "Once the size is read: the matrix and the series matrix, which lists every sample's title, source and characteristics"
table_note = "The table is one row per sample, named as the matrix's columns, and each column's values are printed with their counts. Where the titles name the individual, as `LSCC_12` and `ANM_12` do, run it again with `--donor-pattern '_(\\d+)$'`: paired samples then share a donor."
table = "The sample table from the series matrix, and the dataset file to edit"
edit = "Edit each line marked EDIT in the dataset file: its slug, the same as SLUG above, and the table's file name, `$SLUG.csv`. Then the source of the matrix, and which table columns hold the tissue and the condition, with `values` to name each level."
run = "The annotation and gene sets, the check, then every module the dataset file declares"
paired = "Paste each block the check prints. Where every donor has a sample at both levels, add `paired = true` and `design = \"~donor + group\"` to the contrast: the test then compares each patient with itself."
other = "A matrix from ArrayExpress, recount3 or your own pipeline enters the same way: save it under the root's data/raw folder, write the table by hand, and run the last block."

[part2]
group = "Part {n}: count with nf-core/rnaseq"
lead = "The references are checked against the publisher's MD5SUMS before nf-core/rnaseq starts."
laptop = "On a laptop: the references, then the count"
cluster = "On Kebnekaise: the references, then the count job"
needs = "On a laptop, give Docker more memory than the Salmon index's peak: {index_gib:.3f} GiB by docker stats, {trace_gb} GB by Nextflow's trace; the largest sum of tasks running together was the same. The run folder peaked at {folder_gb} GB ({folder_kib:,} KiB), references not saved, and work/ held {work_gb} GB at the end; leave {disk_gb} GB free, the references included. Measured on {date} on an Apple-silicon Mac with Docker at {docker_gib} GiB and {cpus} CPUs."
refs = "The references download first: MD5SUMS, the genome and the GTF of GENCODE release {release}, {refs_bytes:,} B ({refs_gb} GB) in all, measured on {date}."

[part3]
group = "Part {n}: into the course"
lead = "Every module the dataset file declares runs in course order; `--check` first lists what is missing."
copy = "From Kebnekaise to the laptop: the metadata, and the files ctx reads"
laptop = "On the laptop, after the laptop route"
cluster = "On the laptop, after the copy from Kebnekaise"
downloads = "What ctx setup downloads"
meta = "`--fetchngs-dir` names the metadata run's outdir: it lists the same runs as the download without the FASTQ files, so ctx gather checks no MD5. It is also the outdir the copy from Kebnekaise takes."
columns = ["Resource", "Bytes", "From", "On the laptop route"]
found = "found in place, where the count saved it"
fetched = "downloaded"
mine = "A study of your own: its sheet before curation, and a dataset file to edit"
kit = "Your pages as a kit, opened from its START.html"
site = "Another Slurm site: copy scripts/bash/site_kebnekaise.sh to site_<name>.sh, change its profile, queue size, home rule and activation, and set CTX_SITE=<name> before each launcher."

# The M7 part: a protein table of the same samples beside the counts (ctx.proteo.guide).
[mass_spec]
group = "Part {n}: protein of the same samples, for M7"
lead = "A protein table meets the counts gathered into the course root through a sample table; `ctx proteo` then compares the two layers gene by gene."
formats = "Three formats are read: MaxQuant's proteinGroups.txt, DIA-NN's pg_matrix.tsv, and any protein or gene by sample table. MaxQuant's reverse decoys, contaminants and site-only rows leave first, each counted on the page."
missing = "A missing value stays missing, never zero: declare the texts it is written as. A protein group naming several genes is listed, never assigned to one of them."
list = "On the laptop: a PRIDE project's tables and their bytes, read before any download"
fetch = "Once the size is read: one file into the root, checked by PRIDE's SHA-1; paste the printed entry into the dataset file"
samples = "A starter sample table beside the dataset file, one row per sample column: an LFQ export in an archive, a TMT export as a plain file, or DIA-NN's matrix"
block = "The [proteo] block of conf/dataset_template.toml, filled for this dataset; paste it into the dataset file and edit each EDIT line"
run = "Then: register the file in place, and run M7 on the gathered root"
rows = "Fill rna_sample and batch in the starter, and for TMT intensities a reference column marking each plex's reference channel with yes. Delete the rows of channels to leave out, such as empty or booster channels: only listed columns are read."
check = "Every problem of the dataset file, the sample table and the protein table is listed at once. An RNA sample gather never wrote is one of them."

# Before Part 1: the accession a study is found by (M1a), and the class exercise (M1b). These
# notes print as plain text, so a field or command is named without backticks.
[find]
group = "First: find the accession"
lead = "A paper's data availability statement names a study. Each archive nests the same four levels, and fetchngs takes an accession at any of them."
levels = "Accession levels"
columns = ["Level", "SRA", "ENA", "DDBJ", "Holds"]
rows = [
    ["Study", "SRP, PRJNA", "ERP, PRJEB", "DRP, PRJDB", "every sample and run of a project"],
    ["Sample", "SRS, SAMN", "ERS, SAMEA", "DRS, SAMD", "one biological source"],
    ["Experiment", "SRX", "ERX", "DRX", "one library"],
    ["Run", "SRR", "ERR", "DRR", "one sequencing run, one or two FASTQ files"],
]
archives = "GEO and ArrayExpress hold metadata and processed files. The reads sit in SRA, ENA and DDBJ, which mirror each other."
routes = "Three routes lead to the runs: a GEO series through the SRA Run Selector's accession list, an ENA text search and its read files report, or an ArrayExpress page and its linked ENA study."
arrayexpress = "fetchngs refuses an E-MTAB accession: give the study's ENA accession, ERP or PRJEB, instead. A run accession pulls every run of its experiment."
budget = "Before downloading, read library_layout, library_strategy, library_selection, instrument_model, read_count and fastq_bytes in the metadata run's samplesheet/samplesheet.csv."
exercise = "Class exercise: run the metadata block on a whole study, list its two to four runs with the smallest fastq_bytes, download those, then check them with ctx gather. The worked example's runs were picked this way."

# The TCGA part (ctx.report.guide_gdc): any GDC project, from scripts/bash/fetch_gdc.sbatch to
# ctx run. Each block's lines come from the script's Usage block or the CLI, never from here.
[gdc]
group = "Part {n}: any TCGA project"
lead = "One script downloads a project's counts, miRNA files, clinical records and the TCGA-CDR from the GDC; a template holds the rest."
find = "The project ID is TCGA- and the cancer's code, as the GDC Data Portal's Projects page lists it. The CDR's type is that code alone."
pairs = "Pick a project with Solid Tissue Normal samples: M5 compares each patient's tumour with their own normal tissue. The CDR paper's endpoint table lists which survival endpoints each type supports."
laptop = "TCGA on a laptop with pixi installed: the clone, then the metadata, which prints the size"
laptop_download = "TCGA on the laptop, once the size is read: the download"
cluster_login = "On Kebnekaise, run Part 1's once-per-login block first, so `CTX_REPO` and `CTX_STORE` are set and the fetch environment is active."
cluster = "TCGA on Kebnekaise: the metadata, which prints the size"
cluster_download = "TCGA on Kebnekaise, once the size is read: the download job"
cluster_done = "TCGA on Kebnekaise, once the job has ended: its checks"
copy = "TCGA from Kebnekaise to the laptop: the three folders the job wrote"
template = "The script keeps each file only when its MD5 equals the manifest's, and ends with a failure while any file is missing. Run the same command again to resume."
start = "TCGA on the laptop: the dataset file, copied from the GDC template"
edit = "Edit each line the copy marks EDIT: the slug, the project, the CDR's type, the genes, the endpoint and the endpoint table's row. Register sanity rules, with their sources, before the first run."
downloads = "What ctx setup downloads for a TCGA project"
columns = ["Resource", "Bytes", "From"]
check = "TCGA on the laptop, once edited: the resources, then the check"
check_reads = "The check reads every counts file, as gather will, and prints each line to set: the release, the CDR's type, the pairs and the CDR's own endpoint counts."
run = "TCGA on the laptop, once the check lists nothing that stops the run: every module"
genecard = "ctx run leaves out ctx genecard, M9: its gene cards read GTEx's release files, which a TCGA dataset file declares apart."
