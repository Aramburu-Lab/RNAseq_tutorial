# The course home page of a student kit (ctx.report.course) and the kit's README
# (scripts/python/build_kit.py). Every string here passes the prose lint (ctx.report.prose).

title = "Course home"
intro = "Every module of the course in order, with a link to each dataset's page of it. Each page says what the module does, then what it found."
note = "Real pages come from public data. Made-up pages come from a seeded simulation with planted genes, a batch and planted QC problems. No number on a made-up page describes a real sample."
# Opened from inside the zip, the page shows but its links fail; the page itself must say why.
unzip = "If a link here does not open, unzip the kit and open START.html from the unzipped folder."
# Shown only when kit.js, beside START.html in every kit, fails to load: Windows Explorer, asked to
# open a file inside a zip, copies that one file alone into a temporary folder.
zipped_title = "Opened from inside the zip."
zipped = "This page was copied out of the zip alone, so its links cannot open. Unzip the whole kit first: on Windows, right-click the zip and choose Extract All. Then open START.html in the folder that appears."

hubs = "Course hubs"
hubs_lead = "A dataset's hub lists its newest module pages and the verdicts of the rules registered before its data were seen."
modules = "Modules"
real = "Real"
made_up = "Made-up"
none = "No page in this kit yet."
glossary = "Glossary: every term the pages explain, with its sources where it gives them."
guide = "Your own data: download a study, count it, and build these pages for it."
# M0 describes the computer that built the pages, not a dataset, so its title names none.
machine = "The computer that built the kit"

[keys]
modules = "Modules with a page"
real = "Data modules on real data"
value = "{n} of {total}"

# The kit's README.md; build_kit.py fills the placeholders from the kit it has just written.
[readme]
left_out = """## Left out: raw GDC count matrices

Raw count matrices fetched from the NCI Genomic Data Commons stay out of the kit; every table and figure computed from them is here. Each one below is named with its size and the commands that rebuild it, in order; LEFT_OUT.json lists the same. A path starting `conf/datasets/` names a dataset file in the course codebase.

{files}"""
left_out_file = """- `{path}`, {bytes} bytes:

{commands}
"""
# Under a left-out file's commands: the paths in them that are the builder's, not the reader's.
left_out_root = "`{root}` is the builder's ctx root. In these commands, put your own ctx root in its place.\n"
left_out_own = "`{path}` is the builder's own dataset file: no commit of the course codebase holds its bytes. Put your own dataset file in its place.\n"
# Under commands that begin with a `git show` line: what it writes, from where (K.14, D-075).
left_out_earlier = "`{name}` is `{path}` at commit `{commit}`, an earlier version; run in a clone of the codebase, the `git show` line writes it to the current folder.\n"
too_large = """## Left out: tables over {cap} MB

These tables feed the figure redraws of a full page's Reproduce panel, which these pages do not show. The course's own build keeps them.

{files}"""
too_large_file = "- `{path}`, {bytes} bytes"
release = "This is a release kit: every page in it comes from public data, and it holds no made-up page."
text = """# Cancer Transcriptomics course kit

Double-click `START.html`. The course home page opens in your browser, on macOS, Windows and Linux alike. Every report of the course is one click from there.

Nothing is installed, and nothing is sent anywhere.

## Open the course

Unzip the kit first. A page opened from inside the zip cannot reach the pages beside it.

Then double-click `START.html` in the unzipped folder.

## What is here

The pages, figures and tables the course generated: {files} files, {size} in all. No reads, alignments or other large inputs.

{datasets}

{edition}

Real pages come from public data. Made-up pages come from a seeded simulation; each says so, and no number on it describes a real sample.

## Checking a copy

`MANIFEST.json` lists every file with its size and SHA-256. A file whose hash differs from the manifest is not the file the course built.

With Python installed, `python check_kit.py` checks every file against the manifest, every link and every name. It needs nothing else.

On Windows without Python, `powershell -NoProfile -ExecutionPolicy Bypass -File check_kit.ps1` checks every file, the path lengths and every page in Edge, offline.

## Rerunning a module

This kit only reads. Rerunning a module needs the course codebase and its environment. The guide, Your own data on `START.html`, gives every command from a study's accessions to a kit of its own.

Built on {built} from codebase commit `{commit}`.
"""
# The edition the kit was built for (build_kit.py --edition, ctx.editions), under the datasets.
edition = "This kit is the {label} edition, `{name}`. Its modules: {modules}."
# One line per dataset folder in the README's list; {note} is build_kit's --note, or empty.
dataset = "- `{folder}/`: {names}; {kind} data. {note}"
