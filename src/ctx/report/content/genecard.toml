# M9 Gene cards page (ctx genecard). Placeholders in {braces} are filled by the code; keep their names.
# The preview on made-up data reads genecard_preview.toml instead.

title = "M9 Gene cards: {dataset}"
purpose = "Place each gene's result in this dataset beside reference data on normal tissues, immune cells, protein and [[exons]], each source named with its release."
input = "Genes from `--genes` or `--genes-from`, else the registered and top-called genes. The dataset's M5 results, [[GTEx]] V11 release files, and Human Protein Atlas and Ensembl REST responses cached under `resources/cache/`."
method = """`ctx genecard` resolves each name to an [[Ensembl gene ID]] in gather's genes table and joins every source by the unversioned number. GTEx V11 files are streamed for the listed genes only. Per tissue and donor sex the card gives n, median and IQR of [[TPM]], and each exon's median share of the gene's exon reads.

HPA and Ensembl responses are fetched once per gene and release, cached with their SHA-256. Reference panels are descriptive: n, median, IQR and tau. The dataset's own rows keep the M5 test and call rule."""
interpretation = """Check which cells express the gene before reading a change in this dataset as a change inside those cells. A high tau means few tissues or cell types express it, so a shift in cell composition can raise it in a mixed sample.

RNA is not protein: check the protein level and the antibody's reliability before calling the gene a marker. Compare each reference panel within its own release: GTEx, HPA and this dataset use different [[GENCODE]] versions.

For [[qPCR]], prefer adjacent exons with even shares across tissues, inside the [[MANE Select]] transcript. A prognostic association is not a mechanism."""
# "Term: rest" in a pitfall prints Term in bold.
pitfalls = [
    "Tissue as tumour: GTEx samples are post-mortem, non-diseased tissue; tumour expression and splicing can differ.",
    "Uneven exon coverage as splicing: degraded RNA raises the exons nearest the poly(A) tail; check junctions before calling an isoform.",
    "Collapsed exons as transcript exons: GTEx merges every transcript's exons into one model, so its exon numbers are not Ensembl's.",
]
budget = "Track B: under {minutes} min and {ram_gb} GB"
# A cell for a value a source does not give.
none = "none"

[[terms]]
term = "tau"
meaning = "Tissue specificity index of Yanai et al.: `0` when every tissue or cell type expresses the gene evenly, `1` when one alone does. Computed here on log2 of value plus one."

[[terms]]
term = "nTPM"
meaning = "HPA's normalised transcripts per million, comparable across its tissues and cell types."

[[terms]]
term = "Collapsed gene model"
meaning = "GTEx's merge of a gene's transcripts into one set of non-overlapping exons, numbered E1 onwards."

[[terms]]
term = "Exon share"
meaning = "An exon's reads over all the gene's exon reads in one sample; the card shows a tissue's median."

[[questions]]
prompt = "The gene rises in case samples and has a high tau. What must be checked before calling it induced?"
answer = "Which cell types express it. A shift in cell composition between the groups raises a cell-type-restricted gene with no change inside any cell."

[[questions]]
prompt = "Why do the GTEx and HPA panels show no p-value?"
answer = "They summarise other studies: medians per tissue, or one pooled value per cell type. A test would treat another study's summaries as samples of this one."

[[questions]]
prompt = "Why place [[qPCR]] primers in two adjacent exons with even shares?"
answer = "The product then measures the gene rather than one isoform, and the intron between the exons keeps genomic DNA from giving the same product."

