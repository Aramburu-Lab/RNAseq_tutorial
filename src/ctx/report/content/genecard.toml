# M9 Gene cards page (ctx genecard). Placeholders in {braces} are filled by the code; keep their names.
# The preview on made-up data reads genecard_preview.toml instead.

title = "M9 Gene cards: {dataset}"
purpose = "Place each gene's result in this dataset beside reference data on normal tissues, immune cells, protein and [[exons]], each source named with its release."
input = "Genes from `--genes` or `--genes-from`, else the registered and top-called genes. The dataset's M5 results, [[GTEx]] V11 release files, and Human Protein Atlas and Ensembl REST responses cached under `resources/cache/`."
method = """`ctx genecard` resolves each name to an [[Ensembl gene ID]] in gather's genes table and joins every source by the unversioned number. GTEx V11 files are streamed for the listed genes only. Per tissue and donor sex the card gives n, median and IQR of [[TPM]], and each exon's median share of the gene's exon reads.

HPA and Ensembl responses are fetched once per gene and release, cached with their SHA-256. Reference panels are descriptive: n, median, IQR and tau. The dataset's own rows keep the M5 test and call rule."""
interpretation = """Check which cells express the gene before reading a change in this dataset as a change inside those cells. A high tau means few tissues or cell types express it, so a shift in cell composition can raise it in a mixed sample.

RNA is not protein: check the protein level and the antibody's reliability before calling the gene a marker. Compare each reference panel within its own release: GTEx, HPA and this dataset use different [[GENCODE]] versions.

For [[qPCR]], prefer adjacent exons with even shares across tissues, inside the [[MANE Select]] transcript. A prognostic association is not a mechanism."""
# "Term: rest" in a pitfall prints Term in bold.
pitfalls = [
    "Tissue as tumour: GTEx samples are post-mortem, non-diseased tissue; tumour expression and splicing can differ.",
    "Uneven exon coverage as splicing: degraded RNA raises the exons nearest the poly(A) tail; check junctions before calling an isoform.",
    "Collapsed exons as transcript exons: GTEx merges every transcript's exons into one model, so its exon numbers are not Ensembl's.",
]
budget = "Track B: under {minutes} min and {ram_gb} GB"
# A cell for a value a source does not give.
none = "none"

[[terms]]
term = "tau"
meaning = "Tissue specificity index of Yanai et al.: `0` when every tissue or cell type expresses the gene evenly, `1` when one alone does. Computed here on log2 of value plus one."

[[terms]]
term = "nTPM"
meaning = "HPA's normalised transcripts per million, comparable across its tissues and cell types."

[[terms]]
term = "Collapsed gene model"
meaning = "GTEx's merge of a gene's transcripts into one set of non-overlapping exons, numbered E1 onwards."

[[terms]]
term = "Exon share"
meaning = "An exon's reads over all the gene's exon reads in one sample; the card shows a tissue's median."

[[questions]]
prompt = "The gene rises in case samples and has a high tau. What must be checked before calling it induced?"
answer = "Which cell types express it. A shift in cell composition between the groups raises a cell-type-restricted gene with no change inside any cell."

[[questions]]
prompt = "Why do the GTEx and HPA panels show no p-value?"
answer = "They summarise other studies: medians per tissue, or one pooled value per cell type. A test would treat another study's summaries as samples of this one."

[[questions]]
prompt = "Why place [[qPCR]] primers in two adjacent exons with even shares?"
answer = "The product then measures the gene rather than one isoform, and the intron between the exons keeps genomic DNA from giving the same product."

[keys]
genes = "Gene cards"
genes_listed = "of {listed:,} listed; the rest are named below"
samples = "GTEx samples"
tissues = "GTEx tissues"
hpa = "HPA release"

# The card list's genes past the page cap (M9.8).
[left_out]
title = "Cards this page could not hold"
lead = "{n:,} of the {listed:,} listed genes have no card here: their cards would take the page past its {cap:g} MB cap."
genes = "Left out, in list order: {genes}."
command = "Build their cards on a page of their own"

[reasons]
named = "named in this run"
registered = "registered in the dataset file"
up = "a top up call of {contrast}"
down = "a top down call of {contrast}"

[gene]
title = "{symbol}, {gene}"
lead = "On this page as {reason}. Our ID {gene_id}; GTEx {gtex_id}."
unavailable = "{source} unavailable for {symbol}: {why}."
renamed = "{typed} is not in this dataset's gene table: HPA {release} lists it as a symbol or synonym of {gene}, here named {symbol}."
sources = { gtex = "GTEx", hpa = "Human Protein Atlas", ensembl = "Ensembl REST", lines = "HPA cell lines", junctions = "GTEx V10 junctions" }

[evidence]
title = "{symbol} in every M5 contrast of this dataset"
columns = ["Contrast", "log2 FC", "Shrunk log2 FC", "padj", "Call"]
untested = "not tested"

[structure]
title = "{symbol}: MANE Select transcript"
columns = ["Source", "Transcript", "RefSeq", "Exons", "Strand"]
gtf = "GENCODE GTF of the dataset file"
rest = "Ensembl REST, release {release}"
agree = "The GTF and Ensembl REST name the same MANE Select exons, base for base."
differ = "The GTF and Ensembl REST differ on the MANE Select transcript or its exons: check both before designing primers."
primers = "Primer design: paste {refseq} into NCBI Primer-BLAST, {url}."

[facts]
title = "{symbol} in the Human Protein Atlas {release}"
columns = ["Item", "HPA", "Note"]
tau = "tau, consensus tissues"
tau_note = "ours, on {n} consensus tissues; HPA prints its own category"
single = "Top single cell types"
ihc = "Protein in tissues, IHC"
ihc_value = "detected in {detected} of {tissues} tissues"
reliability = "Antibody reliability, IHC"
locations = "Subcellular location"
blood_im = "Blood, immunoassay"
blood_ms = "Blood, mass spectrometry"
concentration = "{ug} µg/L"
consensus = "Highest consensus tissue"
consensus_value = "{tissue}, {ntpm:.1f} nTPM"
interactions = "Interactions"
interactions_note = "count only; partners on the HPA page"
page = "HPA page"
lines = "Cell lines, HPA {group}"
line = "{line} {ntpm:.1f} nTPM"
line_absent = "{line} not in the group"
lines_note = "{n} lines in the group, median {median:.1f} nTPM; Jin et al., Nat Commun 2023"
categories = { "RNA tissue specificity" = "Tissue specificity", "RNA tissue distribution" = "Tissue distribution", "RNA single cell type specificity" = "Single cell specificity", "RNA blood cell specificity" = "Immune cell specificity", "Secretome location" = "Secretome", "Reliability (IH)" = "Reliability, IHC", "Reliability (IF)" = "Reliability, IF" }

[figures.tissues]
title = "{symbol} across normal tissues, GTEx {release}"
lead = "Highest median in {top}, {top_median:.1f} TPM; lowest in {bottom}, {bottom_median:.3g} TPM; tau {tau} over {tissues} tissues."
reading = [
    "A bar is one sex's median in one tissue; its colour is the donors' sex.",
    "Tissues run from the highest all-donor median down; hover gives n and the quartiles.",
]
x = "Tissue"
y = "Median expression"
caption = "GTEx {release} per-sample TPM summarised per tissue and sex: {samples} samples in {tissues} tissues, {least} to {most} each. Median and IQR only; external data, no test."

[figures.tissues.columns]
tissue = ["none", "GTEx tissue, the SMTSD field."]
sex = ["none", "Donor sex from the GTEx subject table: female or male."]
value = ["log2(TPM + 1)", "log2 of the sex's median TPM plus one."]
n = ["samples", "Samples of this tissue and sex."]
median = ["TPM", "Median TPM of this tissue and sex."]
q1 = ["TPM", "First quartile of TPM, numpy's linear rule."]
q3 = ["TPM", "Third quartile of TPM, numpy's linear rule."]

[figures.immune]
title = "{symbol} across immune cell types, HPA {release}"
lead = "Highest in {top}, {top_ntpm:.1f} nTPM; tau {tau} across {cells} cell types."
reading = [
    "A bar is one cell type's nTPM; its colour is the cell lineage.",
    "tau near `1`: few cell types express the gene; near `0`: all do, evenly.",
]
x = "Cell type"
y = "nTPM"
caption = "HPA {release} immune cell RNA: {cells} cell types, one value each; the pooled PBMC total is left out. tau {tau}, computed on log2 of nTPM plus one. External data, no test."

[figures.immune.columns]
cell_type = ["none", "HPA immune cell type."]
lineage = ["none", "HPA lineage of the cell type."]
ntpm = ["nTPM", "HPA normalised transcripts per million of the cell type."]

[figures.exons]
title = "Exon use of {symbol} across tissues, GTEx {release}"
lead = "Most even adjacent pair: {first} and {second}, larger CV {pair_cv:.2f}; least even exon {uneven}, CV {uneven_cv:.2f}."
lead_none = "No adjacent exon pair has reads in every tissue, so none is proposed for qPCR."
reading = [
    "A cell is one exon in one tissue: log2 of its median share over the exon's median across tissues.",
    "Right of each row: the exon's CV of share across tissues; low CV suits qPCR. A blank cell has no reads.",
    "Too many tissues to name on the axis: hover a cell, or read the tissue column of the data file.",
]
x = "Tissue"
y = "Exon"
stat = "CV"
caption = "GTEx {release} exon read counts on the collapsed gene model: {exons} exons by {tissues} tissues; {dropped} left out. CV: SD over mean. External data, no test."
dropped_one = "{n:,} sample without exon reads"
dropped_many = "{n:,} samples without exon reads"

[figures.exons.columns]
exon = ["none", "Exon of the GTEx collapsed gene model, as GTEx numbers it."]
tissue = ["none", "GTEx tissue."]
n = ["samples", "Samples of the tissue with reads on the gene."]
share = ["fraction", "Median over samples of the exon's share of the gene's exon reads."]
log2_ratio = ["log2", "log2 of the share over the exon's median share across tissues; empty without reads."]
level = ["none", "The step of the diverging scale the cell is drawn in."]

[figures.junctions]
title = "Splice junctions of {symbol} across tissues, GTEx {release}"
lead = "{matched} of {introns} MANE Select introns match a GTEx {release} junction base for base; {junctions} junctions in all."
reading = [
    "A cell is one junction in one tissue: log2 of its median reads over the junction's median across tissues.",
    "Junctions J1 onwards run in genomic order; hover gives coordinates. MANE marks an intron of the MANE Select transcript.",
    "Right of each row: the junction's median reads across tissues.",
    "GTEx V10 on GENCODE v39, not V11: the exon panel above is V11's.",
]
x = "Tissue"
y = "Junction"
stat = "Median reads"
mane = "MANE"
caption = "GTEx {release} median junction read counts from API v2, {gencode_id}: {junctions} junctions by {tissues} tissues. Exons from the dataset's MANE Select model. External data, no test."

[figures.junctions.columns]
junction = ["none", "GTEx junction ID: chromosome, first and last intron base."]
tissue = ["none", "GTEx tissue ID."]
median = ["reads", "GTEx V10 median junction read count of the tissue."]
mane = ["none", "True where the junction is an intron of the MANE Select transcript, base for base."]
log2_ratio = ["log2", "log2 of the tissue's median over the junction's median across tissues; empty at zero."]
level = ["none", "The step of the diverging scale the cell is drawn in."]

[tables]
junctions = "GTEx V10 median junction reads of every listed gene, per tissue."
evidence = "Every listed gene's M5 row in every contrast."
tissues = "GTEx tissue summaries of every listed gene, by sex."
exons = "GTEx exon shares of every listed gene, per tissue."
immune = "HPA immune cell nTPM of every listed gene."
consensus = "HPA consensus tissue nTPM of every listed gene."
lines = "HPA cell-line nTPM of every listed gene, every line of the dataset file's group."

[tables.columns]
symbol = ["none", "Gene symbol in gather's genes table."]
gene_id = ["none", "Ensembl gene ID with our GENCODE version."]
contrast = ["none", "M5 contrast."]
log2FoldChange = ["log2", "Raw log2 fold change, M5."]
log2FoldChange_shrunk = ["log2", "Shrunken log2 fold change, M5."]
padj = ["none", "BH-adjusted p, M5; empty where M5 did not test the gene."]
call = ["none", "M5 call under D-012: up, down or ns."]
tissue = ["none", "Tissue, as the source names it."]
ntpm = ["nTPM", "HPA normalised transcripts per million."]

[tables.tissues_columns]
sex = ["none", "Donors summarised: all, female or male."]

[tables.exons_columns]

[tables.immune_columns]

[tables.consensus_columns]

[tables.junctions_columns]
junction = ["none", "GTEx junction ID: chromosome, first and last intron base."]
chrom = ["none", "Chromosome."]
