[notes]
tcga = "The miRNA half, with its targets, comes with the TCGA pages: Step-1 has no small-RNA-seq library."
mirna = "miRNA genes hold at most {pct:.4f} % of a library's counted reads. These are hairpin loci counted from long fragments, never mature miRNA quantities."
