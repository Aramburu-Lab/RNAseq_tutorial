[figures.libraries]
title = "One tumour, two libraries: replication-dependent histone mRNA"
lead = "In {higher} of {n} tumours the rRNA-depleted library holds the larger histone share: median {rrna:.3f} % against {other_median:.3f} %."
reading = [
    "Each point is one tumour sequenced twice: its {other} library across, its rRNA-depleted library up.",
    "Points above the dashed line hold more histone mRNA after rRNA depletion, which keeps transcripts without a poly-A tail.",
    "This figure compares the two files of one sample, so it reads files the one-per-patient rule leaves out.",
]
caption = "{n} tumours with an rRNA-depleted and a {other} library, from GDC read groups. Shares of counted reads on [[replication-dependent histone mRNA|histone genes]]; Wilcoxon signed-rank: rRNA-depleted higher in {higher} of {n}, p = {p:.2g}."
x = "Histone mRNA, {other} library"
y = "Histone mRNA, rRNA-depleted library"
