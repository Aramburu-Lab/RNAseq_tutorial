note = "The caption counts every sample."
reading = [
    "Each bar is one sample, by cell type, then condition; each band is one biotype's share of its counted reads.",
    "small_RNA pools miRNA, snRNA, snoRNA, nuclear rRNA and misc_RNA genes; pseudogene pools every pseudogene type.",
    "Hover a bar for the sample's cell type and condition.",
    "Choose one biotype in the filter to show its share of each sample alone.",
]
caption = "{n_samples} samples, {n_genes:,} genes of {gtf}. Shares of counted reads by GENCODE [[biotype]]; descriptive, no test."
x = "Sample"
y = "Counted reads"

[figures.filter]
title = "Expression by biotype, against the filter"
lead = "At {min_count} reads, the filter keeps {protein_coding:.0f} % of protein-coding genes and {lncrna:.0f} % of lncRNAs."
reading = [
    "Each line is one biotype: the share of its genes at or below each value.",
    "The value is the count, at the median library size, that at least {k} of the contrast's samples reach; the filter tests it.",
    "The dashed line is the filter's cutoff; a gene left of it is not tested.",
]
caption = "{n_ref} {reference} and {n_test} {tested} samples of {cell_type}; cutoff {min_count} reads. Mann-Whitney, {n_lncrna:,} lncRNAs against {n_coding:,} protein-coding genes: p = {p:.2g}, rank-biserial r = {r:.2f}."
x = "Reads at the median library size"
y = "Share of genes"
cutoff = "filter cutoff"
# M8 F2's control: the filter's minimum count, presets of the plan (1 to 50).
view = "Minimum count"
preset = "{min_count} reads"
preset_one = "{min_count} read"

[figures.volcano]
title = "{tested} against {reference} in {cell_type}, by biotype"
lead = "{called_protein_coding:,} protein-coding genes and {called_lncrna:,} lncRNAs pass the call rule."
reading = [
    "Each dot is one tested gene: fold change across, significance up.",
    "Colour marks the biotype of a gene with BH-adjusted p below {alpha:g} within its biotype and |log2 FC| at least {lfc_min:g}; grey marks the rest.",
    "The dashed lines mark the fold-change threshold.",
]
caption = "{n_ref} {reference} and {n_test} {tested} samples; {n_tested:,} genes M5 tested. DESeq2 Wald test from M5, no new fit; [[BH]] within each biotype: {strata}."
x = "log2 fold change, {tested} over {reference}"
y = "Significance"
ns = "not called"
threshold = "fold-change threshold"
table_title = "Calls by biotype: pooled BH and BH within each"
columns = ["Biotype", "Tested", "Called, pooled BH", "Called, BH within", "Up", "Down"]
stratum = "{biotype} {n:,}"

[figures.neighbour]
title = "lncRNAs against their nearest protein-coding genes"
lead = "{lncrna} and {neighbour}, {kind}: rho {rho} across samples, {rho_within} on residuals, q {q_within}."
reading = [
    "Each point is one sample: the lncRNA across, its neighbour up.",
    "Colour marks the condition.",
    "The select offers the {pairs} pairs with the smallest q on residuals; the first is drawn.",
]
caption = "{n_samples} samples of {contrast}; {n_pairs:,} pairs of tested genes. [[Spearman]] rho on log2 CPM and on residuals from each condition's mean; BH over the pairs. Background: {n_background:,} pairs across chromosomes."
x = "lncRNA"
y = "Nearest protein-coding gene"
option = "{lncrna} and {neighbour}"
summary = "{lncrna} and {neighbour}: {kind}, {gap} nt apart; q {q} on values, {q_within} on residuals."
table_title = "Pairs by kind: share with BH q below {alpha:g}"
columns = ["Pair kind", "Pairs", "Median rho, residuals", "Called on values", "Called on residuals"]
none = "none"

[sanity]
lead = "Rules registered {registered} in the dataset file, before this module first ran on it."
columns = ["Rule", "What it checks", "Condition", "Value", "Verdict", "Source"]

# The preview's target figure (scripts/python/preview_ncrna.py); the built page draws
# [figures.shift].
[figures.targets]
title = "Fold changes of {mirna} targets against non-targets"
lead = "Median log2 fold change minus that of non-targets: {shift_validated:+.2f} for validated targets, {shift_predicted:+.2f} for predicted-only ones."
reading = [
    "Each line is one target class: the share of its genes at or below each fold change.",
    "A line left of the non-targets' line marks lower fold changes, as repression by a rising miRNA predicts.",
]
caption = "Made-up data: {n_validated} validated, {n_predicted} predicted-only targets, {n_non:,} non-targets. KS against non-targets, BH over both tests: validated D = {d_validated:.2f}, p = {p_validated:.2g}; predicted D = {d_predicted:.2f}, p = {p_predicted:.2g}."
x = "log2 fold change, {tested} over {reference}"
y = "Share of genes"
classes = ["validated", "predicted only", "non-target"]

# The TCGA half: a GDC dataset's page replaces Input and Method with these.
[tcga]
input = "From `ctx gather` on a GDC project: the STAR counts and the mature counts of the small-RNA libraries; M5's tumour-normal results; the counts' GENCODE release; the target files of `ctx setup`."
method = """Mature miRNA counts come from the small-RNA libraries alone, summed over every hairpin of a mature miRNA. M5's paired fit tests them, tumour against normal.

A target is validated in miRTarBase's strong evidence or predicted by TargetScan, never both at once. Each class's mRNA fold changes are compared with non-targets'. A miRNA and its target are correlated across tumours, normals apart."""
no_pairs = "no tumour in the project has both an rRNA-depleted library and another one among the files the comparison may read, so there is no pair to compare"
no_read_groups = "this project's GDC folder holds no read-group record, so no file's library selection is known"
agreement = "Per sample, the STAR counts of {hairpins:,} miRNA genes rank their hairpins unlike the small-RNA library: median Spearman rho {rho:.3f} over {n:,} samples."

[figures.mirna_volcano]
title = "Mature miRNAs, {tested} against {reference}"
lead = "Of {n_tested:,} mature miRNAs tested, {up:,} rise and {down:,} fall."
table_title = "Featured miRNAs"
columns = ["miRNA", "MIMAT", "Mean count", "log2 FC", "BH-adjusted p", "Call"]
untested = "not tested"
unit = "mature miRNAs"

[figures.shift]
title = "Fold changes of {mirna} targets against non-targets"
lead = "Median log2 fold change minus that of non-targets: {shift_validated} for validated targets, {shift_predicted} for predicted-only ones."
reading = [
    "Each line is one target class: the share of its genes at or below each fold change.",
    "A line left of the non-targets' line marks lower fold changes, as repression by a rising miRNA predicts.",
    "Predicted-only targets reach the default context++ cutoff of {preset:g}; non-targets hold no predicted site.",
]
caption = "{n_validated:,} validated, {n_predicted:,} predicted-only, at a [[context++ score]] of at most {preset:g}, and {n_non:,} non-target genes M5 tested. KS test against non-targets, BH over {n_tests} tests: validated D = {d_validated}, q = {q_validated}; predicted-only D = {d_predicted}, q = {q_predicted}."
x = "log2 fold change, {tested} over {reference}"
y = "Share of genes"
table_title = "Target classes against non-targets, every featured miRNA and cutoff"
columns = ["miRNA", "Targets", "context++ at most", "Genes", "Median shift", "KS D", "KS q", "Mann-Whitney q"]
any = "any"
enrich_title = "Targets among the genes called against the miRNA's change"
enrich_columns = ["miRNA", "Targets", "Called genes", "Set", "Hits", "Expected", "p", "BH q"]

[figures.mirna_pairs]
title = "miRNAs against their targets, across tumours"
lead = "{mirna} and {gene}, {source}: rho {rho} across tumours, {rho_normal} across normals."
reading = [
    "Each point is one tumour: the miRNA across, its target up, both from one sample.",
    "The select offers the {pairs} pairs with the smallest q across tumours.",
    "Repression predicts a negative rho; a shared response to hypoxia or growth can give either sign.",
]
caption = "{n_tumour} tumours and {n_normal} normals with a small-RNA and an mRNA library of one sample. [[Spearman]] rho of log2 [[RPM of miRNA-mapped reads]] against log2 CPM, each condition apart; BH over {n_pairs:,} pairs within each."
x = "miRNA, log2 RPM of miRNA-mapped reads"
y = "Target, log2 CPM"
option = "{mirna} and {gene}, {source}"
label = "miRNA and target"
summary = "{mirna} and {gene}, {source}: q {q_tumour} across tumours, rho {rho_normal} across normals."
table_title = "Pairs by miRNA and source: share with BH q below {alpha:g} across tumours"
columns = ["miRNA", "Source", "Pairs", "Median rho, tumours", "Called, tumours", "Median rho, normals"]
