# The M2 QC page (ctx qc). Placeholders in {braces} are filled by the code; keep their names.

title = "M2 Quality control: {dataset}"
budget = "Track A: under {minutes} min and {ram_gb} GB"
purpose = "Flag samples and runs unlike their stratum on each QC metric, and test whether a metric or flag differs between a contrast's groups."
input = "{samples} samples in {runs} runs from the `ctx gather` sample sheet, its counts where gather wrote them, and the registry `{registry}`. With `--rnaseq-dir`, the nf-core/rnaseq reports; with `--reads`, the [[FASTQ]] files."
method = "No universal cut-off exists for most metrics, so a sample is flagged beyond its stratum's median ± {k} scaled [[MAD|MADs]], on the bad side. Where the registry cites a cut-off, the value also gets an [[QC bands|absolute band]]: good, usable or bad. [[Mann-Whitney]] U tests each metric, and [[Fisher's exact test]] each flag, between the groups of every unpaired contrast, with [[BH]] adjustment."
interpretation = "{flagged} of {runs} runs are flagged, {excluded} of them excluded by a registry action; {confounded} of {tests} confounding tests have a [[padj|BH-adjusted p]] below {alpha}. Do not set a sample aside on a metric that differs between the groups of a contrast: that removes part of the difference under test. A flag that tracks [[read length]] describes the [[batch]], not the sample."
# "Term: rest" in a pitfall prints Term in bold.
pitfalls = [
    "Excluding on a flag alone: a flag marks a difference from the stratum, not an error.",
    "Borrowing a cut-off from another dataset: depth, cell type and library protocol each change these metrics.",
    "Reading no flag as a pass: under {minimum} samples, a stratum gets no [[MAD]] band.",
]

[[terms]]
term = "Stratum"
meaning = "The samples sharing their values of the --strata columns, such as a cell type. Each MAD band is computed within one."

[[terms]]
term = "MAD"
meaning = "Median absolute deviation, scaled to equal the standard deviation of normal data. One outlier barely changes it."

[[terms]]
term = "Peer group"
meaning = "The samples sharing their values of the --peers columns, such as cell type and condition. Agreement and PCA distance are measured within it."

[[terms]]
term = "Confounding"
meaning = "A metric that differs between the groups of a contrast, so its effect cannot be separated from the contrast's."

[[terms]]
term = "Useful fragment"
meaning = "A fragment Salmon assigned to a transcript."

[[terms]]
term = "Too short"
meaning = "A read left shorter than the length floor after trimming. Trim Galore trims poor bases and drops no read for quality alone, so a poor read is counted as too short."

[[terms]]
term = "Decoy"
meaning = "A fragment whose best match is the genome outside the transcripts. Salmon sets it aside; it is not contamination."

[[terms]]
term = "Highest-density region"
meaning = "The smallest area holding a given share of a group's samples, on a smoothed histogram."

[[questions]]
prompt = "A flagged sample has half its stratum's median [[library size]]. What do you check before excluding it?"
answer = "Whether library size differs between the groups of its contrasts, and whether its other metrics agree with its peers. DESeq2's [[size factors]] scale for depth: a smaller library is noisier, not wrong."

[[questions]]
prompt = "Why is a band computed per stratum and not per condition?"
answer = "Per condition, a condition that shifts a metric never shows as flags. Per stratum, the shift shows as flags gathered in one condition, which the confounding tests detect."

# Why a sample is flagged: one of these per metric it fails, joined by "; ".
[reasons]
low = "{title} {value} is below {bound}, {k} MAD under the median of the {n} samples of {stratum}"
high = "{title} {value} is above {bound}, {k} MAD over the median of the {n} samples of {stratum}"
band = "{title} {value} is in the bad band ({source})"
category = "{title}: {value}"
strand = "{title}: {call}, where {stratum} is mostly {usual}"

# Why a band or a test is missing.
[notes]
small_stratum = "no band: {n} samples, fewer than the {minimum} a band needs"
no_spread = "no band: the MAD is 0, so every value but the median would be an outlier"
no_values = "no test: a group has no value"
constant = "no test: every sample has the same value"
no_flags = "no test: no sample is flagged"
all_flagged = "no test: every sample is flagged"
paired = "not tested: paired, so its groups share individuals, which Mann-Whitney and Fisher's test assume they do not"
no_annotation = "Composition shares not measured: the dataset file names no {resource} resource, so no gene has a type."
not_fetched = "Composition shares not measured: the annotation is not at {path}; run ctx setup with this dataset file."
no_counts = "Counts not judged: gather wrote no counts for this dataset (it needs --rnaseq-dir). The reads and the pipeline's reports are judged alone."
skipped = "{n} runs left unread, their FASTQ not verified or not downloaded (the skipped table lists why): {runs}."
no_sequence_content = "{title}: FastQC's verdict is judged, and no figure is drawn. MultiQC writes no table of it, and only MultiQC reads FastQC's reports."
flat_grid = "The fastp grid on {run} is flat: every setting keeps {pct:.1f} % of its reads, so there is nothing to map."
flat_floor = "The fastp grid on {run} is flat: {kept} settings each keep {pct:.1f} % of its reads, and the other {none} keep none. There is nothing to map."

[tests]
fisher = "Fisher's exact test, two-sided"

[effects]
r = "rank-biserial r, tested over reference"
odds = "odds ratio, tested over reference; 0.5 added to every cell when one is 0"

[columns]
sample = "Sample, as nf-core/rnaseq names it."
run_accession = "Run accession."

[keys]
samples = "Samples judged"
flagged = "Runs flagged"
flagged_detail = "of {runs:,}; {excluded:,} excluded"
metrics = "Metrics judged"
confounded = "Confounded tests"
