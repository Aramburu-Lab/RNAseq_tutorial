# The M3 Trim, align, count page (ctx process). Placeholders in {braces} are filled by the
# code; keep their names. scripts/python/preview_process.py draws the same page on made-up data
# for the course preview, from these keys and [preview].

title = "M3 Trim, align, count: {dataset}"
budget = "Track A: under {minutes} min and {ram_gb} GB"
purpose = "Align each sample's trimmed reads, count reads per gene, and measure how [[strandedness]], [[multimappers]], overlapping genes and an incomplete [[reference]] change those counts."
input = "{samples} samples in {runs} runs, named by the `ctx gather` sheet and read from their [[FASTQ]] files. The genome `{genome}` holds {length} bases on {genome_name}; the dataset file's [[annotation|GTF]] is {release}."
method = """[[fastp]] trims each run with M2's settings. {aligner}, a splice-aware [[aligner]], places each read on {genome_name}; a read fitting several loci equally well is a [[multimappers|multimapper]].

[[featureCounts]] assigns reads to genes at `-s 0` (either strand), `-s 1` (the gene's strand) and `-s 2` (the opposite one). The strand call is the forward share: reads at `-s 1` over reads at `-s 1` plus `-s 2`.

Two counters can correlate closely and still disagree. [[Spearman|Spearman's ρ]] measures whether counts rise together; Bland and Altman's bias and limits measure how far apart they are."""
interpretation = """[[uniquely mapped reads|Uniquely mapped reads]] range from {low} % to {high} % of input reads. {reference_note}

Where [[Salmon]]'s share is given, compare it with the share assigned here. On a partial [[reference_genome|reference]] the share assigned here can exceed it: reads from missing contigs align to similar genes.

Take the [[library]]'s strand from the forward share, never from the largest bar, and count at that setting.

A correlation near one beside a nonzero bias means one counter adds reads to some genes only. The discordant genes of each comparison name them: overlapping genes for `-O`, gene families for `-M`."""
pitfalls = [
    "Choosing `-s` from the kit name: protocols differ between kit versions; measure the forward share on the reads.",
    "Judging a partial-genome [[mapping rate]] by a genome band: reads from missing chromosomes cannot align there.",
    "Reading a high [[Spearman|ρ]] as agreement: two counters can rank genes alike and still differ in their counts.",
]

# tools/README.md, the one file in the tool-native folder (D-037).
tools_readme = """# tools/: the tools' own outputs, under their own names

Written by `ctx process`; never edit these folders by hand. Each folder is content-keyed:
`<step>_<first 12 characters of the SHA-256 of its inputs>`, built into `.part` and renamed only
when its build returned. `ctx_manifest.json` lists the inputs and every file's size; a folder is
reused only when its key and every size match. A changed option builds a new folder beside the
old one; a damaged folder or a leftover `.part` is renamed `.stale<N>`, never reused or deleted.

- `index/`: the reference (genome copy, annotation lines on its contigs) and each aligner's index.
- `<dataset>/`: per dataset, the trimmed runs (`trim_*`), the alignments (`align_*`) and the
  featureCounts settings (`count_*`).

Deleting a folder is the reader's call; the next run rebuilds what it needs."""

undefined = "not defined"
log_unit = "log2(count + 1)"
no_release = "of a release the file does not state"
genome_contigs = "{n} contigs"
built = "built"
reused = "reused"

# The Interpretation's word on the reference: partial when the genome lacks a contig the
# annotation names, so genome-wide mapping bands do not apply. No glossary mark here: the
# lint allows marks only in a section's own text.
[reference_note]
partial = "On {genome_name}, reads from genes elsewhere stay unmapped or align to similar sequence, so no genome-wide band applies: compare samples with each other."
whole = "The genome holds every contig the annotation names, so the mapping rate can be read against genome-wide bands."

[[terms]]
term = "Uniquely mapped"
meaning = "A read aligned to one locus only. featureCounts counts only these unless `-M` is set."

[[terms]]
term = "Multimapper"
meaning = "A read aligned equally well to several loci. Each aligner reports such a read only up to its own limit of loci."

[[terms]]
term = "Forward share"
meaning = "Reads assigned at `-s 1` over reads at `-s 1` plus `-s 2`. Near `0`: reverse; near `1`: forward; near `0.5`: unstranded."

[[terms]]
term = "Bias and limits of agreement"
meaning = "Bland-Altman's mean difference between two measurements, and that mean plus or minus `1.96` standard deviations of the differences."

[[terms]]
term = "Featured sample"
meaning = "The sample aligned again under each setting, so one setting changes at a time."

[[questions]]
prompt = "Aligned to half the genome, the featured sample keeps fewer [[uniquely mapped reads]]. Where did the rest go?"
answer = "Reads from genes on the removed half have no true locus. Most end unmapped; some align to similar genes on the kept half and are counted there."

[[questions]]
prompt = "[[featureCounts]] assigns nearly equal reads at `-s 1` and `-s 2`. Which [[library type]] is this, and which `-s` counts it?"
answer = "Unstranded: count at `-s 0`. At `-s 1` or `-s 2` about half of each gene's reads would be dropped."

[[questions]]
prompt = "[[Spearman|Spearman's ρ]] between plain and `-M` counts is near `1`. Are the two counts interchangeable?"
answer = "No. ρ compares ranks, and `-M` adds reads mostly to genes that share sequence with others. The agreement plot shows that bias; ρ does not."

