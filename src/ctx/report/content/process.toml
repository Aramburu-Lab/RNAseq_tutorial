# The M3 Trim, align, count page (ctx process). Placeholders in {braces} are filled by the
# code; keep their names. Until the module is built, scripts/python/preview_process.py draws
# this page on made-up data.

title = "M3 Trim, align, count: {dataset}"
budget = "Preview build on made-up data; no read was aligned. The real run's budget is Track A: under {minutes} min and {ram_gb} GB."
profile = "preview build, one process"
purpose = "Align each sample's trimmed reads, count reads per gene, and check the settings that change those counts: [[strandedness]], [[multimappers]] and the [[reference]]."
input = "The sample sheet from `ctx gather`, each run's [[FASTQ]] files under `--fetchngs-dir`, a genome FASTA (`--genome`) and the dataset file's [[GTF|annotation GTF]]. Optional: `--compare-dataset`, a dataset with [[Salmon]] counts for the same samples."
method = """[[fastp]] trims each run with the same settings as M2. A splice-aware [[aligner]] places reads across introns: [[STAR]] on Linux, [[HISAT2]] on Apple silicon. A read fitting several loci equally well is a [[multimappers|multimapper]].

[[featureCounts]] assigns reads to genes at `-s 0` (either strand), `-s 1` (the gene's strand) and `-s 2` (the opposite). The strand call uses the forward share, `-s 1` reads over `-s 1` plus `-s 2` reads.

Two counters can correlate closely and still disagree. Correlation measures whether counts rise together; the Bland-Altman bias and limits measure how far apart they are."""
interpretation = """Read the mapping bars first; check M2's metrics for any sample whose [[uniquely mapped reads|uniquely mapped]] share sits well below the rest. The featured sample's bars change one setting each. On half the genome, reads from the missing genes go unmapped or align to similar genes, so no genome-wide band applies.

Take the library's strand from the forward share, never from the largest bar, and count at that setting.

Two counters that correlate closely can still disagree. Read the bias and limits in the agreement plot. Genes far from zero gain reads under one rule; those genes show whether the choice of counter matters."""
pitfalls = [
    "Choosing `-s` from the kit name: protocols differ between kit versions; measure the forward share on the reads.",
    "Judging a partial-genome [[mapping rate]] by a genome band: reads from missing chromosomes cannot align there.",
    "Reading a high ρ as agreement: two counters can rank genes alike and still differ in their counts.",
]

[[terms]]
term = "Uniquely mapped"
meaning = "A read aligned to one locus only. featureCounts counts only these unless `-M` is set."

[[terms]]
term = "Multimapper"
meaning = "A read aligned equally well to several loci. STAR keeps it while the loci number at most `--outFilterMultimapNmax`."

[[terms]]
term = "Forward share"
meaning = "Reads assigned at `-s 1` over reads at `-s 1` plus `-s 2`. Near `0`: reverse; near `1`: forward; near `0.5`: unstranded."

[[terms]]
term = "Bias and limits of agreement"
meaning = "Bland-Altman's mean difference between two measurements, and that mean plus or minus `1.96` standard deviations of the differences."

[[terms]]
term = "Featured sample"
meaning = "The sample aligned again under each setting, so one setting changes at a time."

[[questions]]
prompt = "Aligned to half the genome, the featured sample keeps fewer [[uniquely mapped reads]]. Where did the rest go?"
answer = "Reads from genes on the removed half have no true locus. Most end unmapped as too short; some align to similar genes on the kept half and are counted there."

[[questions]]
prompt = "[[featureCounts]] assigns nearly equal reads at `-s 1` and `-s 2`. Which [[library type]] is this, and which `-s` counts it?"
answer = "Unstranded: count at `-s 0`. At `-s 1` or `-s 2` about half of each gene's reads would be dropped."

[[questions]]
prompt = "Spearman's ρ between plain and `-M` counts is near `1`. Are the two counts interchangeable?"
answer = "No. ρ compares ranks, and `-M` adds reads mostly to genes that share sequence with others. The agreement plot shows that bias; ρ does not."

# The options ctx process will take (the M3 plan, section 5), until the CLI exists to read
# them from. A fastp option without a default takes it from ctx.qc.Fastp, as M2 does.
[planned."--dataset"]
default = "required"
meaning = "Short name of the dataset; every output name starts with it."
effect = "Selects the gather sheet and the FASTQ files this command reads."

[planned."--dataset-file"]
default = "required"
meaning = "The dataset's TOML file; its `annotation_gtf` resource is the annotation."
effect = "Another annotation changes which genes exist and every count."

[planned."--genome"]
default = "required"
meaning = "Genome FASTA, plain or gzipped; its contig names select the GTF lines."
effect = "A partial genome lowers the mapping rate; genome bands stop applying."

[planned."--aligner"]
default = "star"
meaning = "`star` or `hisat2`; use HISAT2 on Apple silicon, where pinned STAR fails."
effect = "HISAT2 adds an unspliced alignment and drops the STAR comparison."

[planned."--strandedness"]
default = "auto"
meaning = "`auto`, `unstranded`, `forward` or `reverse`: which featureCounts `-s` table is used."
effect = "All three settings are always counted; this picks the one used."

[planned."--multimap-max"]
default = "unset"
meaning = "Most loci a multimapped read may fit; unset keeps STAR's `10`."
effect = "Lower turns more multimappers into unmapped too-many-loci reads."

[planned."--settings"]
default = "cut"
meaning = "Extra featured-sample alignments: `cut` (half the genome), `untrimmed` (no fastp)."
effect = "Each token adds one alignment and one bar to the settings figure."

[planned."--featured-sample"]
default = "unset"
meaning = "The sample aligned again at each setting. Unset: the sheet's first sample."
effect = "Pick a sample you suspect to see how settings change it."

[planned."--reads-per-run"]
default = "unset"
meaning = "Reads kept per run by `seqkit sample`, seed `42`. Unset: every read."
effect = "Fewer reads run faster; rates stay close, gene counts grow noisier."

[planned."--compare-dataset"]
default = "unset"
meaning = "A dataset slug with Salmon counts for the same samples."
effect = "Adds each run's expected share of reads on a partial genome."

[planned."--fetchngs-dir"]
default = "unset"
meaning = "The fetchngs outdir the sheet's FASTQ paths are relative to."
effect = "Reads FASTQ files from another download; nothing is written there."

[planned."--registry"]
default = "unset"
meaning = "The QC registry; its strandedness thresholds decide the strand call."
effect = "Other thresholds can turn a reverse call into undetermined."

[planned."--fastp-q"]
meaning = "fastp `-q`: a base below this Phred quality is unqualified."
effect = "Higher marks more bases unqualified, so more reads fail `-u`."

[planned."--fastp-u"]
meaning = "fastp `-u`: most unqualified bases a read may have, in percent."
effect = "Lower drops more reads before alignment."

[planned."--fastp-l"]
meaning = "fastp `-l`: shortest read kept after trimming, in bases."
effect = "Higher drops short reads, which more often map to several loci."

[planned."--cut-tail"]
meaning = "fastp `--cut_tail`: trim read tails while their window quality is low."
effect = "On: degraded tails are cut, so more reads fail `-l`."

[planned."--cut-window"]
meaning = "fastp `-W`: bases in the window `--cut-tail` averages."
effect = "Wider smooths over single bad bases; used only with `--cut-tail`."

[planned."--cut-mean"]
meaning = "fastp `-M`: mean quality below which `--cut-tail` cuts."
effect = "Higher cuts more of each tail; used only with `--cut-tail`."

