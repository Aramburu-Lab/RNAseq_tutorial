columns.n_bases = "Of those, N bases."
columns.sa_index_bases = "STAR's --genomeSAindexNbases, min(14, floor(log2(length) / 2 - 1)); null under HISAT2."
columns.genes_subset = "Annotation genes on the reference's contigs; on the half, genes ending inside it."
columns.protein_coding_subset = "Of those, protein-coding genes."
columns.genes_genome = "Genes in the whole annotation file."
columns.annotation_release = "The annotation's release, from its header."
columns.annotation_sha256 = "SHA-256 of the annotation file as declared and found."
columns.start_codons = "The subset's 3-nt start_codon records read from the reference."
columns.atg_share = "Of those, the share that read ATG on the record's strand."
columns.index_key = "The aligner's index folder under tools/index/, named by its key."
columns.built = "True when this run built the index; false when it reused one."
columns.build_s = "Wall time of the index build; 0 when reused."

[tables.folders]
units = {}
columns.step = "The step: an index, the trim, an alignment or a count, as [folders] names it."
columns.folder = "The content-keyed folder under tools/, its name ending in its key."
columns.built = "True when this run built the folder; false when it reused one."

[tables.skipped]
units = {}
columns.run_accession = "A run of the sheet left unread."
columns.status = "Why: its FASTQ status, or not_downloaded."

[tables.incomplete]
units = { genes_kept = "genes", genes_removed = "genes", kept_reads_main = "reads", kept_reads_cut = "reads", gained = "reads", lost = "reads", removed_reads_main = "reads", unique_pct_main = "%", unique_pct_cut = "%" }
columns.genes_kept = "Genes of the whole reference also on the half."
columns.genes_removed = "Genes of the whole reference not on the half."
columns.kept_reads_main = "The featured sample's reads on kept genes, whole reference."
columns.kept_reads_cut = "The same genes' reads on the half reference."
columns.gained = "Reads kept genes gained on the half, summed over genes that gained."
columns.lost = "Reads kept genes lost on the half, summed over genes that lost."
columns.removed_reads_main = "Reads on the removed genes, whole reference."
columns.unique_pct_main = "Uniquely mapped share of input reads, whole reference."
columns.unique_pct_cut = "Uniquely mapped share of input reads, half reference."

[tables.context]
units = { salmon_percent_mapped = "%", expected_share = "fraction", expected_read_share = "fraction", salmon_strand_bias = "fraction", observed_assigned_share = "fraction", observed_over_expected = "ratio" }
columns.sample = "Sample, in both datasets."
columns.salmon_percent_mapped = "Salmon's percent_mapped, from the other dataset's ctx qc metrics."
columns.expected_share = "Salmon's length-scaled counts (nf-core's gene_counts_length_scaled, as ctx gather keeps them) on genes of the genome's contigs, over all of them."
columns.expected_read_share = "expected_share times salmon_percent_mapped / 100: Salmon's share of every read it saw, if length scaling moved no count between contigs."
columns.salmon_strand_bias = "Salmon's strand_mapping_bias."
columns.salmon_call = "Its call at the registry's salmon_strand_bias bands."
columns.observed_assigned_share = "Reads featureCounts assigned here, at the called strand, over the aligner's input reads."
columns.observed_over_expected = "observed_assigned_share over expected_read_share; above 1 where more reads are assigned here than Salmon puts on these contigs, as reads from missing contigs can be. Null where Salmon's share is 0."

[tables.reference.page]
title = "The reference each alignment used"
columns = ["Reference", "Contigs", "Bases", "Genes, of the annotation", "Start codons ATG"]

[tables.folders.page]
title = "Tool folders this run built or reused"
columns = ["Step", "Folder under tools/", "This run"]

[tables.alignment.page]
title = "Each sample's alignment: splices, and records beside reads"
columns = ["Sample", "Uniquely mapped %", "Splices per 100 unique", "Annotated splice share", "Non-canonical splices", "Records", "Mapped records %", "Primary mapped %"]
note = "Splices are STAR's own counts, not defined under HISAT2. samtools flagstat counts records, a multimapper once per alignment, so mapped records % can differ from primary mapped %, which counts each read once."

[tables.strandedness.page]
title = "Strand call per sample"
columns = ["Sample", "Reads at -s 1", "Reads at -s 2", "Forward share", "Call", "Counted at", "Salmon's share", "Salmon's call"]

[tables.concordance.page]
title = "Each comparison over the gene sums of every sample"
columns = ["Comparison", "Genes", "Identical", "Spearman ρ", "Bootstrap interval", "Bias", "Limits of agreement"]

[tables.incomplete.page]
title = "The featured sample on the whole and on the half reference"
columns = ["Genes kept", "Genes removed", "Reads on kept genes, whole", "Reads on kept genes, half", "Gained", "Lost", "Reads on removed genes", "Uniquely mapped %, whole to half"]

[tables.context.page]
title = "Salmon's share on these contigs, beside the share assigned here"
columns = ["Sample", "Salmon mapped %", "Share of Salmon's counts", "Share of reads, Salmon", "Share of reads, assigned here", "Assigned over Salmon"]
note = "Salmon's length-scaled counts, scaled by its mapping rate, put a median {share} % of each sample's reads on genes of these contigs. Assigned here over Salmon: {low} to {high}, above one in {n_above} of {n} samples. Salmon's share is no ceiling: on a partial reference, reads from missing contigs can align to similar genes here and be assigned to them."
