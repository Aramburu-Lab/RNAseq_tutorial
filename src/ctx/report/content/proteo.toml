[columns]
sample = ["none", "Sample, from the gather sample sheet."]
cell_type = ["none", "Cell type, from the gather sample sheet."]
condition = ["none", "Condition, from the gather sample sheet."]
plex = ["none", "Made-up TMT plex the sample was measured in."]
n_quantified = ["protein groups", "Made-up protein groups with a value in this sample."]
gene = ["none", "Made-up gene identifier."]
gene_class = ["none", "Made-up gene class."]
quantified_share = ["fraction", "Share of samples with a protein value."]
rho = ["Spearman ρ", "Spearman correlation of RNA and protein across samples."]
rho_p = ["dimensionless", "Two-sided p of the Spearman correlation."]
rho_padj = ["dimensionless", "Benjamini-Hochberg adjusted rho_p over the genes tested."]
share = ["fraction", "Share of the class's genes with rho at or below this gene's."]
rna_lfc = ["log2 fold change", "Mean log2 CPM, tested minus reference."]
rna_padj = ["dimensionless", "Welch t-test p on log2 CPM, Benjamini-Hochberg adjusted."]
protein_lfc = ["log2 fold change", "Mean log2 TMT ratio, tested minus reference."]
protein_padj = ["dimensionless", "Welch t-test p on log2 TMT ratio, Benjamini-Hochberg adjusted."]
call = ["none", "Changed at RNA, protein, both or neither."]
keep = ["none", "Changed at some level; always drawn on the page."]
row = ["none", "Gene and layer: RNA or protein."]
z = ["SD", "Value centred and scaled per gene and layer over the samples shown."]
level = ["none", "The z step the cell is drawn in."]
