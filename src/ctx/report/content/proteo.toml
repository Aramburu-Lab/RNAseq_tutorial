rho = "Median per-gene ρ"
fold = "Fold-change ρ"
fold_detail = "Bootstrap 95 % CI {low:.2f} to {high:.2f}"

[groups]
missing = "Missingness first"
correlation = "Does protein follow RNA"
fold = "Do fold changes agree"
worked = "Worked genes"
paired = "RNA and protein, sample by sample"
contrast = "RNA and protein calls on the same samples"

[classes]
