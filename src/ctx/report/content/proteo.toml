# The M7 RNA versus protein page (ctx proteo), on real data. The preview on made-up data keeps
# its own text in proteo_preview.toml. Placeholders in {braces} are filled by the code.

title = "M7 RNA versus protein: {dataset}"
budget = "Track {track}: under {minutes} min and {ram_gb} GB."
purpose = "Measure how far protein follows RNA, per gene across samples or as fold changes in one contrast. Name the genes whose protein departs from their RNA."
input = "Gather's counts or M5's results, and a protein table: [[TMT]] log2 ratios or abundances, or [[proteomic ruler]] copy numbers. `ctx setup` accepts the CPTAC data use agreement on the reader's behalf when it fetches a PDC file: `https://cptac-data-portal.georgetown.edu/cptac/s?id=73217`."
method = """[[mass spectrometry proteomics|Mass spectrometry]] measures peptides, assembled into [[protein groups]]. Each group becomes one gene; groups naming several genes leave, and a gene measured twice keeps its best-quantified row.

A protein not quantified in a sample is [[missingness|missing]], never zero. Only proteins quantified in enough samples are tested, decided in exact fractions.

Across samples, per-gene [[Spearman]] ρ and Pearson r compare RNA with protein, with [[BH]] over the tested genes. Across studies, RNA and protein fold changes are compared by Spearman ρ with a [[bootstrap]] interval."""
interpretation = """Read the [[missingness]] figures first: a protein missing in a plex or a donor is untested, not unchanged, and low-abundance genes go missing most often.

A positive median ρ says RNA explains part of protein variation, not all of it. Complex subunits made in excess are degraded unless assembled, so their ρ runs low; metabolic enzymes follow their RNA more closely.

Fold changes agree in rank more than in size: [[ratio compression]] and copy-number scaling shrink protein changes. A gene far above the diagonal is a lead for stored protein, such as neutrophil granule proteins made early in development."""
pitfalls = [
    "Imputing zeros: a missing protein is unmeasured, not absent; a zero shifts its mean, fold change and ρ.",
    "Joining on symbols alone: [[shared peptides]] map one protein group to several genes, and isoforms map several groups to one.",
    "Reading a cross-study fold change as paired: the RNA and protein donors differ, so only ranks across genes compare.",
]

# Words of the page beside its figures.
cross_study = "Cross-study comparison: RNA from {rna}, protein from {protein}. The donors differ, so genes are compared, never samples."
collapse = "Protein table: {rows:,} rows; {no_symbol:,} without a gene symbol and {several:,} naming several genes left; {twice:,} genes measured by more than one row kept their best-quantified one; {kept:,} genes remain."
zeros = "{zeros:,} cells written as 0 in the source were read as missing."
rna_twice = "RNA: {twice:,} gene symbols shared by two or more gene IDs were left out."
classes_note = "Gene classes from {sources}; {twice:,} genes in more than one class were left out of the class comparisons."
paired = "{n:,} of {n_columns:,} protein samples have a chosen tumour in gather's sheet. {by_sample_id:,} of them are named by their GDC sample ID, not their case, and are paired by it."
tumour_normal = "{n_tumour:,} tumour and {n_normal:,} normal columns of {n_columns:,} have the same patient's chosen RNA file; {n_cases:,} patients have both. {excluded:,} patients are left out by the dataset file: {reason}"
class_shift = "{name}, {n:,} genes tested at both layers: median protein log2 FC {protein:.2f}, RNA {rna:.2f}. Protein minus RNA, one-sided Mann-Whitney against the other genes: below p = {below}, above p = {above}."
unit_ratio = "log2 ratio to the reference"
f4_missing = "RNA and protein calls for {contrast} are not compared: M5's results for it are absent. Run `ctx de` on a sheet with the contrast's column."
# A protein table of any study ([proteo.table], ctx.proteo.study), each line after the reader's step.
table_read = "Protein table {file}, read as {format}: {columns:,} sample columns of {scale} values. Cells read as missing, never as zero, per declared token: {tokens}."
table_maxquant = "MaxQuant rows left out before any value was read, each counted once in this order: {reverse:,} reverse decoys, {contaminant:,} contaminants, {only_by_site:,} identified only by a modification site."
table_mapped = "Identifiers as {kind}: {mapped:,} rows map to one RNA gene. Left out: {no_id:,} without an identifier, {no_map:,} with a member the UniProt map lacks, {absent:,} naming a gene absent from the RNA side, {shared:,} naming a symbol two RNA genes share. {several:,} protein groups name several genes and are listed in the several-genes table, never assigned to one."
table_tmt = "TMT design: {n:,} plexes of {low:,} to {high:,} samples, listed in the batches table. Values are compared across plexes as the table gives them; no plex correction is made here."
table_label_free = "Label-free design: {n:,} runs or run batches of {low:,} to {high:,} samples, listed in the batches table. Values are compared as the table gives them, normalised by its own software."
table_reference = "Each value is a log2 ratio to its plex's reference channel, marked yes in the sample table's {column} column; the reference channels then leave."
table_paired = "{n:,} of {n_columns:,} protein samples are paired with an RNA sample by the sample table; only those enter a correlation."
unregistered = "The Krug 2020 band rule is not registered: its supplement prints the per-gene correlations only as a histogram, Figure S2G, with no median."
sanity_title = "Sanity rules, registered before any protein value was read"
sanity_columns = ["Rule", "What it checks", "Measured", "Verdict"]

[[terms]]
term = "Protein group"
meaning = "Proteins that share their identified peptides and cannot be told apart; one row in the table."

[[terms]]
term = "Quantified share"
meaning = "Fraction of samples in which a protein has a value; the filter acts on it."

[[terms]]
term = "Per-gene ρ"
meaning = "Spearman correlation of one gene's RNA and protein across samples."

[[terms]]
term = "Cross-study comparison"
meaning = "RNA from one study and protein from another, compared gene by gene, never sample by sample."

[[questions]]
prompt = "A complex subunit rises at RNA with no protein change. Name two explanations before calling it noise."
answer = "Excess subunits are degraded unless assembled, so protein follows the limiting subunit. Or the protein was quantified in too few samples to test."

[[questions]]
prompt = "Why is a protein missing from one [[TMT]] plex not a zero in those samples?"
answer = "No peptide of it was identified in that run; it may be present below detection. A zero would claim absence and pull its mean and fold change down."

[[questions]]
prompt = "A gene sits far above the diagonal of neutrophil over monocyte fold changes. Which timing of synthesis explains it?"
answer = "Granule proteins are made in the bone marrow and stored; mature neutrophils keep the protein after the mRNA has gone. Check the class figure before generalising."


# A tumour against normal design (ctx.proteo.run.tumour_normal) reads these sections in place of
# the page's own, which were written for cell types compared across studies.
[variants.tumour_normal]
interpretation = """Read the [[missingness]] figures first: a protein missing in a [[TMT]] plex is untested, not unchanged.

Per-gene [[Spearman|ρ]] is computed within tumours and within [[normal adjacent tissue|normals]], never over both. Across tumours it follows differences between patients, such as [[tumour purity|purity]]; across normals RNA spreads less, which lowers ρ with no change in regulation.

The [[log2 fold change|fold changes]] compare each patient's tumour with the same patient's normal, so patient effects cancel. A class whose protein moves further than its RNA in the class lines above points to control after transcription, such as fewer mitochondria. [[ratio compression|Ratio compression]] shrinks protein changes, so ranks agree more than sizes."""
pitfalls = [
    "Reading [[normal adjacent tissue]] as healthy tissue: it sits beside the tumour and can hold tumour cells.",
    "Pooling tumours and normals into one correlation: the tissue difference alone makes RNA and protein agree.",
    "Treating every normal as a control: only patients with both tissues enter the paired fold changes.",
]

[[variants.tumour_normal.questions]]
prompt = "A gene's [[Spearman|ρ]] is high across tumours and near zero across normals. Name a reason other than regulation."
answer = "Normals vary less. With a narrow spread of RNA and protein, measurement noise dominates both layers, and ρ falls even where protein follows RNA."

[[variants.tumour_normal.questions]]
prompt = "Why compare each tumour with the same patient's normal instead of the pooled normals?"
answer = "Patient effects such as genotype, age and sampling cancel within a pair, so the [[paired design|paired]] [[log2 fold change|fold change]] reflects the tissue, and the test gains [[power]]."

[[variants.tumour_normal.questions]]
prompt = "If oxidative phosphorylation proteins fall further than their RNA in tumours, which change in the cell explains it?"
answer = "Fewer mitochondria, or subunits left unassembled and degraded: protein then drops below what the RNA predicts. Check the class lines before generalising."

[abundance]
across_samples = "log2(CPM + 1), mean over samples"
tumour_normal = "log2(CPM + 1), mean over tumours"
cross_dataset = "log2(M5 baseMean + 1)"

