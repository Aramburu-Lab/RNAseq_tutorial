# The M7 RNA versus protein page (ctx proteo), on real data. The preview on made-up data keeps
# its own text in proteo_preview.toml. Placeholders in {braces} are filled by the code.

title = "M7 RNA versus protein: {dataset}"
budget = "Track {track}: under {minutes} min and {ram_gb} GB."
purpose = "Measure how far protein follows RNA, per gene across samples or as fold changes in one contrast. Name the genes whose protein departs from their RNA."
input = "Gather's counts or M5's results, and a protein table: [[TMT]] log2 ratios or [[proteomic ruler]] copy numbers. `ctx setup` accepts the CPTAC data use agreement on the reader's behalf when it fetches a PDC file: `https://cptac-data-portal.georgetown.edu/cptac/s?id=73217`."
method = """[[mass spectrometry proteomics|Mass spectrometry]] measures peptides, assembled into [[protein groups]]. Each group becomes one gene; groups naming several genes leave, and a gene measured twice keeps its best-quantified row.

A protein not quantified in a sample is [[missingness|missing]], never zero. Only proteins quantified in enough samples are tested, decided in exact fractions.

Across samples, per-gene [[Spearman]] ρ and Pearson r compare RNA with protein, with [[BH]] over the tested genes. Across studies, RNA and protein fold changes are compared by Spearman ρ with a [[bootstrap]] interval."""
interpretation = """Read the [[missingness]] figures first: a protein missing in a plex or a donor is untested, not unchanged, and low-abundance genes go missing most often.

A positive median ρ says RNA explains part of protein variation, not all of it. Complex subunits made in excess are degraded unless assembled, so their ρ runs low; metabolic enzymes follow their RNA more closely.

Fold changes agree in rank more than in size: [[ratio compression]] and copy-number scaling shrink protein changes. A gene far above the diagonal is a lead for stored protein, such as neutrophil granule proteins made early in development."""
pitfalls = [
    "Imputing zeros: a missing protein is unmeasured, not absent; a zero shifts its mean, fold change and ρ.",
    "Joining on symbols alone: [[shared peptides]] map one protein group to several genes, and isoforms map several groups to one.",
    "Reading a cross-study fold change as paired: the RNA and protein donors differ, so only ranks across genes compare.",
]

# Words of the page beside its figures.
cross_study = "Cross-study comparison: RNA from {rna}, protein from {protein}. The donors differ, so genes are compared, never samples."
collapse = "Protein table: {rows:,} rows; {no_symbol:,} without a gene symbol and {several:,} naming several genes left; {twice:,} genes measured by more than one row kept their best-quantified one; {kept:,} genes remain."
zeros = "{zeros:,} cells written as 0 in the source were read as missing."
rna_twice = "RNA: {twice:,} gene symbols shared by two or more gene IDs were left out."
classes_note = "Gene classes from {sources}; {twice:,} genes in more than one class were left out of the class comparisons."
paired = "{n:,} of {n_columns:,} protein samples have a chosen tumour in gather's sheet. {by_sample_id:,} of them are named by their GDC sample ID, not their case, and are paired by it."
f4_missing = "RNA and protein calls for {contrast} are not compared: M5's results for it are absent. Run `ctx de` on a sheet with the contrast's column."
unregistered = "The Krug 2020 band rule is not registered: its supplement prints the per-gene correlations only as a histogram, Figure S2G, with no median."
sanity_title = "Sanity rules, registered before any protein value was read"
sanity_columns = ["Rule", "What it checks", "Measured", "Verdict"]

[[terms]]
term = "Protein group"
meaning = "Proteins that share their identified peptides and cannot be told apart; one row in the table."

[[terms]]
term = "Quantified share"
meaning = "Fraction of samples in which a protein has a value; the filter acts on it."

[[terms]]
term = "Per-gene ρ"
meaning = "Spearman correlation of one gene's RNA and protein across samples."

[[terms]]
term = "Cross-study comparison"
meaning = "RNA from one study and protein from another, compared gene by gene, never sample by sample."

[[questions]]
prompt = "A complex subunit rises at RNA with no protein change. Name two explanations before calling it noise."
answer = "Excess subunits are degraded unless assembled, so protein follows the limiting subunit. Or the protein was quantified in too few samples to test."

[[questions]]
prompt = "Why is a protein missing from one [[TMT]] plex not a zero in those samples?"
answer = "No peptide of it was identified in that run; it may be present below detection. A zero would claim absence and pull its mean and fold change down."

[[questions]]
prompt = "A gene sits far above the diagonal of neutrophil over monocyte fold changes. Which timing of synthesis explains it?"
answer = "Granule proteins are made in the bone marrow and stored; mature neutrophils keep the protein after the mRNA has gone. Check the class figure before generalising."

[abundance]
across_samples = "log2(CPM + 1), mean over samples"
cross_dataset = "log2(M5 baseMean + 1)"

[keys]
genes = "Genes in both layers"
tested = "Tested"
tested_detail = "Quantified in at least {pct} % of samples"
rho = "Median per-gene ρ"
fold = "Fold-change ρ"
fold_detail = "Bootstrap 95 % CI {low:.2f} to {high:.2f}"

[groups]
missing = "Missingness first"
correlation = "Does protein follow RNA"
fold = "Do fold changes agree"
worked = "Worked example: the ERBB2 amplicon"
paired = "RNA and protein, tumour by tumour"
contrast = "RNA and protein calls on the same tumours"

[classes]
other = "Other"
complex = "Complex subunit"
metabolic = "Metabolic enzyme"
granule = "Granule protein"
count = "{name} {n:,}"

[figures.quantified]
title = "Protein groups quantified per sample"
lead = "{n_kept:,} of {n_ids:,} genes have a protein value in at least {min_pct} % of samples; the rest are not tested."
reading = [
    "Each bar is one sample; its height counts the genes with a protein value in it.",
    "Colour marks the group the sample belongs to: a plex or a cell type.",
]
caption = "{n_samples} samples, {n_groups} groups; {n_ids:,} genes with a protein value in some sample, {n_all:,} in every sample. Counts, no test."
category = "Sample"
value = "Genes quantified"

[figures.coverage]
title = "Quantified share per protein, by RNA abundance"
lead = "Low-abundance genes go missing most: {low_pct:.0f} % of the lowest RNA tertile pass the filter, {high_pct:.0f} % of the highest."
reading = [
    "Each curve is one RNA abundance tertile: the share of its genes quantified in at most each share of samples.",
    "Genes right of the dashed line pass the filter.",
]
caption = "{n_genes:,} genes with RNA and a protein value in some sample; tertiles of {abundance}. Descriptive, no test; drawn before every test."
x = "Samples with a protein value"
y = "Cumulative share of genes"
line = "filter"
tertile = "RNA tertile {n}"

[figures.rho]
title = "Per-gene RNA-protein correlation, by gene class"
lead = "Median ρ is {median:.2f} over {n_genes:,} tested genes; {n_sig:,} have ρ above zero at BH-adjusted p < {alpha}."
reading = [
    "Each curve is one gene class: the share of its genes with ρ at or below each value.",
    "A curve further right holds genes whose protein follows their RNA more.",
]
caption = "Spearman ρ per gene over {n_samples} samples, BH over {n_genes:,} genes; {counts}. [[Kruskal-Wallis]] H = {h:.1f}, p = {p}, ε² = {eps:.3f}; complex below metabolic, one-sided Mann-Whitney p = {p_class}."
x = "RNA-protein Spearman ρ"
y = "Cumulative share of genes"
median = "median"

[figures.worked]
title = "{gene}: RNA against protein per sample"
lead = "Spearman ρ = {rho:.2f}, Pearson r = {r:.2f} over {n:,} samples with both layers."
reading = [
    "Each dot is one sample; colour marks the {track} call of the source annotation.",
]
caption = "{gene}: RNA as log2 CPM against protein as log2 ratio to the reference, over {n} samples; Spearman ρ = {rho:.2f}, BH-adjusted p = {padj}."
x = "RNA"
y = "Protein"

[figures.fold]
title = "RNA against protein fold change: {tested} over {reference}"
lead = "Spearman ρ = {rho:.2f} across {n_genes:,} genes, bootstrap 95 % CI {low:.2f} to {high:.2f}; {n_same:,} change in the same direction at both levels."
reading = [
    "Solid line: the smallest region holding {inner} of a class's genes; dashed: {outer}. A class under {minimum} genes is drawn as points.",
    "Triangles mark the genes of the declared class, drawn over the contours; hover names each.",
]
caption = "Cross-study; RNA: M5's log2 FC, n = {n_rna}; protein: Welch t on log2 copies, n = {n_protein}, BH. Spearman ρ = {rho:.2f}, {ci} % CI {low:.2f} to {high:.2f}; regions {inner} and {outer}, {bandwidth}."
x = "RNA log2 fold change"
y = "Protein log2 fold change"

[figures.contrast]
title = "RNA against protein fold change on the same tumours: {tested} over {reference}"
lead = "RNA calls {rna_up:,} genes up and {rna_down:,} down; protein calls {protein_up:,} up and {protein_down:,} down. {both:,} genes are called at both layers, {opposite:,} of them in opposite directions."
reading = [
    "Each contour holds most genes of one group: called at both layers, at RNA only, at protein only, or at neither.",
    "Solid line: the smallest region holding {inner} of a group's genes; dashed: {outer}. A group under {minimum} genes is drawn as points.",
    "A call at either layer needs BH-adjusted p < {alpha} and an absolute log2 fold change of at least {lfc}.",
]
caption = "{tested} over {reference}; RNA: M5's DESeq2, {n_rna}; protein: Welch t, {n_protein}; BH each. Spearman ρ = {rho:.2f} over {n_genes:,} genes, {ci} % CI {low:.2f} to {high:.2f}; regions {inner} and {outer}, {bandwidth}."
x = "RNA log2 fold change"
y = "Protein log2 fold change"

[figures.contrast.kinds]
both = "called at both layers"
rna = "RNA only"
protein = "protein only"
neither = "neither"

[figures.paired]
title = "RNA and protein of the same genes, tumour by tumour"
lead = "{n_genes:,} genes over {n_samples:,} tumours: each gene's RNA row sits above its protein row."
reading = [
    "Each row is z-scored over its tumours; a gene whose two rows share a pattern has protein following RNA.",
    "The strips above the columns give each tumour's {tracks}; a pattern that follows the plex strip is a batch effect.",
    "A blank cell is a protein not quantified in that tumour, never a zero.",
]
caption = "The named genes, then the highest and the lowest per-gene Spearman ρ, printed at right; {missing:,} protein cells missing. Descriptive, no further test."
row = "Gene and layer"
column = "Tumour"
column_title = "{n_samples:,} tumours, sorted by {sorted}"
rna_row = "{gene} RNA"
protein_row = "{gene} protein"
rho = "Spearman ρ"
alternating = "{track}: {n:,} levels, one run each, in two greys in turn"

[figures.shift]
title = "Protein minus RNA fold change, by gene class"
lead = "Granule proteins sit {direction} the other genes: median {granule:.2f} against {other:.2f}."
reading = [
    "Each curve is one class: the share of its genes at or below each difference.",
    "A curve further right holds genes with more protein than their RNA change predicts.",
]
caption = "Cross-study. Protein log2 FC minus RNA log2 FC; {counts}. One-sided [[Mann-Whitney]], granule above other: p = {p}, rank-biserial r = {r:.2f}."
x = "Protein minus RNA log2 fold change"
y = "Cumulative share of genes"
above = "above"
below = "below"

# Unit and meaning of every column the module writes, for the README beside each file.
[columns]
sample = ["none", "Sample as the protein table names it."]
group = ["none", "The plex or cell type the sample belongs to."]
n_quantified = ["genes", "Genes with a protein value in this sample."]
gene = ["none", "Gene symbol, one row per gene."]
gene_class = ["none", "Gene class from the dataset file's gene sets; Other for none."]
tertile = ["none", "RNA abundance tertile of the gene."]
share = ["fraction", "Share of the curve's genes at or below this gene's value."]
quantified_share = ["fraction", "Share of samples with a protein value."]
n_samples = ["samples", "Samples with a protein value."]
tested = ["none", "True when quantified in enough samples to be tested."]
rho = ["Spearman ρ", "Spearman correlation of RNA and protein across samples."]
rho_p = ["dimensionless", "Two-sided p of rho, t-distribution."]
rho_padj = ["dimensionless", "Benjamini-Hochberg adjusted rho_p over the tested genes."]
r = ["Pearson r", "Pearson correlation of RNA and protein across samples."]
r_p = ["dimensionless", "Two-sided p of r."]
r_padj = ["dimensionless", "Benjamini-Hochberg adjusted r_p over the tested genes."]
rna = ["log2 CPM", "log2(CPM + 1) of the gene in the sample."]
protein = ["log2 ratio", "Protein log2 ratio to the pooled reference."]
track = ["none", "The annotation's call for the sample."]
rna_lfc = ["log2 fold change", "M5's raw log2 fold change, tested over reference."]
rna_padj = ["dimensionless", "M5's Benjamini-Hochberg adjusted p."]
rna_mean = ["normalised reads", "M5's baseMean: mean of DESeq2-normalised counts."]
protein_lfc = ["log2 fold change", "Mean log2 copies, tested minus reference, over present values."]
protein_p = ["dimensionless", "Welch t-test p on log2 copies."]
protein_padj = ["dimensionless", "Benjamini-Hochberg adjusted protein_p over the tested proteins."]
difference = ["log2 fold change", "protein_lfc minus rna_lfc."]
protein_call = ["none", "up, down or ns by protein_padj < 0.05 and abs(protein_lfc) at least --lfc-min."]
keep = ["none", "Always drawn on the page: a gene of the declared class."]
rna_call = ["none", "up, down or ns by M5's padj < 0.05 and abs(rna_lfc) at least --lfc-min."]
called = ["none", "True when called at both layers: drawn as a point over the contours."]
kind = ["none", "Where the gene was called: at both layers, RNA only, protein only, or neither."]
row = ["none", "The gene and the layer of the heatmap row."]
z = ["z-score", "The row's value centred on its mean and scaled by its standard deviation over the tumours."]
level = ["none", "The z-score's colour step."]
