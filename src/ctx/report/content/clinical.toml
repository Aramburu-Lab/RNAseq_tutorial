[columns.km]
group = ["none", "Split at the cohort median of expression."]
months = ["months", "Time since diagnosis of this vertex of the drawn line."]
survival = ["fraction", "Height of the vertex: the Kaplan-Meier estimate, or a censor tick's end."]
at_risk = ["patients", "Patients still followed just before this time."]
