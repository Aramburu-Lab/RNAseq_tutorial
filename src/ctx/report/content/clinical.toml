z = ["SD", "Expression centred and scaled over the cohort."]
group = ["none", "Split at the cohort median of expression."]
days = ["days", "Time from diagnosis to the event or to censoring."]
months = ["months", "Days divided by the mean days per month."]
event = ["none", "1 for an event, 0 for censored."]

[columns.km_estimates]
group = ["none", "Split at the cohort median of expression."]
months = ["months", "A time at which a patient had the event or was censored."]
at_risk = ["patients", "Patients still followed just before this time."]
events = ["patients", "Events at this time."]
