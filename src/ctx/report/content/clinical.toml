[columns.power]
events = ["events", "Events in the cohort."]
hr = ["ratio", "Hazard ratio per SD of a covariate."]
power = ["%", "Power of the two-sided Wald test."]

[columns.confounding]
row_variable = ["none", "Sample-sheet column of the row."]
column_variable = ["none", "Sample-sheet column of the column."]
v = ["dimensionless", "Cramér's V, empty on the diagonal and for a constant column."]
