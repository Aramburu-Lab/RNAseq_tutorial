# M4 Quantification page (ctx quant). Placeholders in {braces} are filled by the code; keep their names.

title = "M4 Quantification: {dataset}"
budget = "Track A: under {minutes} min and {ram_gb} GB"
no_value = "not recorded"
# One test in a caption: n per group, BH-adjusted p, rank-biserial r (above 0: tested higher).
tests_item = "{feature} n {n_ref:,} and {n_test:,}, p {p}, r {r:.2f}"
# A p-value that underflows to zero in double precision.
p_below = "below {smallest:.1e}"
purpose = "Read what [[Salmon]] did with every sample's fragments, and how its transcript estimates become the gene counts differential expression reads."
input = "The nf-core/rnaseq outdir of {n} samples: Salmon's logs per sample and the length-scaled gene matrix, from nf-core/rnaseq {release} with Salmon {salmon}. Transcript figures read each sample's `quant.sf` from the per-sample copy."
method = """[[Salmon]] maps each fragment to the [[transcript|transcripts]] it fits, or to a [[decoy]] where genome sequence outside the transcriptome fits better. It splits fragments that fit several transcripts by their estimated abundance.

tximport sums transcripts into genes: [[TPM]] by sum, length as the TPM-weighted mean of [[effective length]]. ctx runs its own port of tximport and stops unless it equals the tables nf-core's R wrote. Length-scaled counts give DESeq2 counts free of isoform-length changes."""
interpretation = """Compare genes within a sample on [[TPM]], and samples on counts after DESeq2's [[size_factor|size factors]]. A [[mapping rate]] that differs by read-length [[batch_effect|batch]] belongs to the batch; where batches follow the groups, it cannot be separated from them.

Compare detection at a depth every sample reaches: a deeper library detects more genes by sampling alone. Samples should correlate more within a cell type than between, with labels moved only within a donor.

Where estimated and length-scaled fold changes disagree, isoform use differs between the groups. Length-scaled counts carry that correction into DESeq2, which takes no per-gene length offset."""
pitfalls = [
    "Comparing genes on counts: at equal expression a longer gene collects more reads; compare genes on [[TPM]].",
    "TPM into DESeq2: TPM removes [[library size]], so the count model's variance no longer fits.",
    "An index without decoys: reads from unannotated genome sequence map to similar transcripts and inflate them.",
]

[[terms]]
term = "TPM"
meaning = "Transcripts per million: reads per base of effective length, scaled so one sample's values sum to a million."

[[terms]]
term = "Effective length"
meaning = "The positions in a transcript where a fragment can start: its length less the mean fragment that fits."

[[terms]]
term = "Decoy"
meaning = "Genome sequence in a Salmon index, so fragments from outside the transcriptome land there and not on a similar transcript."

[[terms]]
term = "Length-scaled counts"
meaning = "TPM times the gene's mean effective length over samples, scaled to each sample's estimated reads (tximport lengthScaledTPM)."

[[questions]]
prompt = "Gene A has twice the [[TPM]] of gene B in one sample. Does gene A have twice the reads?"
answer = "Only at equal [[effective length]]. Reads are TPM times effective length times one constant of the sample."

[[questions]]
prompt = "Why does pydeseq2 receive length-scaled counts and not Salmon's estimated counts?"
answer = "Estimated counts shift when a gene's isoform mix changes. R's tximport passes that change to DESeq2 as an offset matrix, which pydeseq2 cannot take; length scaling builds it into the counts."

[[questions]]
prompt = "One sample detects fewer genes than the others. What do you check before calling it degraded?"
answer = "Its depth first: read the curves at the depth every sample reaches. Then its mapping rate and cell type."

[notes]
sums = "Length scaling keeps each sample's reads: the length-scaled counts of each of {n} samples sum to Salmon's mapped fragments, within {worst:.1e} relative."
no_q1 = "The per-sample Salmon files are not here, so the gene and transcript figures are left out. Copy them to data/raw/{dataset}_salmon, or name the folder with --salmon-dir."
q1 = "ctx's port of tximport summed every quant.sf of {n} samples and equals each gene table nf-core's R wrote; the gene and transcript figures read it."
not_yet = "Not yet drawn: genes Salmon, STAR and featureCounts detect on the same reads, and the reads Salmon splits between genes. Both need cluster runs not made yet."

# The laptop path (--genome): Salmon run here on M3's trimmed reads.
[laptop]
input = "M3's trimmed FASTQ files of {n} samples, the genome `{genome}` and the dataset file's annotation. Salmon {salmon} quantifies each sample here."
method = """The transcripts are spliced from the genome at the annotation's exons. {decoys}

tximport sums transcripts into genes: TPM by sum, length as the TPM-weighted mean of effective length. ctx's port of tximport equals R's on the course's test files. Length-scaled counts give DESeq2 counts free of isoform-length changes."""
decoys_on = "The genome's sequence joins the index as decoys: Salmon maps each fragment to the transcripts it fits, or to a decoy where the genome fits better."
decoys_off = "The index holds no decoys: Salmon maps each fragment to the transcripts it fits, and a fragment from unannotated sequence can land on a similar transcript."
note = "The index holds the transcripts of {genes:,} genes on {contigs} contig(s); {atg:.1f} % of the annotation's start codons read ATG on this genome. A fragment from any other chromosome finds no transcript, so the mapping rate counts the reference, not the library."

# The course preview (scripts/python/preview_quant.py): this page's code on made-up data.
[preview]
note = "Preview: every number on this page comes from made-up data, drawn to show how the page looks. Made-up quant.sf files went through ctx's tximport port as real ones do."
# The start of every preview caption, so each figure file says it holds made-up data.
caption = "Made-up data."
input = "Made-up Salmon outputs for the {n} samples of the made-up dataset: a quant.sf per sample and the numbers of Salmon's logs."
budget = "Preview build on made-up data; Salmon ran on no read. The real run's budget is Track A: under {minutes} min and {ram_gb} GB."
profile = "preview build, one process"

[groups]
salmon = "Salmon: fragment fates, library type and agreement between samples"
genes = "Genes: depth, units and length scaling"
transcripts = "Transcripts: isoforms expressed"

# The numbers at the top of Results.
[keys]
samples = "Samples"
mapping = "Median mapping rate"
mapping_detail = "{low:.1f} to {high:.1f} % of fragments processed"
library = "Library type"
library_detail = "{n_kind} of {n} samples; strand bias {low:.3f} to {high:.3f}"
decoy = "Median decoy share"
decoy_detail = "{low:.1f} to {high:.1f} % of fragments processed"

[fates]
mapped = "Mapped"
decoy = "Decoy"
below_score = "Below score"
no_hit = "No hit"

[gene_types]
protein_coding = "Protein-coding"
lncRNA = "lncRNA"
other = "Other"

# Words for columns on hover and on filters.
[labels]
fate = "Fate"
reads = "Fragments"
processed = "Processed"
cell_type = "Cell type"
condition = "Condition"
batch = "Batch"
gene_type = "Gene type"
n_genes = "Genes"

[tables.library]
title = "Library type and fragment lengths, by Salmon's detected type"
columns = ["Library type", "Samples", "Strand bias", "Fragment lengths", "Median mean fragment, nt", "Optimiser"]

[tables.fate_tests]
title = "Mapping rate by read-length batch, within each cell type"

[tables.tests]
columns = ["Cell type", "n reference", "n tested", "U", "p", "BH p", "r"]

# The data dictionary of every table and figure file; units are in the code.
[columns]
sample = "Sample, as the gather sheet names it."
cell_type = "Cell type, from the gather sheet."
condition = "Condition, from the gather sheet."
batch = "Read-length batch, from the gather sheet."
processed = "Fragments Salmon processed."
mapped = "Fragments Salmon mapped to a transcript."
decoy = "Fragments that mapped better to a decoy than to any transcript."
below_score = "Fragments whose best alignment fell below Salmon's score threshold."
no_hit = "Fragments with no alignment at all: processed less the other three fates."
mapped_pct = "Mapped fragments as a percentage of those processed."
decoy_pct = "Decoy fragments as a percentage of those processed."
below_score_pct = "Below-score fragments as a percentage of those processed."
no_hit_pct = "No-hit fragments as a percentage of those processed."
fate = "What Salmon did with the fragments."
reads = "Fragments with this fate."
percent = "Fragments with this fate as a percentage of those processed."
library_type = "The library type Salmon detected with -l A."
strand_bias = "Share of mapped fragments on the transcript's strand, from lib_format_counts.json."
fragment_mean = "Mean of the fragment-length distribution Salmon used."
fragment_sd = "Standard deviation of that distribution."
fragment_source = "Whether the distribution was observed from pairs or Salmon's prior."
gc_bias = "Whether Salmon corrected for fragment GC bias."
seq_bias = "Whether Salmon corrected for sequence bias at read starts."
optimiser = "Salmon's optimiser: vb (variational Bayes) or em."
salmon_version = "Salmon's version."
targets = "Transcripts in the index."
decoys = "Decoy sequences in the index."
length_scaled_sum = "The sample's column sum in nf-core's length-scaled gene matrix."
relative_difference = "Length-scaled sum less mapped fragments, over mapped fragments."
n_reference = "Samples in the reference batch."
n_tested = "Samples in the tested batch."
u = "Mann-Whitney U."
p = "Two-sided p-value."
p_bh = "p-value adjusted by Benjamini-Hochberg over the cell types tested."
r = "Rank-biserial r, above zero when the tested batch is higher."
sample_row = "Sample of the row."
sample_column = "Sample of the column."
rho = "Spearman rho of the two samples over genes detected on average."
level = "The rho bin the cell is drawn in; empty on the diagonal."
depth = "Reads kept after binomial thinning."
genes = "Genes with at least the detection threshold of reads at this depth."
common = "Whether this depth is the one every sample reaches."
gene_id = "GENCODE gene identifier."
gene_name = "Gene symbol from the annotation."
tpm = "The gene's TPM in this sample: the sum of its transcripts'."
counts = "Salmon's estimated reads for the gene: the sum of its transcripts'."
length = "The gene's effective length: its transcripts' effective lengths weighted by TPM."
length_class = "Effective length class, as the legend names it."
estimated = "log2 fold change from estimated counts, tested over reference, each mean plus one."
length_scaled = "log2 fold change from length-scaled counts, computed the same way."
difference = "Estimated less length-scaled fold change."
gene_type = "Gene type from the annotation; types other than the two compared are one class."
annotated = "Transcripts of the gene in the Salmon index."
expressed = "Of those, transcripts at the TPM threshold in at least half the samples."
share = "Expressed transcripts as a share of annotated ones."
annotated_bin = "Annotated transcripts of the gene, binned."
n_genes = "Genes in this bin and type."
keep = "Whether the page always draws the point; the rest are thinned above the point budget."
sample_counts = "Gene counts of {sample}, tximport countsFromAbundance {mode}."

[figures.fates]
title = "What Salmon did with each sample's fragments"
lead = "Salmon mapped a median {median} % of fragments; the lowest is {low} %, in {low_sample}."
note = "The caption tests every sample."
reading = [
    "Each bar is one sample's fragments, stacked by fate as a percentage of those Salmon processed.",
    "Decoy fragments came from genome sequence outside the transcriptome; no-hit fragments matched nothing.",
]
caption = "Fragment fates of {n} samples. Mapping rate, {tested} over {reference} within each cell type, [[mann_whitney|Mann-Whitney]] U, BH over {n_tests}: {tests}."
caption_untested = "Salmon's fragment fates for {n} samples. No test: no cell type holds enough samples of two read-length batches."
category = "Sample"
value = "Fragments processed"

[figures.correlation]
title = "Spearman correlation between samples"
lead = "Median rho is {within:.3f} within cell types and {between:.3f} between them."
reading = [
    "Each cell is the Spearman rho of two samples over the genes detected on average; its colour is the bin in the legend, dark for low.",
    "Rows and columns follow the clustering; the strips on top mark cell type and batch.",
]
caption = "[[Spearman]] rho of {n} samples over {genes:,} genes with a mean of {min_reads} length-scaled counts; average linkage on one minus rho. Mean rho within cell types less between: {diff:.3f}; [[permutation_test|permutation]] p = {p:.2g}, {perms:,} permutations within {strata} donors."
lead_untested = "One cell type only: no pair of samples lies between cell types."
caption_untested = "Spearman rho of {n} samples over {genes:,} genes with a mean of {min_reads} length-scaled counts; average linkage on one minus rho. One cell type: no test."
axis = "Sample"

[figures.correlation.bins]
below = "rho < {edge:.3f}"
between = "rho {low:.3f} to {high:.3f}"
above = "rho ≥ {edge:.3f}"

[figures.detection]
title = "Genes detected against depth"
lead = "At {depth} reads, every sample's depth, the median sample detects {median} genes, from {low} to {high}."
reading = [
    "Each line is one sample, thinned to fewer reads; its height counts genes with at least {min_reads} estimated reads.",
    "The dashed line is the depth every sample reaches; a line still rising at its right end would detect more with more reads.",
]
caption = "Genes with {min_reads} or more reads in {n} samples thinned binomially. At {depth} reads, {tested} over {reference} within each cell type, Mann-Whitney U, BH over {n_tests}: {tests}."
caption_untested = "Genes with {min_reads} or more reads as {n} samples are thinned binomially to {depth} reads and below. No test: no cell type holds enough samples of two batches."
x = "Reads kept"
y = "Genes detected"
depth_line = "Depth every sample reaches"

[figures.units]
title = "Estimated reads against TPM in one sample"
lead = "In {sample}, the median long gene has {ratio:.1f} times the reads per TPM of the median short gene."
reading = [
    "Each point is one gene: its TPM across, its estimated reads up, both on log scales.",
    "Colour marks effective length; at equal TPM, a longer gene sits higher.",
]
caption = "Sample {sample}, the median by mapped fragments: {total:,} genes with {min_reads} or more reads. Descriptive, no test: reads are TPM times effective length times one constant."
thinned = "genes"
x = "Abundance"
y = "Estimated reads"
short = "Under {short:,} nt"
medium = "{short:,} to {long:,} nt"
long = "Over {long:,} nt"

[figures.estimates]
title = "Fold change from estimated and from length-scaled counts"
lead = "{far:,} of {genes:,} genes differ by two-fold or more between the two; Spearman rho {rho:.3f}."
reading = [
    "Each point is one gene: its fold change from length-scaled counts across, from estimated counts up.",
    "Points off the dashed line change isoform use between the groups.",
]
caption = "Contrast {contrast}, {n_ref} reference and {n_test} tested samples; {genes:,} genes past M5's expression filter. Descriptive, no test: Spearman rho {rho:.3f} over every gene."
thinned = "genes within two-fold"
x = "Fold change, length-scaled"
y = "Fold change, estimated"
identity = "Equal fold changes"

[figures.isoforms]
title = "Isoforms expressed against isoforms annotated"
lead = "{coding_n:,} of {coding_total:,} protein-coding genes express an isoform, a median {coding:.1f} % of theirs; {lncrna_n:,} of {lncrna_total:,} lncRNA genes, {lncrna:.1f} %."
reading = [
    "Each bar is the median share of a gene's isoforms at {tpm:g} TPM or more in half the samples, over genes that express one.",
    "Colour marks the gene type; hover a bar for its genes.",
]
caption = "{n:,} of {total:,} genes with two isoforms or more express one, at {tpm:g} TPM in half the samples. Share expressed, {tested} over {reference}, Mann-Whitney U: {tests}."
x = "Isoforms annotated"
y = "Isoforms expressed"
feature = "Share expressed"
bins = ["2", "3 to 4", "5 to 8", "9 to 16", "Over 16"]
