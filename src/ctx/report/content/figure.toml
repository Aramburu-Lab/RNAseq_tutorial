# The Reproduce panel under each figure that has a spec, its params file and the README's
# figure rows (Phase 2D, D-020). Every comment of the panel's commands comes from here.

[panel]
summary = "Reproduce"
lead = "Figure {figure_id}: paste these lines into bash on Linux, macOS or WSL2, or download them as a script."
download = "Download {name}"
upstream = "Upstream: the command that wrote these inputs and drew the figure"
no_container = "Docker and Apptainer tabs follow once the figures image is published; pixi runs it now."

[steps]
environment = "{step}. Environment: ctx {version} at commit {commit}, through pixi, then a clean folder."
environment_dirty = "{step}. Environment: ctx {version} from commit {commit} with uncommitted changes, which a clone does not hold."
environment_wheel = "{step}. Environment: an installed ctx {version}; install the same version, then a clean folder."
check_tool = "sha256sum on Linux and WSL2, shasum on macOS."
inputs = "{step}. Inputs: copy each file from the ctx root that drew this figure, then check its bytes."
root = "The ctx root these files sit in; change it if the folder moved."
params = "{step}. Figure parameters: the params file ctx figure reads, one comment per parameter."
generate = "{step}. Generate: ctx figure draws it with {plotting}, in {file}, read from the inputs alone."
check = "{step}. Check: the files written, then the data table against the page's."

# One comment per parameter of the params file.
[params]
figure = "The figure: cohort, module number and figure kind."
dataset = "The dataset slug in every output name."
contrast = "The contrast, by its name in the dataset file."
x = "The contrast on the horizontal axis."
y = "The contrast on the vertical axis."
lesson = "The lesson, by its title in the dataset file's de lessons."
basis = "The p the call rule reads: padj, padj_by, padj_holm, padj_bonferroni or pvalue."
alpha = "The cutoff on that p, strict."
lfc_min = "The smallest absolute raw log2 fold change called."
gene_set = "The gene set, as the gene-set file names it."
pca = "The PCA, by its name in the dataset file's de pca list."
# M2
metric = "The registry metric the strip draws, by its id."
plot = "The FastQC plot, by its figure's name."
# M3
comparison = "The comparison of two counters, by its name in M3's tables."
# M7, M9
gene = "The gene: an M7 worked gene by its proteo symbol, or an M9 card as its files name it."
inputs = "Each input file, in this folder."
sha256 = "Each input's SHA-256; ctx figure refuses a file whose bytes differ."

# One comment per input; a name ending in a contrast takes the `_each` line.
[inputs]
samplesheet = "M1's curated sample sheet."
dataset_file = "The dataset file the module read."
qc_registry = "The QC registry, which holds ENCODE's depth standard."
results = "M5's results table of the contrast."
results_x = "M5's results table of the horizontal contrast."
results_y = "M5's results table of the vertical contrast."
results_each = "M5's results table of one contrast of the lesson."
size_factors = "M5's size factors: each fit's samples, donors and groups."
gsea = "M6's GSEA table of the contrast."
gsea_each = "M6's GSEA table of one contrast."
ora = "M6's over-representation table of the contrast."
counts = "M1's gene counts, one column per sample."
genes = "M1's genes: identifiers and symbols, in the annotation's order."
dispersions = "M5's dispersions of the contrast's fit."
gene_sets = "The gene-set file ctx setup fetched."
# M2
registry = "The QC registry the run read."
figure_options = "The module's options as its run was given them."
metrics = "M2's values, one row per sample."
bands = "M2's MAD bands per metric and stratum."
flags = "M2's flags: each sample and the metric that flagged it."
status = "M2's status per run."
pca_scores = "M2's PCA scores of the blind VST."
pca_share = "M2's variance shares of the two components."
sex_check = "M2's sex check: recorded sex against expression."
fates = "The module's fates table: what became of each sample's reads."
fastqc_curves = "M2's copy of FastQC's plot data, read 1."
fastqc_theoretical = "M2's copy of MultiQC's theoretical GC curve."
fastqc_overrepresented = "M2's copy of the top overrepresented sequence's share."
grid = "M2's fastp grid on one run."
read_metrics = "M2's read values, one row per run."
# M3
alignment = "M3's alignment table, one row per sample."
outcomes = "M3's reads per outcome of each sample's bar."
setting_outcomes = "M3's reads per outcome of each setting's bar."
strandedness = "M3's reads assigned at each strand setting."
concordance = "M3's agreement of each comparison."
sums = "M3's gene sums of each comparison."
gene_comparison = "M3's counts of each gene by both counters."
groups = "M3's sheet groups the bars filter by."
# M4
figure_sheet = "M4's sheet as its figures name it."
contrast_samples = "M4's copy of the featured contrast's samples and levels."
fold_changes = "M4's fold changes from both counts of each gene."
# M7
proteo_options = "M7's options as the run was given them."
proteo_genes = "M7's genes in both layers, with every per-gene number and class."
abundance = "M7's RNA abundance per gene, which the tertiles are cut on."
protein_samples = "M7's protein samples, each with its bar colour and group."
protein_present = "M7's protein layer as presence: 1 where a cell holds a value."
paired_annotation = "M7's annotation of the samples in both layers."
drawn_rows = "M7's RNA and protein of the genes the worked and paired figures draw."
worked_samples = "M7's tumour and normal columns of the worked figures."
contrast_folds = "M7's genes of the contrast tested at both layers."
contrast_summary = "M7's protein samples per group and fold-change correlation of the contrast."
# M8
gene_biotypes = "M8's annotation record of each count row, with its biotype group."
mirna_results = "M8's miRNA fit: one row per mature miRNA, with its name."
mirna_samplesheet = "M1's miRNA sample sheet: one row per small-RNA library."
mirna_mature_counts = "M1's mature miRNA counts, one column per small-RNA library."
targetscan_predictions = "TargetScan's default predictions, the file ctx setup fetched."
targetscan_families = "TargetScan's miRNA family file, the file ctx setup fetched."
targetscan_genes = "TargetScan's gene file, the file ctx setup fetched."
mirtarbase_strong = "miRTarBase's strong-evidence targets, the file ctx setup fetched."
# M9
evidence_listed = "M9's copy of M5's rows for every listed gene, cards left off the page included."
evidence = "M9's copy of M5's rows for the genes on the page."
own_values = "M9's M5 normalised values of the genes on the page, each contrast in words."
own_family = "M9's box tests in the featured contrast, BH over the listed genes."
tissues = "M9's GTEx tissue summaries of the genes on the page, by sex."
exons = "M9's GTEx exon shares of the genes on the page, per tissue."
exons_dropped = "M9's count of GTEx samples with no exon read, per gene."
junctions = "M9's GTEx V10 junction medians of the genes on the page."
mane = "M9's MANE Select exons, from the GTF and from Ensembl REST."
immune = "M9's HPA immune cell nTPM of the genes on the page."
genecard_options = "M9's options as the run was given them: the HPA release."

[readme]
title = "Figure"
id = "Figure ID"
drawn = "Drawn by"
drawn_value = "`{plotting}` in `{file}`"
redraw = "Redraw"
redraw_value = "`ctx figure {figure_id} --params <params file>`, the params file in the page's Reproduce panel"
