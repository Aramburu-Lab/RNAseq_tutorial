# M1 Gather page (ctx gather). Placeholders in {braces} are filled by the code; keep their names.

title = "M1 Gather: {dataset}"
budget = "Track B: under {minutes} min and {ram_gb} GB"
purpose = "Verify the nf-core/fetchngs download against its own records and ENA's checksums, and build the sample sheet every later module reads."
input = "One nf-core/fetchngs outdir (`samplesheet/`, `fastq/`, `fastq/md5/`, `metadata/`, `pipeline_info/`), the dataset file and its SDRF, and, with `--rnaseq-dir`, an nf-core/rnaseq outdir with the gene counts."
method = """A fetchngs run can end with files missing or corrupt, and one experiment can hold several runs. Each FASTQ is checked against the md5 that ENA publishes; runs fetched through sra-tools have none.

ENA metadata is free text, so the SDRF supplies donor, cell type and condition, joined on the run accession and mapped to fixed levels. Read length is ENA's base count over its read count, per mate; the dataset file bins it into batches."""
interpretation = """Resolve every problem the checks report before any analysis; a mismatched or missing file stops gather. From here on, the sample sheet is the only record of what each sample is. Runs of one experiment are technical replicates, combined before counting.

Where read length splits the groups, batch and group are confounded: compare within a batch, or put batch in the design. A run below the ENCODE lines is noisier, not wrong: DESeq2's size factors correct depth."""
# "Term: rest" in a mistake prints Term in bold.
pitfalls = [
    "Treating the runs of one experiment as biological replicates: they are one library, sequenced more than once.",
    "Re-running fetchngs into an existing outdir: it rebuilds the samplesheet from the new input only.",
    "Expecting size factors to fix a failed library: they correct depth, not quality.",
]

[[terms]]
term = "Run"
meaning = "One sequencing run, one accession such as SRR or ERR, with one or two FASTQ files."

[[terms]]
term = "Experiment"
meaning = "The library a run was sequenced from; one experiment can hold several runs."

[[terms]]
term = "no_md5"
meaning = "Fetched through sra-tools, which publishes no checksum to verify against."

[[terms]]
term = "ENA read count"
meaning = "The reads ENA reports for a run: sequenced reads, a read pair counted once."

[[terms]]
term = "Aligned reads"
meaning = "The reads an aligner places on the genome; never more than the reads sequenced."

[[questions]]
prompt = "Why does gather find FASTQ files by name, not by the path in samplesheet.csv?"
answer = "fetchngs writes each path on the machine that ran it; after a copy to a laptop or from Zenodo, that path no longer exists."

[[questions]]
prompt = "Why is a run with no md5 file reported, not rejected?"
answer = "sra-tools fetches the runs that have no FASTQ at ENA and writes no md5. The file is usable but was never checked against a published checksum."

[[questions]]
prompt = "Why can a run above ENCODE's line still miss the standard?"
answer = "ENA counts sequenced reads and ENCODE counts aligned reads. Reads from adapters, rRNA or low-quality bases may not align, so the aligned count is lower."

# The four numbers at the top of Results.
[keys]
runs = "Runs"
experiments = "Experiments"
on_disk = "FASTQ files on disk"
none = "none"
unlisted = "Unlisted FASTQs"
unlisted_detail = "in fastq/, in no row"

[checks]
title = "Download checks"
columns = ["Check", "Result"]
none = "none"
source = "Source"
source_value = "nf-core/fetchngs {fetchngs} (commit {commit}), Nextflow {nextflow}"
by_status = "FASTQ files by status"
multi_run = "Experiments with more than one run"
wide = "Runs with more than two ENA files"
unlisted = "FASTQ files that no row names"
curation = "Curation"
not_curated = "Not curated: without --dataset-file, donor, cell type, condition, replicate and batch stay empty."

[curation]
title = "Curation"
join = "Join"
# The join sentence is these three parts; the middle one only when the SDRF is cross-checked.
joined = "Curation from {file}: each of {runs} runs joined to one SDRF row on {column}, in both directions"
agrees = "; {checked} agrees for every run"
mapped = "; every value is in the dataset file's value maps."
read_length = "Read length"
batch = "Batch"
all = "all"
repeated = "Repeated runs"
repeated_one = "{n} run beyond the first of a donor, cell type and condition"
repeated_many = "{n} runs beyond the first of a donor, cell type and condition"

[counts]
title = "Counts"
matrix = "Matrix"
matrix_value = "{genes:,} genes by {samples} samples, the length-scaled gene matrix"
source = "Source"
source_value = "nf-core/rnaseq {rnaseq}, Salmon {salmon}"
rounded = "Rounded"
rounded_value = "{fractional:,} of {values:,} values were fractional and were rounded half to even"
stored = "Stored as"
stored_value = "{kind}, {bytes:,} bytes in memory"

[samples]
group = "Samples"

[figures.composition]
title = "Samples by cell type and condition"
lead_one = "{groups} groups; the smallest, {name}, has {runs} run, which limits what any contrast on it can find."
lead_many = "{groups} groups; the smallest, {name}, has {runs} runs, which limits what any contrast on it can find."
bars = "Each bar is one cell type and condition; its length counts the runs in it."
# Shown only when the runs fall in more than one batch.
batches = "Colour splits each bar by batch: {batches}. A group found in one batch only is confounded with that batch."
individuals = "Hover a bar for the individuals behind it; one individual can give several cell types, so individuals do not add up across bars."
caption = "{runs} runs from {individuals} individuals, by cell type, condition and batch; counts, no test. An individual can give several cell types, so individuals do not add up across bars."
category = "Cell type and condition"
value = "Runs"

[figures.library]
title = "Sequencing depth per run"
lead = "The median run has {depth} reads. {below} of {runs} runs have fewer than {good} million, ENCODE's standard for aligned reads."
depth_millions = "{millions:.1f} million"
# The reading guide: the bars, their order and colour, the lines.
bars = "Each bar is one run: the reads ENA reports for it, a read pair counted once, in millions."
batched = "Runs are grouped by read-length batch and sorted by depth: {lengths}."
batch_lengths = "{batch} holds runs of {lengths} nt"
sorted = "Runs are sorted by depth."
lines = "Dashed and dotted lines: ENCODE's aligned-read standards; not every read aligns, so a run below a line cannot meet it. Solid line: the median of the runs shown."
caption = "Reads per run as ENA reports them, a read pair counted once; no test. {medians}. ENCODE's standard counts aligned reads, so a run below {good} million cannot meet it after alignment, and one above may still miss it."
batch_median = "{batch}: n = {n} runs, median {median:,.0f} reads"
category = "Run, by batch and depth"
value = "Reads"
# The legend of the lines; the values come from conf/qc_metrics.toml, total_sequences.
good = "ENCODE: {millions:g} million aligned reads"
usable = "ENCODE, older projects: {millions:g} million"
median = "Median of the runs shown"
