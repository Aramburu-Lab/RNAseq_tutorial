# The M3 page on nf-core/rnaseq's alignment (ctx process --rnaseq-dir; D-116). Placeholders
# in {braces} are filled by the code; keep their names. The counter figures' words are
# content/process.toml's, which draws them on both routes.

title = "M3 Align and count: {dataset}"
budget = "Track A: under {minutes} min and {ram_gb} GB"
reproduce_note = "nf-core/rnaseq aligned, counted and ran MultiQC on the cluster; this command read its outputs and ran no tool."
undefined = "not defined"
purpose = "Read how each sample's reads aligned, which strand they came from, how complex the [[library]] is, and how two quantifications of the same reads differ."
input = "{samples} samples of the `ctx gather` sheet, aligned by nf-core/rnaseq {release} with [[STAR]] to `{fasta}` and `{gtf}`. Its own [[MultiQC]] tables and [[Salmon]] matrices hold every number."
method = """nf-core/rnaseq trimmed the reads with Trim Galore and aligned them with [[STAR]], a splice-aware [[aligner]]. samtools, RSeQC, Qualimap, [[dupRadar]], Preseq and [[featureCounts]] checked the alignment. Every number here is the pipeline's own, read from its [[MultiQC]] tables.

[[Salmon]] quantified each sample twice: on STAR's alignment, and alone by [[pseudoalignment|selective alignment]]. [[Spearman|Spearman's ρ]] measures whether the two rise together; Bland and Altman's bias and limits measure how far apart they are."""
interpretation = """[[uniquely mapped reads|Uniquely mapped reads]] range from {low} % to {high} % of [[STAR]]'s input reads. Compare samples with each other before any genome-wide band.

Take the [[library]]'s strand from RSeQC's shares and nf-core's check, never from the kit name.

A library whose curve flattens early in Preseq holds few distinct molecules: more reads add [[duplicated reads|duplicates]]. In [[dupRadar]], duplication that rises at low expression points to amplification, not to expression.

A correlation near one beside a nonzero bias means one quantification gives some genes more reads."""
pitfalls = [
    "Choosing the strand from the kit name: protocols differ between kit versions; read RSeQC's shares.",
    "Reading high [[duplicated reads|duplication]] as a fault: highly expressed genes duplicate reads in every RNA-seq [[library]].",
    "Reading a high [[Spearman|ρ]] as agreement: two quantifications can rank genes alike and still differ.",
]

[[terms]]
term = "Uniquely mapped"
meaning = "A read STAR aligned to one locus only."

[[terms]]
term = "Sense and antisense"
meaning = "RSeQC's share of sampled reads on a gene's own strand, or on the opposite one; undetermined reads lie where genes of both strands overlap."

[[terms]]
term = "Library complexity"
meaning = "How many distinct molecules a library holds: Preseq extrapolates the distinct ones expected at more sequencing."

[[terms]]
term = "Bias and limits of agreement"
meaning = "Bland-Altman's mean difference between two measurements, and that mean plus or minus `1.96` standard deviations of the differences."

[[questions]]
prompt = "RSeQC puts most reads on the antisense strand. Which [[library type]] is this, and which Salmon library type matches it?"
answer = "Reverse-stranded: read 1 lies opposite the gene. Salmon calls it SR single-end or ISR paired-end."

[[questions]]
prompt = "Two samples share a depth, yet one Preseq curve flattens far below the other. What does that sample lack?"
answer = "Distinct molecules: more sequencing of it adds duplicate reads, not new fragments."

[[questions]]
prompt = "Salmon on STAR's alignment and Salmon alone give [[Spearman|ρ]] near `1`. Are their counts interchangeable?"
answer = "No. ρ compares ranks; the agreement plot shows the bias and the genes that differ between them."

[notes]
no_annotation = "The dataset file declares no annotation, so the counter figures colour every gene as one type."

