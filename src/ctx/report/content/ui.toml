previous = "Previous"
next = "Next"
pages = "Genes {first} to {last} of {total}"
pages_none = "No gene matches the search."
copy_list = "Copy list"
copied = "Copied"
selected_text = "Selected: copy it with the keyboard"
save_list = "Save list"
beside = "Open beside"
