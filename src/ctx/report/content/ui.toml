module = "Module"
module_n = "Module {n}"
figure = "Figure"
figure_n = "Figure {n}"
not_run = "Not run yet:"
written = "Written"

# The report skeleton's headings, in the order CONVENTIONS.md fixes; the keys are anchors.
[sections]
