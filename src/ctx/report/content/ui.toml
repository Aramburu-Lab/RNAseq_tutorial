# Words the page templates print on every page: headings, buttons, labels and table heads.
# Placeholders in {braces} are filled by the code; keep their names.

suite = "Cancer Transcriptomics Teaching Suite"
skip = "Skip to the content"
dataset = "Dataset"
module = "Module"
module_n = "Module {n}"
figure = "Figure"
figure_n = "Figure {n}"
not_run = "Not run yet:"
written = "Written"

# The report skeleton's headings, in the order CONVENTIONS.md fixes; the keys are anchors.
[sections]
purpose = "Purpose"
input = "Input"
method = "Method"
parameters = "Parameters"
results = "Results"
interpretation = "Interpretation"
questions = "Questions"
pitfalls = "Pitfalls"
reproduce = "Reproduce"

[theme]
toggle = "Switch between light and dark"
light = "Light"
dark = "Dark"

[contents]
label = "Contents"
title = "On this page"

[page]
terms = "Terms used on this page"
answer = "Answer"

[cards]
parameter = "Parameter"
default = "Default"
meaning = "What it does"
effect = "If you change it"
report = "Parameters of ctx report"

[reproduce]
button = "Copy"
copied = "Copied"
selected = "Selected: press Ctrl+C or Cmd+C"
wall = "Wall time"
rss_self = "Peak memory, this process"
rss_children = "Peak RSS, largest child process"
profile = "Profile"
budget = "Budget"
inputs = "Inputs"
versions = "All {n} package versions"

# A block of commands or a script on a page (builder.Code): the hash of exactly the text shown.
[code]
sha256 = "SHA-256 of this text:"

[figures]
reading = "How to read this"
reading_label = "How to read this figure"
open = "Open alone"
back = "Back to the module page"
data = "Data (CSV)"
columns = "Column meanings"
# Shown above a plot wider than its box: one kept at its least legible width, as the parallel
# sets on a phone, or opened alone at twice its type in a window too narrow for it.
scroll = "Wider than this window: scroll the figure sideways to see all of it."

# Ends the page caption of a scatter that draws fewer points than its figure files
# (ScatterData.caption_text): every point always drawn, then every nth unit of the rest, in
# order of the y axis. {rest} names the rest in the figure's own words, else callable (live
# calls) or other. units: a gene's raw and shrunk estimates, say, drawn or left out together.
[thinned]
rows = "This page draws {drawn:,} of the {units:,} {rest}, every {nth} in order of {order}; the CSV holds all {total:,}."
units = "This page draws all points of {drawn:,} of the {units:,} {rest}, every {nth} in order of {order}; the CSV holds all {total:,} points."
heatmap = "This page draws {drawn:,} of the {units:,} rows and their columns, every {nth} in the drawn order; the files and the CSV hold all {total:,} cells."
callable = "points no setting can call"
other = "other points"

# The PDF and SVG buttons of a figure with page controls: at the defaults they link the figure
# files; once a control is moved, they draw the view as set (D-033).
[export]
view = "{kind} of this view"
reference = "The figure file, drawn at the default settings"
view_title = "Drawn now from the figure as set, at the figure file's width and type"
# Closes the caption of a file drawn from the page (D-051 plan, question 1, Rytis 2026-10-01).
note = "Drawn in the browser from the view as set on the page, at the figure files' width."

# Linked brushing: paint samples in one view, see them in the other.
[brush]
label = "Paint samples"
colour = "Paint colour"
erase = "Clear"
how = "Draw a lasso round points, or tap a category or band below them."
noscript = "Turn on JavaScript to paint samples."

# The volcano's cutoff controls.
[calls]
label = "Cutoffs for calling genes"
fc = "Fold change at least"
fc_input = "Fold-change threshold"
fc_unit = "Fold-change unit"
log2 = "log2 FC"
pct = "% change"
basis = "Significance"
cutoff = "Below"
cutoff_input = "Cutoff; the arrow keys step through {presets}"
stricter = "Stricter: the next smaller cutoff"
looser = "Looser: the next larger cutoff"
reset = "Reset"
noscript = "This is the default rule; turn on JavaScript to move the cutoffs."

# Bars filtered by the values of a column; the page script fills summary again on each change.
[filter]
label = "Show only"
all = "All"
summary = "{shown} of {total} bars shown; median {median}."
# Where the median of the bars shown is no number a reader asks for (BarData.summary_median).
summary_count = "{shown} of {total} bars shown."
none = "No bar matches these filters."
noscript = "This shows every bar; turn on JavaScript to filter them."

# M8's pair select: one lncRNA and its neighbour, drawn and correlated on the page.
[pairs]
label = "Choose a pair"
pair = "lncRNA and neighbour"
noscript = "This shows the first pair; turn on JavaScript to choose another."

# M10's survival panel: score a gene list on the page (GS.7). Its sentences are clinical.toml's.
[survival]
screen = "Score the {rows} strongest screen genes"
label = "Score a gene list"
endpoint = "Endpoint"
split = "Split"
genes = "Genes"
genes_hint = "Symbols or Ensembl IDs, any separator"
score = "Score"
undo = "Undo"
reset = "Build list"
noscript = "This shows the build list; turn on JavaScript to score another list."

# Pages drawing GDC data name the project and cite the GDC, as the GDC's FAQ "How do I cite the
# NCI GDC?" asks (https://gdc.cancer.gov/about-gdc/gdc-faqs, read 2026-10-09): "Please credit
# the NCI Genomic Data Commons (GDC) in your manuscript" by Heath et al. 2021; for a project,
# "refer to the attribution policies of the project". ctx.gather.gdc.acknowledgement fills them.
[gdc]
commons = "Data of {project} were retrieved from the NCI Genomic Data Commons, {release}. The GDC is cited as Heath et al. 2021, The NCI Genomic Data Commons, Nat Genet 53, 257-262, doi:10.1038/s41588-021-00791-5."

# Each project's own attribution sentence, keyed by the dataset file's gdc.attribution. TCGA's,
# verbatim from https://www.cancer.gov/ccg/research/genome-sequencing/tcga/using-tcga-data/citing
# (posted 2019-03-06, read 2026-10-09), "shown" chosen from its "<published or shown>".
[gdc.attribution]
tcga = "The results shown here are in whole or part based upon data generated by the TCGA Research Network: https://www.cancer.gov/tcga."

# A gene list carried in a link (ctx.report.genes, D-049): why a page refuses one. The
# placeholders are filled from the link, numbers grouped by thousands.
[select]
long = "The link holds {length} characters; a gene list may take at most {limit}."
form = "The link holds no gene list in the form #v={version}&src=dataset:contrast&n=count&g=genes&end."
version = "The link holds a version {found} gene list; this page reads version {expected}."
cut = "The link does not end with its end mark: it was cut short or has text added after it. Copy the whole link again."
source = "The link names its source {found}; a source is a dataset and a contrast, as dataset:contrast."
source_empty = "The link names no source; a source is a dataset and a contrast, as dataset:contrast."
n = "The link gives its gene count as {found}; a count is up to {digits} digits, with no leading zero."
n_empty = "The link gives no gene count; a count is up to {digits} digits, with no leading zero."
count = "The link gives a gene count of {expected}, but its list holds {decoded}: it was edited."
number = "The link holds {found} where a gene number belongs."
number_empty = "The link's gene list has an empty entry where a gene number belongs."
duplicate = "The link names {gene} twice."
order = "The link names {gene} out of order: genes follow in ascending number."

