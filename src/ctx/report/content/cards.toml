# Parameter cards: what each command-line option means (also its --help text), and what
# changes if you move it. [effects.<command>] overrides the effect on one command.

[options."--profile"]
meaning = "Where this runs: laptop or hpc. Unset: CTX_PROFILE, else laptop."
effect = "Changes threads and memory, never results; hpc reads both from Slurm."

[options."--root"]
meaning = "Project directory for all outputs. Unset: CTX_ROOT, else working directory on laptop."
effect = "Moves every output; hpc stops unless this or CTX_ROOT is set."

[options."--dataset"]
meaning = "Dataset short name: lowercase words joined by underscores, in every output name."
effect = "Renames every output and selects which earlier outputs this command reads."

[options."--fetchngs-dir"]
meaning = "The nf-core/fetchngs outdir holding the FASTQ files. Unset: <root>/data/raw/<dataset>."
effect = "Reads another download; nothing is ever written into it."

[options."--dataset-file"]
meaning = "The dataset file, conf/datasets/<slug>.toml: resources, curation, contrasts, gene sets, sanity rules."
effect = "Changes what this command reads; each page names what it uses."

[options."--min-count"]
meaning = "Gene filter, edgeR filterByExpr min.count: reads required at median [[library size]]."
effect = "Higher tests fewer, better-measured genes; weakly expressed genes are not tested."

[options."--lfc-shrink"]
meaning = "Also estimate apeGLM [[log2 fold change|log2 fold changes]], shrunk toward zero by uncertainty."
effect = "Off: shrunk columns empty, MA plot raw; p-values and calls unchanged."

[options."--rnaseq-dir"]
meaning = "An nf-core/rnaseq outdir, Salmon only. Unset: none is read."
effect = "Set: gather checks release and samples, then writes rounded length-scaled counts."

[options."--gdc-dir"]
meaning = "A GDC project folder of STAR counts, clinical records and annotations."
effect = "Set: gather checks it and takes one file per patient."

[options."--endpoint"]
meaning = "Survival endpoint from TCGA-CDR: OS, DSS, DFI or PFI. Unset: dataset file's."
effect = "Changes which events count; OS needs the longest follow-up."

[options."--split"]
meaning = "How a gene score groups patients: median or tertiles."
effect = "Tertiles compare extremes; a scanned cut-off needs the corrected p."

[options."--horizon"]
meaning = "Months up to which [[RMST|restricted mean survival]] is compared."
effect = "A later horizon uses more follow-up but fewer patients at risk."

[options."--covariates"]
meaning = "Comma-separated patient columns the adjusted Cox model adds: age, stage."
effect = "Adding stage removes the prognosis a score shares with stage."

[options."--cox-strata"]
meaning = "Comma-separated patient columns given their own Cox baseline hazard."
effect = "Handles a variable that breaks proportional hazards, without estimating it."

[options."--genes-from"]
meaning = "A gene list file: symbols or Ensembl IDs, as Save list writes."
effect = "Scores this list in the static files; unset, the dataset file's list."

[options."--genes"]
meaning = "Comma-separated gene symbols or Ensembl IDs, one card each."
effect = "Replaces the default list; an ambiguous or unknown name stops the run."

[options."--contrast"]
meaning = "M5 contrast whose top up and down calls join the default list."
effect = "Changes which top calls get cards; unset, the featured contrast."

[options."--hpa-release"]
meaning = "Human Protein Atlas major release every HPA request names."
effect = "Another release can change values, antibodies and categories."

[options."--offline"]
meaning = "Read only `resources/cache/`; make no request."
effect = "On: an uncached response leaves its panel unavailable, named."

[options."--refresh"]
meaning = "Move each gene's cached responses aside, then fetch them again."
effect = "On: newer provider data replace the cache; old copies kept dated."

[options."--min-log2cpm"]
meaning = "Expression filter: a gene's median log2 [[CPM]] over the patients, at least."
effect = "Higher keeps fewer, better-measured genes; each dropped gene is counted."

[options."--registry"]
meaning = "The QC registry of metrics, bands and sources. Unset: CTX_QC_REGISTRY, else conf/qc_metrics.toml."
effect = "Samples are judged against its bands; the page names the file used."

[options."--strata"]
meaning = "Comma-separated sheet columns defining strata for each metric's median and [[MAD]]."
effect = "Finer: fewer, closer samples per band; adding condition hides its effect."

[options."--peers"]
meaning = "Comma-separated sheet columns defining peer groups for agreement and [[PCA]] distance."
effect = "Wider groups score biology as disagreement; a lone sample has no value."

[options."--mad"]
meaning = "Flag distance, in scaled [[MAD|MADs]] from the stratum median. Unset: registry's mad_multiplier."
effect = "Lower flags more samples, higher fewer; nothing is ever excluded."

[options."--reads"]
meaning = "Also run FastQC, fastp and seqkit on each run's FASTQ files."
effect = "On: base-quality curves and the fastp grid, at minutes per million reads."

[options."--fastp-q"]
meaning = "fastp -q: a base below this [[Phred]] quality counts as unqualified."
effect = "Higher: more unqualified bases, so more reads fail -u; see the grid."

[options."--fastp-u"]
meaning = "fastp -u: reads above this percentage of unqualified bases are dropped."
effect = "Lower drops more reads for quality."

[options."--fastp-l"]
meaning = "fastp -l: a read shorter than this after trimming is dropped."
effect = "Higher drops more reads shortened by trimming; the grid shows where."

[options."--cut-tail"]
meaning = "fastp --cut_tail: trim tails whose sliding-window mean quality is below --cut-mean."
effect = "On: degraded tails are cut, so reads shorten and may fail -l."

[options."--cut-window"]
meaning = "fastp -W: the sliding window --cut-tail averages over, in bases."
effect = "Wider smooths over single bad bases; only used with --cut-tail."

[options."--cut-mean"]
meaning = "fastp -M: the mean quality below which --cut-tail cuts."
effect = "Higher cuts more of each tail; only used with --cut-tail."

[options."--grid-run"]
meaning = "Run shown in fastp's -q by -l grid. Unset: first run read."
effect = "Pick a suspect run to see which settings keep its reads."

[options."--genome"]
meaning = "Genome FASTA, plain or gzipped; its contig names select the [[annotation|GTF]] lines."
effect = "A partial genome lowers the mapping rate; genome-wide bands stop applying."

[options."--aligner"]
meaning = "`star` or `hisat2`; [[HISAT2]] on Apple silicon, where pinned [[STAR]] fails."
effect = "HISAT2 adds an unspliced alignment and drops the STAR comparison."

[options."--strandedness"]
meaning = "`auto`, `unstranded`, `forward` or `reverse`: the [[featureCounts]] `-s` counted at."
effect = "All three settings are always counted; this picks the one used."

[options."--multimap-max"]
meaning = "Most loci a [[multimappers|multimapper]] may align to; unset keeps STAR's `10`."
effect = "Lower turns more multimappers into unmapped too-many-loci reads."

[options."--settings"]
meaning = "Extra featured-sample alignments, comma-separated: `cut` (half the genome), `untrimmed`."
effect = "Each token adds one alignment and one bar to the mapping figure."

[options."--featured-sample"]
meaning = "The sample aligned again under each setting. Unset: the sheet's first sample."
effect = "Pick a suspect sample to see how each setting changes it."

[options."--reads-per-run"]
meaning = "Reads kept per run by `seqkit sample`, seed `42`. Unset: every read."
effect = "Fewer reads run faster; gene counts grow noisier."

[options."--compare-dataset"]
meaning = "A dataset slug whose Salmon counts and qc metrics cover these samples."
effect = "Adds each sample's expected share of reads and Salmon's strand call."

[options."--salmon-dir"]
meaning = "Salmon's per-sample folders with quant.sf. Unset: data/raw/<dataset>_salmon, if present."
effect = "Set or present: gene and transcript figures, and ctx's gene counts."

[options."--counts-from-abundance"]
meaning = "How ctx's [[tx2gene|tximport]] port makes gene counts from transcript estimates."
effect = "The value no keeps Salmon's estimates, which shift with isoform use."

[effects.setup]
"--dataset-file" = "Set: fetches each resource, keeping it only if size and SHA-256 match."

[effects.gather]
"--dataset-file" = "Set: curates each run from the SDRF; any problem stops gather."
"--dataset" = "Renames every output. Unless --fetchngs-dir is set, gather reads <root>/data/raw/<dataset>."

[effects.report]
"--dataset-file" = "Set: the hub also shows the verdict of each sanity rule."

[effects.qc]
"--fetchngs-dir" = "With --reads: FASTQ paths resolve against it; nothing else there is read."
"--rnaseq-dir" = "Set: adds read fates and judges trimming and mapping. Unset: counts only."
"--dataset-file" = "Selects the contrasts for confounding tests and the gene-type annotation."

[effects.process]
"--dataset" = "Selects the gather sheet and the FASTQ files this command reads."
"--dataset-file" = "Its `annotation_gtf`, SHA-256 checked, defines every gene counted."
"--fetchngs-dir" = "FASTQ paths resolve against it; nothing is written there."
"--registry" = "Its strand thresholds and start-codon bands decide the calls."
"--fastp-q" = "Higher: more unqualified bases, so fewer reads reach the aligner."
"--fastp-l" = "Higher drops short reads, which more often align to several loci."

[effects.quant]
"--rnaseq-dir" = "Its gene matrix and Salmon logs are read; nothing is written there."
"--dataset-file" = "Its `annotation_gtf` gives gene types; its featured contrast, the fold changes."

[effects.de]
"--dataset-file" = "Selects contrasts, designs, expected n, featured contrast, lessons and PCA subsets."

[effects.function]
"--dataset-file" = "Selects the gene sets tested, the featured set and its running score."

[effects.clinical]
"--dataset-file" = "Selects the build list, default endpoint and the published numbers shown."
"--dataset" = "Selects gather's GDC tables and renames every output."

[effects.genecard]
"--dataset-file" = "Supplies contrasts, box genes, the GTF and the GTEx files."
"--dataset" = "Selects gather's genes and the M5 results the cards read."
"--genes-from" = "Cards for an M5 table's genes or a saved list."
