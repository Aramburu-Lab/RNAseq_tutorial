# What `ctx run` prints in the terminal (ctx.pipeline); every string is held to the prose
# rules (ctx.report.prose).

# A module whose own command reads M5's results, when none are under the root and de is not
# in the plan. `contrasts` is the comma-separated list of contrasts without results.
left_out = "{module}: no M5 results for {slug}, contrast {contrasts}, and de is not planned; ctx run leaves {module} out."
