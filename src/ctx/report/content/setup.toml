# M0 Setup page (ctx setup). Placeholders in {braces} are filled by the code; keep their names.

title = "M0 Setup"
budget = "Track B: under {minutes} min and {ram_gb} GB"
purpose = "Record this computer's cores, memory, thread limit and package versions before any analysis runs on it; with `--dataset-file`, fetch and verify the dataset's resources."
input = "This computer: installed packages, the CPU count and physical memory the OS reports, installed fonts, and on `hpc` the Slurm allocation. With `--dataset-file`, each listed resource's URLs, size and [[checksum|SHA-256]]."
# method and interpretation are filled by ctx.setup: {laptop_cores} is runtime.LAPTOP_CORES,
# the rest are measured in the run.
method = "Every `ctx` command caps threads before polars and NumPy are imported: the CPU count up to {laptop_cores} on `laptop`, the Slurm allocation on `hpc`. `ctx setup` writes the version of every distribution the run imported to `outputs/00_setup/`, and measures each data colour's contrast on white. With `--dataset-file`, each resource is downloaded to `<dest>.part`, kept only if its size and [[checksum|SHA-256]] match, and listed in `resources/manifest.json`."
interpretation = "Track A is budgeted at {minutes} min and {ram_gb} GB on {laptop_cores} cores; this computer has {cores} cores, and its memory is {memory}. When a result changes between two runs, compare their versions tables before the code. {n_below} of {n_colours} data colours fall below {minimum} on white; give marks in those colours size, or a second cue such as shape."
# "Term: rest" in a mistake prints Term in bold.
pitfalls = [
    "Comparing timings across profiles: `laptop` and `hpc` run different thread counts.",
    "Quoting a version from memory: cite the versions table this run wrote.",
    "Editing a fetched resource in place: its [[checksum|SHA-256]] then differs, and the next `ctx setup --dataset-file` replaces it.",
]

[[terms]]
term = "Profile"
meaning = "`laptop` or `hpc`; it sets the threads and memory a run may use, never its results."

[[terms]]
term = "Peak RSS"
meaning = "Peak resident set size: the most physical memory a process held at once."

[[terms]]
term = "Child process"
meaning = "A program this run started, such as fastp; its memory is measured apart from this process."

[[terms]]
term = "SHA-256"
meaning = "A checksum of a file's bytes; a change to any byte changes it."

[[questions]]
prompt = "Why does Reproduce list the peak memory of the largest child process separately?"
answer = "Tools such as fastp run as child processes, and their memory is outside this process's peak. A computer runs out of memory on what both hold at once."

[[questions]]
prompt = "Why might a colleague's copy of the same figure use a different font?"
answer = "The chain takes the first installed family. Liberation Sans keeps Arial's letter widths; DejaVu Sans changes text widths, never the data."

[[questions]]
prompt = "Why are thread limits set before polars and NumPy are imported?"
answer = "Both size their thread pools when imported, so a limit set later changes neither. `ctx` stops if either was imported first."

# The four numbers at the top of Results.
[keys]
cores = "CPU cores"
cores_detail = "reported by the OS"
memory = "Memory"
memory_value = "{gib:.1f} GiB"
memory_missing = "not reported"
threads = "Threads"
threads_detail = "{profile} profile"
python = "Python"

[machine]
title = "This machine"
columns = ["Check", "Result"]
system = "System"
system_value = "{system} {release}, {machine}"
thread_pools = "Thread pools"
thread_pools_value = "polars thread pool: {polars}; BLAS thread pools: {blas}"
root = "Output root"
font = "Figure font"
font_value = "{font}, first found of {chain}"
font_missing = "none of the chain; matplotlib's default"

[colours]
title = "Data colours"
columns = ["Colour", "Contrast on white", "What the ratio means"]
ratio = "{ratio:.2f}:1"
unsafe = "not for text, thin lines or projection"
meets = "meets {minimum} for graphics"
below = "below {minimum}: marks need size, or a second cue such as shape"

[resources]
title = "Resources, recorded in {manifest}"
columns = ["Resource", "Bytes", "Checksum", "Source", "Retrieved"]
checksum = "sha256 {sha256}"
